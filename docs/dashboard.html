<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Word-Knight 闯关看板</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    :root { --bg:#2D1F0E; --panel:#3E2723; --gold:#FFD54F; --green:#66BB6A; --red:#EF5350; --text:#FFE0B2; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Press Start 2P',monospace; background: var(--bg); color: var(--text); min-height:100vh; padding:16px; }
    .wrap { max-width:1100px; margin:0 auto; }
    h1 { color:var(--gold); font-size:0.8em; text-align:center; margin:16px 0; text-shadow:2px 2px 0 #1A0E00; }
    h2 { color:var(--gold); font-size:0.55em; margin:16px 0 8px; }
    .panel { background:var(--panel); border:3px solid #5D4037; padding:12px; margin-bottom:12px; }
    table { width:100%; border-collapse:collapse; font-size:0.4em; }
    th, td { padding:6px 8px; border:2px solid #5D4037; text-align:center; }
    th { background:#4A3020; color:var(--gold); }
    td { color:#FFE0B2; }
    .green { color:var(--green); } .red { color:var(--red); } .gold { color:var(--gold); }
    .badge { display:inline-block; padding:2px 6px; border-radius:2px; font-size:0.8em; }
    .badge.g1 { background:#5D8C2E; color:#fff; } .badge.g2 { background:#1565C0; color:#fff; }
    .mc-btn { padding:8px 16px; font-family:inherit; font-size:0.45em; background:#C62828; color:#FFE0B2; border:2px solid #B71C1C; cursor:pointer; margin:4px; box-shadow:0 3px 0 #8E0000; }
    .mc-btn:hover { transform:translateY(-1px); }
    .mc-btn.grn { background:#2E7D32; border-color:#1B5E20; box-shadow:0 3px 0 #1B5E20; }
    .row-flex { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .stat-num { font-size:1.2em; color:var(--gold); }
    .refresh { font-size:0.45em; color:#888; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>📊 Word-Knight 闯关看板</h1>
  <div class="row-flex">
    <span class="refresh" id="lastUpdate"></span>
    <div>
      <button class="mc-btn grn" onclick="refresh()">🔄 刷新</button>
      <button class="mc-btn" onclick="clearLogs()">🗑️ 清空记录</button>
    </div>
  </div>

  <h2>🏆 角色总览</h2>
  <div class="panel"><table><thead><tr><th>角色</th><th>级别</th><th>游戏数</th><th>总分</th><th>平均分</th><th>最高分</th><th>最高连击</th><th>正确</th><th>错误</th><th>超时</th></tr></thead>
    <tbody id="summaryBody"><tr><td colspan="10">加载中...</td></tr></tbody></table></div>

  <h2>📅 每日统计</h2>
  <div class="panel"><table><thead><tr><th>日期</th><th>角色</th><th>游戏数</th><th>总分</th><th>最高连击</th></tr></thead>
    <tbody id="dailyBody"><tr><td colspan="5">加载中...</td></tr></tbody></table></div>

  <h2>📜 最近闯关</h2>
  <div class="panel"><table><thead><tr><th>时间</th><th>角色</th><th>级别</th><th>得分</th><th>连击</th><th>正确</th><th>错误</th><th>超时</th></tr></thead>
    <tbody id="recentBody"><tr><td colspan="8">加载中...</td></tr></tbody></table></div>
</div>

<script>
const API = window.location.hostname === 'localhost'
  ? 'http://localhost:3000'
  : window.location.origin;

async function refresh() {
  try {
    const r = await fetch(`${API}/api/dashboard`);
    const d = await r.json();
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleString('zh-CN');

    // Summary
    const sb = document.getElementById('summaryBody');
    if (!d.summary || !d.summary.length) { sb.innerHTML = '<tr><td colspan="10">暂无数据</td></tr>'; }
    else {
      sb.innerHTML = d.summary.map(s => `
        <tr>
          <td>${s.character_name}</td>
          <td><span class="badge ${s.level.toLowerCase()}">${s.level}</span></td>
          <td class="stat-num">${s.games}</td>
          <td class="gold">${s.totalScore}</td>
          <td>${s.avgScore}</td>
          <td class="gold">${s.bestScore}</td>
          <td>${s.bestCombo}</td>
          <td class="green">${s.correctWords}</td>
          <td class="red">${s.wrongWords}</td>
          <td>⏰ ${s.timeoutWords}</td>
        </tr>`).join('');
    }

    // Daily
    const db = document.getElementById('dailyBody');
    if (!d.daily || !d.daily.length) { db.innerHTML = '<tr><td colspan="5">暂无数据</td></tr>'; }
    else {
      db.innerHTML = d.daily.map(r => `
        <tr><td>${r.day}</td><td>${r.character_name}</td><td>${r.games}</td><td class="gold">${r.score}</td><td>${r.topCombo}</td></tr>`).join('');
    }

    // Recent
    const rb = document.getElementById('recentBody');
    if (!d.recent || !d.recent.length) { rb.innerHTML = '<tr><td colspan="8">暂无数据</td></tr>'; }
    else {
      rb.innerHTML = d.recent.map(r => `
        <tr>
          <td>${r.created_at}</td><td>${r.character_name}</td>
          <td><span class="badge ${r.level.toLowerCase()}">${r.level}</span></td>
          <td class="gold">${r.score}</td><td>${r.max_combo}</td>
          <td class="green">${r.words_correct}</td><td class="red">${r.words_wrong}</td><td>⏰ ${r.words_timeout}</td>
        </tr>`).join('');
    }
  } catch(e) { console.error(e); }
}

async function clearLogs() {
  if (!confirm('确认清空所有闯关记录？')) return;
  await fetch(`${API}/api/dashboard/clear`);
  refresh();
}

refresh();
</script>
</body>
</html>
