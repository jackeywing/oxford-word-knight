<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 Word-Knight | Phonics</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root{
    --dirt:#8B5E3C; --grass:#5D8C2E; --gold:#F9A825; --emerald:#43A047;
    --panel-bg:#C4A46C; --panel-border:#6D4C2E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Press Start 2P',-apple-system,sans-serif;
    background:linear-gradient(180deg,#87CEEB 0%,#B3E5FC 60%,#8B5E3C 60%,#6D4C2E 100%);
    min-height:100vh;overflow-x:hidden;image-rendering:pixelated;
    user-select:none;-webkit-user-select:none;
  }
  .clouds{position:fixed;top:0;left:0;width:100%;height:160px;pointer-events:none;z-index:0;overflow:hidden;}
  .cloud{position:absolute;background:#fff;border:3px solid #e0e0e0;box-shadow:4px 4px 0 #ddd;}
  .cloud:nth-child(1){width:120px;height:40px;top:30px;left:10%;animation:drift 25s linear infinite;}
  .cloud:nth-child(2){width:90px;height:32px;top:55px;left:50%;animation:drift 30s linear infinite;animation-delay:-10s;}
  .cloud:nth-child(3){width:70px;height:28px;top:20px;left:80%;animation:drift 22s linear infinite;animation-delay:-5s;}
  @keyframes drift{0%{transform:translateX(-200px)}100%{transform:translateX(calc(100vw + 200px))}}
  .app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:100vh;}

  .mc-panel{background:var(--panel-bg);border:4px solid var(--panel-border);
    box-shadow:inset -2px -2px 0 rgba(0,0,0,.2),inset 2px 2px 0 rgba(255,255,255,.15),0 4px 0 #4A3020,0 6px 14px rgba(0,0,0,.3);padding:12px;}

  .header{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;}
  .header h1{color:#FFE0B2;text-shadow:2px 2px 0 #5D4037;font-size:.82em;letter-spacing:1.4px;}
  .header .pick{font-size:1.15em;animation:pickBounce 1s ease infinite;display:inline-block;}
  @keyframes pickBounce{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-4px) rotate(5deg)}}
  .nav-tabs{display:flex;gap:6px;padding:8px;}
  .tab{flex:1;text-align:center;text-decoration:none;font-family:inherit;font-size:.46em;
    padding:12px 10px;background:#E0C9A6;color:#5D4037;border:2px solid #8D6E63;
    box-shadow:0 3px 0 #6D4C2E;transition:all .15s;line-height:1.4;}
  .tab:hover{transform:translateY(-2px);box-shadow:0 5px 0 #6D4C2E;}
  .tab.active{background:#FFD54F;color:#3E2723;border-color:#F9A825;box-shadow:0 3px 0 #C17900;}
  .speaker{display:flex;align-items:center;gap:8px;font-size:.44em;color:#5D4037;margin-bottom:10px;}
  .speaker .sp-face{font-size:1.7em;line-height:1;}

  .char-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .char-row label{color:#3E2723;font-size:.46em;}
  .char-card{width:50px;height:64px;background:#E0C9A6;border:2px solid #8D6E63;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 #6D4C2E;transition:all .2s;}
  .char-card:hover{transform:translateY(-2px);}
  .char-card.selected{border-color:#FFD54F;box-shadow:0 0 0 3px rgba(255,213,79,.45),0 2px 0 #6D4C2E;}
  .char-card .face{font-size:1.45em;} .char-card .name{font-size:.32em;color:#3E2723;}

  .hud{display:flex;gap:6px;flex-wrap:wrap;}
  .hud-item{flex:1;min-width:55px;background:#5D4037;border:2px solid #3E2723;padding:6px 8px;color:#FFE0B2;text-align:center;box-shadow:0 2px 0 #3E2723;}
  .hud-item .val{font-size:.78em;margin-top:2px;color:#FFD54F;} .hud-item .lbl{font-size:.33em;opacity:.75;}
  .xp-wrap{width:100%;height:14px;background:#3E2723;border:2px solid #4A3020;position:relative;}
  .xp-fill{height:100%;background:linear-gradient(90deg,#66BB6A,#AED581);transition:width .4s;}
  .xp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.36em;color:#FFE0B2;text-shadow:1px 1px 0 #000;}

  .path-box{position:relative;height:104px;background:linear-gradient(180deg,#87CEEB 0%,#B3E5FC 55%,#7C9C3A 55%,#8B5E3C 100%);border:3px solid #4A3020;overflow:hidden;}
  .path-nodes{position:absolute;bottom:40px;left:24px;right:24px;display:flex;align-items:center;height:28px;}
  .path-line{height:5px;background:#8D6E63;flex:1;margin:0 -1px;border-top:1px solid #A1887F;border-radius:2px;}
  .pn{flex-shrink:0;width:26px;height:26px;border:2px solid #4A3020;display:flex;align-items:center;justify-content:center;font-size:.75em;transition:all .3s;background:#BDBDBD;}
  .pn.actv{background:#FFD54F;border-color:#F9A825;transform:scale(1.18);animation:glow .7s ease infinite alternate;}
  .pn.ok{background:#66BB6A;border-color:#388E3C;} .pn.bad{background:#EF5350;border-color:#C62828;}
  @keyframes glow{0%{box-shadow:0 0 4px rgba(255,213,79,.6)}100%{box-shadow:0 0 14px rgba(255,213,79,.9)}}
  .char-sprite{position:absolute;bottom:22px;font-size:2.1em;transition:left .6s cubic-bezier(.34,1.56,.64,1);z-index:10;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3));pointer-events:none;}
  .char-sprite.jump{animation:charJump .5s ease;}
  @keyframes charJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px) rotate(-5deg)}}

  .ch-area{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ch-card{background:#FFF8E1;border:4px solid #8D6E63;box-shadow:0 5px 0 #5D4037,0 6px 14px rgba(0,0,0,.2);padding:18px;width:100%;max-width:680px;animation:cardIn .4s ease;}
  @keyframes cardIn{0%{transform:translateY(14px) scale(.96);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

  .timer-wrap{width:100%;height:12px;background:#E0E0E0;border:2px solid #BDBDBD;position:relative;border-radius:2px;overflow:hidden;}
  .timer-bar{height:100%;width:100%;background:#66BB6A;transition:width 1s linear,background .5s;border-radius:1px;}

  .type-badge{display:inline-block;background:#5D4037;color:#FFE0B2;font-size:.36em;padding:4px 8px;letter-spacing:1px;margin-bottom:10px;border:2px solid #3E2723;}
  .type-badge.phoneme{background:#1565C0;border-color:#0D47A1;}
  .type-badge.phonics{background:#6A1B9A;border-color:#4A148C;}
  .type-badge.sight{background:#EF6C00;border-color:#E65100;}
  .type-badge.syllable{background:#2E7D32;border-color:#1B5E20;}

  .ch-prompt{font-size:.46em;color:#8D6E63;margin-bottom:12px;line-height:1.8;}
  .ch-word{font-family:'Press Start 2P',monospace;font-size:2.1em;color:#3E2723;text-align:center;letter-spacing:3px;margin:10px 0 4px;word-break:break-word;}
  .ch-sentence{font-size:1.05em;color:#3E2723;margin-bottom:6px;line-height:1.7;text-align:center;font-family:-apple-system,'PingFang SC',sans-serif;font-weight:600;}
  .ch-sentence .blank{color:#F9A825;letter-spacing:2px;border-bottom:3px solid #F9A825;padding:0 10px;}
  .speak-btn{display:block;margin:8px auto 14px;font-size:.42em;padding:10px 18px;}

  .opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
  .opt{font-family:inherit;font-size:.55em;padding:14px 20px;min-width:92px;background:#E0C9A6;color:#3E2723;
    border:3px solid #8D6E63;box-shadow:0 4px 0 #6D4C2E;cursor:pointer;transition:all .15s;line-height:1.5;}
  .opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 #6D4C2E;background:#F0DDB8;}
  .opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #6D4C2E;}
  .opt.wide{min-width:150px;font-size:.5em;}
  .opt.correct{background:#A5D6A7;border-color:#2E7D32;box-shadow:0 4px 0 #2E7D32;}
  .opt.wrong{background:#EF9A9A;border-color:#B71C1C;box-shadow:0 4px 0 #B71C1C;animation:shake .4s ease;}
  .opt:disabled{cursor:default;opacity:.9;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  .flash-word{font-family:'Press Start 2P',monospace;font-size:2.4em;color:#EF6C00;text-align:center;letter-spacing:4px;margin:18px 0;}
  .flash-hidden{font-size:.7em;color:#BDBDBD;text-align:center;letter-spacing:6px;margin:18px 0;}

  .fb{margin-top:14px;border-left:8px solid #66BB6A;background:#F1F8E9;padding:12px 14px;animation:cardIn .35s ease;}
  .fb.bad{border-left-color:#EF5252;background:#FFEBEE;}
  .fb-head{font-size:.82em;margin-bottom:12px;}
  .fb.bad .fb-head{color:#C62828;} .fb:not(.bad) .fb-head{color:#2E7D32;}
  .fb-msg{font-size:.8em;line-height:1.8;color:#3E2723;}
  .fb-hint{font-size:.7em;line-height:1.75;color:#5D4037;margin-top:8px;background:rgba(255,255,255,.7);padding:8px;border:2px dashed #BCAAA4;}
  .reveal{margin-top:14px;font-size:.76em;line-height:1.8;color:#4E342E;}
  .reveal .syl{font-family:'Press Start 2P',monospace;color:#1565C0;font-size:1.5em;letter-spacing:2px;}
  .reveal .ph{color:#6A1B9A;font-weight:bold;}
  .fb-actions{margin-top:12px;text-align:right;}

  .mc-btn{padding:12px 22px;font-family:inherit;font-size:.48em;background:#5D8C2E;color:#FFE0B2;border:3px solid #33691E;box-shadow:0 4px 0 #33691E;cursor:pointer;transition:all .15s;}
  .mc-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #33691E;}
  .mc-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #33691E;}
  .mc-btn.blue{background:#1565C0;border-color:#0D47A1;box-shadow:0 4px 0 #0D47A1;}
  .mc-btn.ghost{background:#8D6E63;border-color:#5D4037;box-shadow:0 4px 0 #5D4037;}
  .mc-btn.down{opacity:.55;pointer-events:none;}

  .toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:12px 24px;font-family:inherit;font-size:.46em;z-index:100;pointer-events:none;border:3px solid;box-shadow:0 4px 0 rgba(0,0,0,.2);opacity:0;}
  .toast.show{opacity:1;animation:toastIn .4s ease,toastOut .4s ease 2s forwards;}
  .toast.ok{background:#C8E6C9;border-color:#388E3C;color:#2E7D32;}
  .toast.bad{background:#FFCDD2;border-color:#C62828;color:#B71C1C;}
  .toast.great{background:#FFF9C4;border-color:#F9A825;color:#F57F17;}
  @keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-16px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes toastOut{0%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-16px)}}

  .particles{position:fixed;inset:0;pointer-events:none;z-index:60;}
  .p{position:absolute;font-size:1.1em;animation:pUp .9s ease forwards;}
  @keyframes pUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(.3)}}

  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .prof-box{background:#5D4037;border:3px solid #3E2723;padding:10px;color:#FFE0B2;}
  .prof-box h3{font-size:.4em;color:#FFD54F;margin-bottom:8px;letter-spacing:1px;}
  .chip{display:inline-block;background:#3E2723;border:2px solid #8D6E63;font-size:.36em;padding:5px 8px;margin:3px;}
  .chip.hot{border-color:#EF5350;color:#FF8A80;}
  .chip.warm{border-color:#FFA726;color:#FFD180;}
  .rec-item{font-size:.36em;line-height:1.9;padding:3px 0;border-bottom:1px dashed #6D4C2E;}
  .rec-item b{color:#FFD54F;}
  .muted{font-size:.34em;color:#BCAAA4;line-height:1.9;}

  @media (max-width:600px){
    .header h1{font-size:.6em;} .ch-word{font-size:1.5em;} .profile-grid{grid-template-columns:1fr;}
    .ch-sentence{font-size:.82em;} .char-sprite{font-size:1.7em;} .path-box{height:88px;}
  }

    /* ── iPad / 平板适配（Chrome on iPadOS 走 WebKit）── */
    html { -webkit-text-size-adjust:100%; }
    body { touch-action:manipulation; }
    @media (min-width:768px) {          /* iPad 竖屏 768 起 */
      html { font-size:17px; }
      .app { max-width:940px; padding:14px; gap:10px; }
      .ch-card { max-width:760px; padding:24px; }
    }
    @media (min-width:1024px) {         /* iPad 横屏 / 大屏 */
      html { font-size:18px; }
      .app { max-width:1060px; }
      .ch-card { max-width:840px; }
    }
    @media (min-width:768px) and (max-height:840px) {   /* 横屏纵向吃紧，压缩留白 */
      .app { gap:6px; padding:8px 14px; }
      .ch-card { padding:18px; }
    }

</style>
</head>
<body>
<div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
<div class="particles" id="pcs"></div>

<div class="app">
  <div class="mc-panel header">
    <h1><span class="pick">🎧</span>Phonics</h1>
  </div>

  <div class="mc-panel nav-tabs">
    <a class="tab active" href="./phonics.html">🎧 Phonics</a>
    <a class="tab" href="./index.html">⛏️ Word Adventure</a>
  </div>

  <div class="mc-panel char-row">
    <label>角色:</label>
    <div class="char-card selected" id="charBiff" onclick="sel('biff')"><div class="face">👧🏻</div><div class="name">Biff</div></div>
    <div class="char-card" id="charChip" onclick="sel('chip')"><div class="face">🧒🏻</div><div class="name">Chip</div></div>
    <div class="char-card" id="charKipper" onclick="sel('kipper')"><div class="face">👦🏻</div><div class="name">Kipper</div></div>
    <div class="char-card" id="charWilma" onclick="sel('wilma')"><div class="face">👧🏽</div><div class="name">Wilma</div></div>
    <div class="char-card" id="charFloppy" onclick="sel('floppy')"><div class="face">🐶</div><div class="name">Floppy</div></div>
  </div>

  <div class="hud">
    <div class="hud-item"><div class="lbl">🏆 得分</div><div class="val" id="s">0</div></div>
    <div class="hud-item"><div class="lbl">🔥 连击</div><div class="val" id="c">0</div></div>
    <div class="hud-item"><div class="lbl">📊 进度</div><div class="val" id="p">0/8</div></div>
    <div class="hud-item"><div class="lbl">🎯 正确率</div><div class="val" id="acc">—</div></div>
  </div>
  <div class="xp-wrap"><div class="xp-fill" id="xpFill" style="width:0%"></div><div class="xp-text" id="xpText">XP 0/100</div></div>

  <div class="mc-panel" style="padding:0;overflow:hidden;">
    <div class="path-box"><div class="path-nodes" id="pnodes"></div><div class="char-sprite" id="csprite" style="left:6px;">👧🏻</div></div>
  </div>

  <div class="mc-panel ch-area" id="chArea">
    <div style="color:#5D4037;font-size:.46em;text-align:center;padding:36px;line-height:2;">
      音节 · 音素 · 拼读 · 视觉词<br><br>准备好了吗？
    </div>
  </div>

  <div class="toolbar">
    <button class="mc-btn" id="goBtn" onclick="start()">🎧 开始特训</button>
    <button class="mc-btn blue" id="profBtn" onclick="showProfile()">📈 我的学情</button>
    <button class="mc-btn ghost" id="rstBtn" style="display:none;" onclick="start()">🔄 再来一轮</button>
  </div>

  <div class="mc-panel" id="profPanel" style="display:none;">
    <div style="color:#FFE0B2;font-size:.5em;margin-bottom:4px;">📈 学情画像 <span style="font-size:.7em;opacity:.7;">（答题即更新）</span></div>
    <div class="profile-grid">
      <div class="prof-box"><h3>🔥 薄弱音素（错误权重）</h3><div id="weakPh"></div></div>
      <div class="prof-box"><h3>📚 靶向回流推荐</h3><div id="recBox"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<script>
/* ================= 静态版引擎 =================
   算法本体与 backend/practice.js 共用 shared/engine.js；
   这里只保留「用 localStorage 代替 SQLite」的数据适配层。
   以前这里有一份手工抄写的引擎副本，改一边另一边不生效。 */
/**
 * shared/engine.js — 特训引擎的唯一实现
 *
 * 为什么有这个文件：
 *   之前 backend/practice.js 有一份引擎，build-pages.js 里又手工抄了一份，
 *   改了一边另一边不生效（"本地改了、线上没变"就是这么来的）。
 *   现在引擎只有这一份，两边都从这里取：
 *     - Node:    require('../shared/engine.js')
 *     - 浏览器:  build-pages.js 把这个文件原样内联进 <script>，得到 window.OWK
 *
 * 设计约束：
 *   - 本文件**不允许** require / import 任何东西，也不许碰数据库或 localStorage。
 *     所有外部数据通过 createEngine(env) 注入，这样同一份代码能在服务端和静态页跑。
 *   - env 需要提供三个方法：
 *       wordsInBank(level)   -> [{ word, hint, sentence, oxford_level }]
 *       weakPhonemes(player) -> [{ phoneme, grapheme, error_weight }]
 *       wordErrors(player)   -> { [word]: { e: 错误次数 } } 或 Map
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.OWK = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ───────────────────────── 常量 ───────────────────────── */

  const SYLLABLE_OVERRIDES = {
    // 常见不规则词：算法会数错的，显式纠正（值 = 音节切分）
    orange: ['or', 'ange'], every: ['ev', 'ery'],
    everything: ['ev', 'ery', 'thing'], everyone: ['ev', 'ery', 'one'],
    everybody: ['ev', 'ery', 'bod', 'y'], somewhere: ['some', 'where'], interesting: ['in', 'ter', 'est', 'ing'],
    chocolate: ['choc', 'o', 'late'], family: ['fam', 'i', 'ly'], animal: ['an', 'i', 'mal'],
    camera: ['cam', 'er', 'a'], vegetable: ['veg', 'e', 'ta', 'ble'], favourite: ['fa', 'vour', 'ite'],
    favorite: ['fa', 'vor', 'ite'], beautiful: ['beau', 'ti', 'ful'], business: ['busi', 'ness'],
    people: ['peo', 'ple'], water: ['wa', 'ter'], fire: ['fire'], hour: ['hour'], our: ['our'],
    science: ['sci', 'ence'], quiet: ['qui', 'et'], lion: ['li', 'on'], poem: ['po', 'em'],
    area: ['ar', 'e', 'a'], idea: ['i', 'de', 'a'], real: ['re', 'al'], being: ['be', 'ing'],
    comfortable: ['comf', 'ta', 'ble'],
    flower: ['flow', 'er'], power: ['pow', 'er'], tower: ['tow', 'er'], shower: ['show', 'er'],
  };

  const CHARACTERS = {
    biff:   { label: 'Biff',   emoji: '👧🏻', pet: false },
    chip:   { label: 'Chip',   emoji: '🧒🏻', pet: false },
    kipper: { label: 'Kipper', emoji: '👦🏻', pet: false },
    wilma:  { label: 'Wilma',  emoji: '👧🏽', pet: false },
    floppy: { label: 'Floppy', emoji: '🐶',  pet: true },
  };
  const ALL_NAMES = ['biff', 'chip', 'kipper', 'wilma', 'floppy', 'wilf', 'gran', 'mum', 'dad', 'nadim', 'anneena'];

  const VOWELS = 'aeiouy';
  const isVowel = (c) => VOWELS.includes(c);

  /* ───────────────────────── 拼读规则表 ───────────────────────── */

  const PHONEME_PATTERNS = [
    { phoneme: '/aɪ/', grapheme: 'igh', articulation: '嘴张开滑动到 /i/，像 "I"', example: 'night', kind: 'vowel' },
    { phoneme: '/iː/', grapheme: 'ee', articulation: '嘴角向两边拉平，长音', example: 'see', kind: 'vowel' },
    { phoneme: '/iː/', grapheme: 'ea', articulation: '嘴角向两边拉平，长音', example: 'tea', kind: 'vowel' },
    { phoneme: '/uː/', grapheme: 'oo', articulation: '嘴唇收圆前突', example: 'moon', kind: 'vowel' },
    { phoneme: '/eɪ/', grapheme: 'ai', articulation: '从 /e/ 滑到 /ɪ/，双元音', example: 'rain', kind: 'vowel' },
    { phoneme: '/eɪ/', grapheme: 'ay', articulation: '同 ai，词尾常见', example: 'play', kind: 'vowel' },
    { phoneme: '/əʊ/', grapheme: 'oa', articulation: '从 /ə/ 滑到 /ʊ/', example: 'boat', kind: 'vowel' },
    { phoneme: '/aʊ/', grapheme: 'ou', articulation: '从 /a/ 滑到 /ʊ/', example: 'house', kind: 'vowel' },
    { phoneme: '/aʊ/', grapheme: 'ow', articulation: '同 ou', example: 'cow', kind: 'vowel' },
    { phoneme: '/ɔɪ/', grapheme: 'oi', articulation: '从 /ɔ/ 滑到 /ɪ/', example: 'coin', kind: 'vowel' },
    { phoneme: '/ɔɪ/', grapheme: 'oy', articulation: '同 oi，词尾常见', example: 'boy', kind: 'vowel' },
    { phoneme: '/ɑː/', grapheme: 'ar', articulation: '嘴张大，舌后缩', example: 'car', kind: 'vowel' },
    { phoneme: '/ɔː/', grapheme: 'or', articulation: '圆唇，舌后缩', example: 'fork', kind: 'vowel' },
    { phoneme: '/ɜː/', grapheme: 'er', articulation: '中央元音，舌平放', example: 'her', kind: 'vowel' },
    { phoneme: '/ɜː/', grapheme: 'ir', articulation: '同 er', example: 'bird', kind: 'vowel' },
    { phoneme: '/ɜː/', grapheme: 'ur', articulation: '同 er', example: 'turn', kind: 'vowel' },
    { phoneme: '/ʃ/', grapheme: 'sh', articulation: '嘴唇微前突，气流摩擦，不振动声带', example: 'ship', kind: 'consonant' },
    { phoneme: '/tʃ/', grapheme: 'ch', articulation: '先堵住再释放，像打喷嚏前一刻', example: 'chip', kind: 'consonant' },
    { phoneme: '/θ/', grapheme: 'th', articulation: '舌尖轻放上下齿之间，送气', example: 'think', kind: 'consonant' },
    { phoneme: '/ŋ/', grapheme: 'ng', articulation: '舌根抵住软腭，鼻音', example: 'king', kind: 'consonant' },
    { phoneme: '/f/', grapheme: 'ph', articulation: '上齿轻咬下唇送气', example: 'phone', kind: 'consonant' },
    { phoneme: '/dʒ/', grapheme: 'j', articulation: '同 ch 但声带振动', example: 'jump', kind: 'consonant' },
    { phoneme: '/r/', grapheme: 'r', articulation: '舌尖卷起但不碰上颚', example: 'red', kind: 'consonant' },
    { phoneme: '/l/', grapheme: 'l', articulation: '舌尖抵上齿龈，气流从两侧出', example: 'leg', kind: 'consonant' },
    { phoneme: '/v/', grapheme: 'v', articulation: '上齿咬下唇，声带振动', example: 'van', kind: 'consonant' },
    { phoneme: '/w/', grapheme: 'w', articulation: '双唇收圆再放开', example: 'wet', kind: 'consonant' },
  ];

  const MINIMAL_PAIRS = [
    { a: 'ship', b: 'sheep', pa: '/ɪ/', pb: '/iː/', zh_a: '船', zh_b: '羊', tip: '短音 vs 长音' },
    { a: 'ship', b: 'chip', pa: '/ʃ/', pb: '/tʃ/', zh_a: '船', zh_b: '薯条', tip: '摩擦音 vs 破擦音' },
    { a: 'think', b: 'sink', pa: '/θ/', pb: '/s/', zh_a: '想', zh_b: '水槽', tip: '咬舌 vs 不咬舌' },
    { a: 'three', b: 'tree', pa: '/θ/', pb: '/t/', zh_a: '三', zh_b: '树', tip: '咬舌 vs 不咬舌' },
    { a: 'rice', b: 'lice', pa: '/r/', pb: '/l/', zh_a: '米饭', zh_b: '虱子', tip: '卷舌 vs 舌尖抵齿龈' },
    { a: 'right', b: 'light', pa: '/r/', pb: '/l/', zh_a: '右边', zh_b: '光', tip: '卷舌 vs 舌尖抵齿龈' },
    { a: 'red', b: 'led', pa: '/r/', pb: '/l/', zh_a: '红色', zh_b: '带领(过去式)', tip: '卷舌 vs 舌尖抵齿龈' },
    { a: 'vet', b: 'wet', pa: '/v/', pb: '/w/', zh_a: '兽医', zh_b: '湿的', tip: '咬唇 vs 圆唇' },
    { a: 'fan', b: 'van', pa: '/f/', pb: '/v/', zh_a: '风扇', zh_b: '货车', tip: '清音 vs 浊音' },
    { a: 'pin', b: 'pen', pa: '/ɪ/', pb: '/e/', zh_a: '别针', zh_b: '钢笔', tip: '短 i vs 短 e' },
    { a: 'bat', b: 'bet', pa: '/æ/', pb: '/e/', zh_a: '球棒', zh_b: '打赌', tip: '嘴张更大 vs 更小' },
    { a: 'coat', b: 'goat', pa: '/k/', pb: '/g/', zh_a: '外套', zh_b: '山羊', tip: '清音 vs 浊音' },
  ];

  const SIGHT_WORDS = [
    ['the', 1, '这个'], ['and', 2, '和'], ['you', 3, '你'], ['that', 4, '那个'], ['was', 5, '是(过去)'],
    ['for', 6, '为了'], ['are', 7, '是'], ['with', 8, '和…一起'], ['they', 9, '他们'], ['have', 10, '有'],
    ['this', 11, '这个'], ['from', 12, '从'], ['one', 13, '一'], ['had', 14, '有(过去)'], ['word', 15, '单词'],
    ['what', 16, '什么'], ['were', 17, '是(过去)'], ['when', 18, '什么时候'], ['your', 19, '你的'], ['said', 20, '说(过去)'],
    ['there', 21, '那里'], ['each', 22, '每个'], ['which', 23, '哪一个'], ['she', 24, '她'], ['how', 25, '怎样'],
    ['their', 26, '他们的'], ['will', 27, '将要'], ['other', 28, '其他的'], ['about', 29, '关于'], ['many', 30, '许多'],
    ['then', 31, '然后'], ['them', 32, '他们(宾)'], ['these', 33, '这些'], ['some', 34, '一些'], ['would', 35, '将会'],
    ['make', 36, '制作'], ['like', 37, '喜欢'], ['him', 38, '他(宾)'], ['into', 39, '进入'], ['time', 40, '时间'],
  ];

  /* ───────────────────────── 纯函数 ───────────────────────── */

  const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z]/g, '');

  /** 句子里出现了哪些牛津树人物（小写数组） */
  function charactersIn(text) {
    const s = String(text || '').toLowerCase();
    const out = [];
    for (const n of ALL_NAMES) if (new RegExp('\\b' + n + '\\b').test(s) && !out.includes(n)) out.push(n);
    return out;
  }
  const characterLabel = (c) => (CHARACTERS[c] || {}).label || '';

  /** 把单词切成音节数组。算法与判定同源，保证"显示=判定"。 */
  function syllabify(word) {
    const raw = String(word || '').toLowerCase().replace(/[^a-z]/g, '');
    if (!raw) return [String(word || '')];
    if (SYLLABLE_OVERRIDES[raw]) return SYLLABLE_OVERRIDES[raw].slice();
    if (raw.length <= 3) return [raw];
    if (raw.length <= 4 && /[^aeiouy]y$/.test(raw)) return [raw];

    let w = raw;
    if (w.endsWith('e') && !/([aeiouy])e$/.test(w)) {
      const beforeE = w[w.length - 2];
      const isConsLe = w.endsWith('le') && beforeE !== 'e' && !isVowel(w[w.length - 3] || '');
      if (!isConsLe) w = w.slice(0, -1);
    }

    const groups = [];
    let start = -1;
    for (let i = 0; i < w.length; i++) {
      if (isVowel(w[i])) { if (start < 0) start = i; }
      else if (start >= 0) { groups.push([start, i - 1]); start = -1; }
    }
    if (start >= 0) groups.push([start, w.length - 1]);
    if (groups.length <= 1) return [raw];

    const cuts = [];
    for (let g = 0; g < groups.length - 1; g++) {
      const endV = groups[g][1];
      const startNext = groups[g + 1][0];
      const cluster = startNext - endV - 1;
      cuts.push(cluster === 0 ? startNext : endV + 1 + Math.floor(cluster / 2));
    }

    const parts = [];
    let prev = 0;
    cuts.forEach((c) => { parts.push(raw.slice(prev, c)); prev = c; });
    parts.push(raw.slice(prev));
    return parts.filter(Boolean);
  }
  const syllableCount = (word) => syllabify(word).length;

  /** 该词命中的可教学音素（拼写模式匹配） */
  function phonemesOf(word) {
    const w = norm(word);
    const out = [];
    for (const p of PHONEME_PATTERNS) {
      if (w.includes(p.grapheme)) {
        if (!out.some((o) => o.phoneme === p.phoneme && o.grapheme === p.grapheme)) out.push(p);
      }
    }
    return out;
  }

  /**
   * 全池加权抽样。
   * 不能写成"先排序再只在前 K 个里抽"——那样 903 词的库实际只剩 4~5 个候选，
   * 是相邻两轮大量重复的根因。
   */
  function weightedPick(arr, weightOf) {
    if (!arr || !arr.length) return null;
    const ws = arr.map((x) => Math.max(1e-6, Number(weightOf(x)) || 0));
    const total = ws.reduce((a, b) => a + b, 0);
    if (!(total > 0)) return arr[Math.floor(Math.random() * arr.length)];
    let r = Math.random() * total;
    for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
    return arr[arr.length - 1];
  }

  /** 取一张卡"考的是哪个词"：音节/视觉词用 word，音素/拼读用 correct / audio_text */
  function cardWord(c) {
    return String((c && (c.word || c.correct || c.audio_text)) || '').trim().toLowerCase();
  }

  /* ───────────────────────── 引擎 ───────────────────────── */

  /**
   * @param {object} env
   * @param {(level:string)=>Array} env.wordsInBank
   * @param {(player:string)=>Array} env.weakPhonemes
   * @param {(player:string)=>object} env.wordErrors  word -> { e }
   */
  function createEngine(env) {
    const E = env || {};
    const wordsInBank = E.wordsInBank || (() => []);
    const weakPhonemes = E.weakPhonemes || (() => []);
    const wordErrors = E.wordErrors || (() => ({}));
    const priorityWeight = E.priorityWeight || (() => 0);   // 人工权重 ★1–5，0 = 无

    function errOf(player, word) {
      const m = wordErrors(player) || {};
      const v = m instanceof Map ? m.get(word) : m[word];
      if (v == null) return 0;
      return Number(v.e != null ? v.e : v) || 0;
    }

    /* 1. 音节计数 */
    function makeSyllableCard(player, level, character) {
      const bank = wordsInBank(level).filter((r) => /^[a-z]{3,}$/i.test(String(r.word).trim()));
      if (!bank.length) return null;
      const weak = weakPhonemes(player) || [];
      const weakSet = new Set(weak.map((w) => w.grapheme).filter(Boolean));

      const scored = bank.map((r) => {
        const ph = phonemesOf(r.word);
        const hit = ph.filter((p) => weakSet.has(p.grapheme)).length;
        const syl = syllableCount(r.word);
        return { row: r, score: 1 + syl * 0.8 + hit * 1.5 + priorityWeight(r.word) * 1.6 + Math.random() * 0.8, syl, ph };
      });

      const pick = weightedPick(scored, (x) => x.score);
      const n = pick.syl;
      const opts = [];
      if (n > 1) opts.push(n - 1);
      opts.push(n + 1);
      if (n > 2 && Math.random() < 0.5) opts.push(n - 2);
      const options = [...new Set([...opts, n])].sort((a, b) => a - b);

      const parts = syllabify(pick.row.word);
      return {
        card_type: 'SYLLABLE_COUNTING',
        word: pick.row.word,
        hint: pick.row.hint,
        speaker: CHARACTERS[character] || null,
        prompt: (characterLabel(character) ? characterLabel(character) + ' 想考考你：' : '') + '这个词有几个音节？拍着手读一读',
        options,
        correct: n,
        focus: 'syllable',
        reveal: {
          syllables: parts,
          display: parts.join(' · '),
          tip: n >= 3 ? '长单词可以分段读，先读第一部分再读第二部分。' : '每个元音组通常就是一个音节。',
        },
        meta: { oxford_level: pick.row.oxford_level, graphemes: pick.ph.map((p) => p.grapheme) },
      };
    }

    /* 2. 音素辨析（最小对立对） */
    function makePhonemeCard(player, level) {
      const bank = new Set(wordsInBank(level).map((r) => norm(r.word)));
      const weak = weakPhonemes(player) || [];
      const weakMap = new Map(weak.map((w) => [w.phoneme, w.error_weight]));

      const scored = MINIMAL_PAIRS.map((p) => {
        const weight = Math.max(weakMap.get(p.pa) || 0, weakMap.get(p.pb) || 0);
        const inBank = (bank.has(norm(p.a)) ? 1 : 0) + (bank.has(norm(p.b)) ? 1 : 0);
        return { p, score: 1 + weight * 2 + inBank * 0.6 + Math.random() * 0.7 };
      });

      const { p } = weightedPick(scored, (x) => x.score);
      const targetIsA = Math.random() < 0.5;
      const target = targetIsA ? p.a : p.b;
      return {
        card_type: 'PHONEME_DISCRIMINATION',
        audio_text: target,
        prompt: '听一听，选出你听到的词',
        options: [p.a, p.b],
        correct: target,
        focus: targetIsA ? p.pa : p.pb,
        reveal: {
          pair: [p.a, p.b],
          phonemes: [p.pa, p.pb],
          meanings: [p.zh_a, p.zh_b],
          tip: p.tip,
          target,
        },
        meta: {
          phoneme_a: p.pa, phoneme_b: p.pb,
          graphemes: PHONEME_PATTERNS.filter((x) => x.phoneme === (targetIsA ? p.pa : p.pb)).map((x) => x.grapheme),
        },
      };
    }

    /* 3. 拼读规则（语境选词） */
    function makePhonicsCard(player, level, character) {
      const all = wordsInBank(level).filter((r) => r.sentence);
      if (!all.length) return makeSyllableCard(player, level, character);
      let bank = character
        ? all.filter((r) => {
            const cs = charactersIn(r.sentence);
            return cs.length === 0 || cs.includes(character);
          })
        : all;
      if (bank.length < 4) bank = all;
      const isOwnLine = (r) => !!character && charactersIn(r.sentence).includes(character);
      const weak = weakPhonemes(player) || [];
      const weakMap = new Map(weak.map((w) => [w.phoneme, w.error_weight]));

      const candidates = [];
      for (const p of PHONEME_PATTERNS) {
        if (p.grapheme.length < 2) continue;
        const hits = bank.filter((r) => norm(r.word).includes(p.grapheme));
        if (hits.length >= 2) candidates.push({ p, hits });
      }
      if (!candidates.length) return makeSyllableCard(player, level, character);

      const ownCount = (hits) => hits.filter(isOwnLine).length;
      const scored = candidates.map((c) => ({
        ...c,
        score: 1 + (weakMap.get(c.p.phoneme) || 0) * 2 + Math.min(c.hits.length, 6) * 0.3
               + ownCount(c.hits) * 3.0 + Math.random() * 0.8,
      }));

      const chosen = weightedPick(scored, (x) => x.score);
      const ownHits = chosen.hits.filter(isOwnLine);
      const preferred = ownHits.length ? ownHits : chosen.hits;
      const hitsSingle = preferred.filter((r) => /^[a-z]+$/i.test(String(r.word).trim()));
      const poolSingle = bank.filter((r) => /^[a-z]+$/i.test(String(r.word).trim()));
      const usePool = hitsSingle.length >= 2 ? hitsSingle : (preferred.length ? preferred : poolSingle);
      const targetRow = weightedPick(usePool, (r) => 1 + priorityWeight(r.word) * 1.6);
      const target = targetRow.word;
      const sameRule = usePool.filter((r) => norm(r.word) !== norm(target)).slice(0, 2);
      const decoys = poolSingle.filter((r) => !norm(r.word).includes(chosen.p.grapheme)).slice(0, 1);

      let options = [target, ...sameRule.map((r) => r.word), ...decoys.map((r) => r.word)];
      options = [...new Set(options)];
      while (options.length < 3 && bank.length > options.length) {
        const extra = bank[Math.floor(Math.random() * bank.length)].word;
        if (!options.includes(extra)) options.push(extra);
      }
      options.sort(() => Math.random() - 0.5);

      const blanked = targetRow.sentence.replace(
        new RegExp(target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'),
        '_____'
      );

      return {
        card_type: 'PHONICS_CONTEXT_MATCH',
        speaker: CHARACTERS[character] || null,
        speaker_is_own_line: isOwnLine(targetRow),
        prompt: (characterLabel(character) && isOwnLine(targetRow))
          ? characterLabel(character) + ' 说的这句话缺了一个词'
          : '这句话里的空格应该填哪个词？',
        sentence: blanked.includes('_____') ? blanked : `${blanked} ( _____ )`,
        hint: targetRow.hint,
        options,
        correct: target,
        focus: chosen.p.grapheme,
        reveal: {
          grapheme: chosen.p.grapheme,
          phoneme: chosen.p.phoneme,
          articulation: chosen.p.articulation,
          family: usePool.map((r) => r.word).slice(0, 6),
          tip: `字母组合 ${chosen.p.grapheme} 通常发 ${chosen.p.phoneme}`,
        },
        meta: { rule: chosen.p.grapheme },
      };
    }

    /* 4. 视觉词闪卡 */
    function makeSightWordCard(player) {
      // 全池加权：错过的词权重高，高频词（rank 小）略高，其余均匀
      const pool = SIGHT_WORDS.map(([word, rank, zh]) => ({ word, rank, zh, err: errOf(player, word) }));
      const target = weightedPick(pool, (x) => 1 + x.err * 6 + 6 / Math.max(1, x.rank) + priorityWeight(x.word) * 1.6);

      const others = SIGHT_WORDS.filter(([w]) => w !== target.word)
        .sort(() => Math.random() - 0.5).slice(0, 3).map(([, , zh]) => zh);
      const options = [target.zh, ...others].sort(() => Math.random() - 0.5);

      return {
        card_type: 'SIGHT_WORD_FLASH',
        word: target.word,
        prompt: '闪现！快选它的意思',
        flash_ms: 800,
        options,
        correct: target.zh,
        focus: `sight:${target.word}`,
        reveal: { word: target.word, zh: target.zh, rank: target.rank, tip: '高频词靠"整体认读"，不用逐字母拼。' },
        meta: { frequency_rank: target.rank },
      };
    }

    /* 出题入口 */
    function nextTask({ player, level = 'G1', type, character, exclude } = {}) {
      const p = player || 'guest';
      const T = type && ['syllable', 'phoneme', 'phonics', 'sight'].includes(type)
        ? type
        : ['syllable', 'phoneme', 'phonics', 'sight'][Math.floor(Math.random() * 4)];

      // 本轮已考过的词：跨题型也要排除（同一个词换个题型不能再出现）
      const skip = new Set(
        String(exclude || '').split(',').map((x) => x.trim().toLowerCase()).filter(Boolean)
      );

      const gen = () => {
        let c = null;
        if (T === 'syllable') c = makeSyllableCard(p, level, character);
        else if (T === 'phoneme') c = makePhonemeCard(p, level);
        else if (T === 'phonics') c = makePhonicsCard(p, level, character);
        else c = makeSightWordCard(p, level);
        if (!c) c = makeSyllableCard(p, level, character) || makePhonemeCard(p, level);
        return c;
      };

      let card = gen();
      if (card && skip.size) {
        for (let i = 0; i < 14 && skip.has(cardWord(card)); i++) {
          const nx = gen();
          if (!nx) break;
          card = nx;
        }
      }
      if (!card) return { error: 'NO_TASK', message: '字库为空，请先导入 CSV 字库' };

      return {
        id: `${T}-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        player: p,
        level,
        ...card,
      };
    }

    return {
      nextTask, makeSyllableCard, makePhonemeCard, makePhonicsCard, makeSightWordCard,
      cardWord, errOf,
    };
  }

  return {
    createEngine,
    // 常量与纯函数同时导出，服务端（answer/profile/recommend）和构建脚本都要用
    SYLLABLE_OVERRIDES, CHARACTERS, ALL_NAMES, PHONEME_PATTERNS, MINIMAL_PAIRS, SIGHT_WORDS,
    charactersIn, characterLabel, syllabify, syllableCount, phonemesOf, weightedPick, cardWord, norm,
  };
});

const PHONEME_PATTERNS = OWK.PHONEME_PATTERNS;
const MINIMAL_PAIRS = OWK.MINIMAL_PAIRS;
const SIGHT_WORDS = OWK.SIGHT_WORDS;
const CHARACTERS = OWK.CHARACTERS;
const norm = OWK.norm;
const phonemesOf = OWK.phonemesOf;
const syllabify = OWK.syllabify;
const syllableCount = OWK.syllableCount;

const STORE_KEY = 'owk_phonics_v1';
let DB = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } })();
const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) {} };
const me = (p) => { DB[p] = DB[p] || { ph: {}, words: {}, n: 0, ok: 0 }; return DB[p]; };

function bankFor(level) { return level ? BANK.filter(r => r.oxford_level === level) : BANK.slice(); }
function weakPh(p, min) {
  const s = me(p).ph;
  return Object.keys(s).map(k => Object.assign({ phoneme: k }, s[k]))
    .filter(x => x.error_weight >= (min === undefined ? 0.6 : min))
    .sort((a, b) => b.error_weight - a.error_weight);
}
function bump(p, ph, gr, delta, okk) {
  const s = me(p).ph;
  const e = s[ph] = s[ph] || { phoneme: ph, grapheme: gr || '', error_weight: 0, correct: 0, wrong: 0 };
  e.error_weight = Math.max(0, +(e.error_weight + delta).toFixed(2));
  if (gr && !e.grapheme) e.grapheme = gr;
  okk ? e.correct++ : e.wrong++;
  persist();
}

/* 线上版的人工重点生词：存在 localStorage（与 lexicon.html 同源共享） */
const PRIO_KEY = 'owk_user_words';
function priorityWords() {
  try {
    return (JSON.parse(localStorage.getItem(PRIO_KEY) || '[]') || [])
      .map((u) => ({ w: String(u.word || '').trim().toLowerCase(), weight: Number(u.weight) || 3 }))
      .filter((x) => x.w);
  } catch (e) { return []; }
}

function prioWeight(word) {
  const k = String(word || '').trim().toLowerCase();
  if (!k) return 0;
  const hit = priorityWords().find((x) => x.w === k);
  return hit ? hit.weight : 0;
}
const __ENGINE = OWK.createEngine({
  wordsInBank: (level) => bankFor(level),
  weakPhonemes: (p) => weakPh(p, 0.6),
  wordErrors: (p) => { const w = (me(p).words) || {}; const o = {}; for (const k in w) o[k] = { e: (w[k] && w[k].e) || 0 }; return o; },
  priorityWeight: (word) => prioWeight(String(word || '').toLowerCase()),
});
function nextTask(p, level, type, character, exclude) { return __ENGINE.nextTask({ player: p, level, type, character, exclude }); }

/* ---- 判定 + 学情写回 ---- */
function answerCard(p, card, response, ms) {
  const okk = card.card_type === 'SYLLABLE_COUNTING' ? Number(response) === Number(card.correct) : String(response) === String(card.correct);
  const hesitant = ms > 5000;
  const st = me(p);
  const bumpWord = (w, e) => { const r = st.words[w] = st.words[w] || { e: 0, c: 0 }; e ? r.e++ : r.c++; };

  if (card.card_type === 'SYLLABLE_COUNTING') {
    bumpWord(card.word, !okk);
    (card.meta.graphemes || []).forEach(g => { const ph = PHONEME_PATTERNS.find(x => x.grapheme === g); if (ph && !okk) bump(p, ph.phoneme, ph.grapheme, 0.3, false); });
  } else if (card.card_type === 'PHONEME_DISCRIMINATION') {
    const pair = card.reveal.phonemes;
    const idx = card.correct === card.reveal.pair[0] ? 0 : 1;
    bump(p, pair[idx], (card.meta.graphemes || [])[0] || '', okk ? -0.5 : 1.6, okk);
    if (!okk) {
      const oSym = pair[1 - idx];
      const oG = (PHONEME_PATTERNS.find(x => x.phoneme === oSym) || {}).grapheme || '';
      bump(p, oSym, oG, 0.6, false);
    }
    bumpWord(card.correct, !okk);
  } else if (card.card_type === 'PHONICS_CONTEXT_MATCH') {
    const ph = PHONEME_PATTERNS.find(x => x.grapheme === card.reveal.grapheme);
    if (ph) bump(p, ph.phoneme, ph.grapheme, okk ? (hesitant ? -0.3 : -0.7) : 1.2, okk);
    bumpWord(card.correct, !okk);
  } else {
    bumpWord(card.word, !okk);
  }
  st.n++; if (okk) st.ok++; persist();

  let fb;
  if (okk && ms < 2000) fb = { message: '太棒了！秒答！', type: 'encouragement' };
  else if (okk) fb = { message: '答对了！做得好！', type: 'encouragement' };
  else if (card.card_type === 'SYLLABLE_COUNTING') fb = { message: '这个词要这样切：' + card.reveal.display, hint: '拍着手跟着读：' + card.reveal.display };
  else if (card.card_type === 'PHONEME_DISCRIMINATION') fb = { message: '注意听：' + card.reveal.phonemes[0] + ' 和 ' + card.reveal.phonemes[1] + ' 是不同的音', hint: card.reveal.tip + '！再听一遍' };
  else if (card.card_type === 'PHONICS_CONTEXT_MATCH') fb = { message: card.reveal.grapheme + ' 通常发 ' + card.reveal.phoneme, hint: '同家族的词还有：' + card.reveal.family.join('、') };
  else fb = { message: '再记一次：' + card.reveal.word + ' = ' + card.reveal.zh, hint: card.reveal.tip };

  return { is_correct: okk, correct_answer: card.correct, feedback: fb, reveal: card.reveal, hesitant };
}

function profileOf(p) {
  const st = me(p);
  const weak = weakPh(p, 0).filter(w => w.error_weight > 0).slice(0, 10);
  const words = Object.keys(st.words).map(w => ({ word: w, error_count: st.words[w].e, correct: st.words[w].c }))
    .filter(x => x.error_count > 0).sort((a, b) => b.error_count - a.error_count).slice(0, 12);
  return { player: p, total: st.n, correct: st.ok, accuracy: st.n ? Math.round(st.ok / st.n * 100) : 0, weak_phonemes: weak, trouble_words: words };
}

function recommendFor(p, level) {
  const st = me(p);
  const weak = Object.keys(st.ph).map(k => Object.assign({ phoneme: k }, st.ph[k]))
    .filter(x => x.error_weight > 0 && x.grapheme).sort((a, b) => b.error_weight - a.error_weight).slice(0, 3);
  const bank = bankFor(level);
  const trouble = Object.keys(st.words).filter(w => st.words[w].e > 0)
    .map(w => ({ word: w, hint: (BANK.find(r => norm(r.word) === norm(w)) || {}).hint || '', grapheme: '', phoneme: '' }));
  if (!weak.length) return trouble.length
    ? { reason: '这些词你错过，先回去读一遍', focus: [], words: trouble.slice(0, 8) }
    : { reason: '还没有明显薄弱点，继续按进度练习就好', focus: [], words: [] };
  const picked = [], reasons = [];
  weak.forEach(w => {
    const hits = bank.filter(r => w.grapheme && norm(r.word).includes(w.grapheme));
    if (hits.length) {
      reasons.push('「' + w.grapheme + '」' + w.phoneme + ' 错误权重 ' + w.error_weight);
      hits.slice(0, 6).forEach(r => { if (!picked.some(x => x.word === r.word)) picked.push({ word: r.word, hint: r.hint, grapheme: w.grapheme, phoneme: w.phoneme }); });
    }
  });
  if (!picked.length && trouble.length) return { reason: '这些词你错过，先回去读一遍', focus: [], words: trouble.slice(0, 8) };
  return { reason: reasons.length ? '优先补这些音：' + reasons.join('；') : '继续巩固', focus: weak, words: picked.slice(0, 12) };
}

  try{
    const all=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    if(!all.length) return null;
    // 关键：能用本地语音就别用网络语音。
    // Chrome 的 "Google UK English Female/Male" 是网络语音，离线或网络受限时会**静默失败**——
    // 表现就是"点了没声音、也没有报错"。macOS 自带语音（Daniel/Samantha…）是 localService，稳定。
    const local=all.filter(v=>v.localService);
    const want=(v)=> gender==='male'
      ? (MALE_RE.test(v.name) && !FEMALE_RE.test(v.name))
      : FEMALE_RE.test(v.name);
    for (const pool of [local, all]) {
      if (!pool.length) continue;
      const gb=pool.filter(v=>/en[-_]GB/i.test(v.lang));
      const hit=gb.find(want) || pool.find(want);
      if (hit) return hit;
    }
    return local[0] || all[0];
  }catch(e){ return null; }
}

/* ── Azure 预生成音频（构建期产出，见 backend/gen-audio.js）──
 * 静态站不能在前端调 TTS API（key 会暴露），所以音频是构建期落盘的 mp3。
 * 有音频文件就播文件：音质稳定、支持 iOS、不依赖系统装了哪些语音。
 * 没有就回落到 speechSynthesis（新词还没生成时的兜底）。
 */
let AUDIO_MANIFEST=null, _curAudio=null;
(async()=>{ try{ const r=await fetch('audio/manifest.json'); if(r.ok) AUDIO_MANIFEST=await r.json(); }catch(e){} })();

function playFile(rel){
  return new Promise((resolve)=>{
    try{
      if(_curAudio){ try{_curAudio.pause();}catch(e){} _curAudio=null; }
      const a=new Audio('audio/'+rel);
      _curAudio=a;
      let settled=false;
      const done=(v)=>{ if(settled) return; settled=true; resolve(v); };
      a.onended=()=>done(true);
      a.onerror=()=>done(false);
      a.play().catch(()=>done(false));
      setTimeout(()=>done(true), 8000);          // 保险：不让 Promise 永远挂着
    }catch(e){ resolve(false); }
  });
}
function audioForWord(w){
  const k=String(w||'').trim().toLowerCase();
  return AUDIO_MANIFEST && AUDIO_MANIFEST.words && AUDIO_MANIFEST.words[k];
}
/* 整句/短语：先精确匹配 phrases（角色开场白），再匹配例句库。
   之前只查 words，所以 "Hello, I am Biff." 永远查不到 → 掉回系统语音，
   切换角色听起来毫无变化。 */
function audioForText(text){
  const t=String(text||'').trim();
  if(!t) return null;
  const M=AUDIO_MANIFEST||{};
  return (M.phrases && M.phrases[t]) || (M.sentences && M.sentences[t]) || null;
}

/* 系统语音兜底（原实现，保持不变） */
function speakSynth(text,rate=0.85){
  try{
    if(!('speechSynthesis' in window)){
      if(typeof toast==='function') toast('⚠️ 这个浏览器不支持发音','bad');
      return false;
    }
    const prof=VOICE_PROFILE[ch]||VOICE_PROFILE.biff;
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang='en-GB'; u.rate=rate; u.pitch=prof.pitch;

    // 只选「本地语音」：网络语音（Google UK English *）会静默失败
    const v=pickVoice(prof.gender);
    if(v){ u.voice=v; u.lang=v.lang||'en-GB'; }
    try{ console.log('[voice]', ch, prof.gender, '→', v ? (v.name+' / '+v.lang+' / local='+v.localService) : '系统默认', 'pitch='+prof.pitch); }catch(e){}

    // 不做任何"失败重试"：重试会在第一次已经出声的情况下再叠一条默认语音，
    // 表现就是「男声女声同时响」。宁可偶尔没声，也不要两个声音打架。
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

/* 统一入口：预生成 mp3 优先，失败或被浏览器拦（Autoplay 策略）则回落到系统语音。
 * <audio> 比 speechSynthesis 严格——没有用户手势时 play() 会被 NotAllowedError 拒绝，
 * 这里必须回退，否则会出现"点了没声音"。 */
function speak(text,rate=0.85){
  const raw=String(text||'').trim();
  const hit=audioForWord(raw) || audioForText(raw);
  if(hit){
    playFile(hit.file).then((ok)=>{ if(!ok) speakSynth(text,rate); });
    return true;
  }
  return speakSynth(text,rate);
}

/* 切换角色后立刻用新音色报一次名字，家长能马上听出差别 */
/* 文本必须与 backend/gen-audio.js 的 PHRASES 逐字一致，否则查不到音频 */
const GREET={
  biff:'Hello, I am Biff.', chip:'Hello, I am Chip.',
  kipper:'Hello, I am Kipper.', wilma:'Hello, I am Wilma.',
  floppy:'Woof! I am Floppy.',
};
function demoVoice(){
  const t=GREET[ch];
  if(!t) return;
  setTimeout(()=>speak(t,0.9),80);
}

function toast(m,c='ok'){const e=document.getElementById('toast');e.textContent=m;e.className='toast '+c+' show';setTimeout(()=>e.className='toast '+c,2300)}
function pt(x,y,e='✨',n=8){const c=document.getElementById('pcs');for(let j=0;j<n;j++){const p=document.createElement('div');p.className='p';p.textContent=e;p.style.left=(x+(Math.random()-.5)*90)+'px';p.style.top=(y+(Math.random()-.5)*40)+'px';p.style.animationDuration=(.5+Math.random()*.6)+'s';c.appendChild(p);setTimeout(()=>p.remove(),1300)}}

function sel(n){
  const _prev=ch;
  if(n===_prev) return;
  // 角色锁定：特训进行中不允许中途换人
  if(playing){
    if(!confirm('角色已锁定 —— 切换角色会重新开始本轮特训，确定吗？')) return;
    resetRound();
  }
  ch=n;document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('char'+n.charAt(0).toUpperCase()+n.slice(1)).classList.add('selected');
  document.getElementById('csprite').textContent=F[n]; if(_prev!==n)track('character_switch',{from:_prev,to:n}); demoVoice();}

function dn(){const c=document.getElementById('pnodes');let h='';
  for(let j=0;j<N;j++){let cls='',ic='⬜';
    if(j<i){const lg=round[j];cls=lg?.ok?'ok':'bad';ic=lg?.ok?'✅':'❌';}
    else if(j===i){cls='actv';ic='❓';}
    h+=`<div class="pn ${cls}">${ic}</div>`;if(j<N-1)h+='<div class="path-line"></div>';}
  c.innerHTML=h;}
function mc_(){const sp=document.getElementById('csprite'),w=document.getElementById('pnodes').offsetWidth,st=w/N;
  sp.style.left=(st*i+st/2-12)+'px';sp.textContent=F[ch];sp.classList.add('jump');setTimeout(()=>sp.classList.remove('jump'),500);}
function hud(){
  document.getElementById('s').textContent=sc;
  document.getElementById('c').textContent=cb;
  document.getElementById('p').textContent=i+'/'+N;
  const ok=ls.filter(x=>x.ok).length;
  document.getElementById('acc').textContent=ls.length?Math.round(ok/ls.length*100)+'%':'—';
  document.getElementById('xpFill').style.width=xp+'%';
  document.getElementById('xpText').textContent='XP '+xp+'/100';
}

/* ── 取题 ── */
/* 跨轮记忆：最近 3 轮的词，避免连续两轮刷到同样的题（与主游戏 owk_seen 同一思路） */
function pSeen(){try{return JSON.parse(localStorage.getItem('owk_seen_practice')||'[]')}catch(e){return []}}
function pPushSeen(word){
  const k=String(word||'').toLowerCase(); if(!k) return;
  const cur=pSeen(); if(cur[cur.length-1]===k) return;
  localStorage.setItem('owk_seen_practice',JSON.stringify(cur.concat([k]).slice(-24)));
}

async function fetchCard(type){ const _ex=roundWords.concat(pSeen()).filter((v,i,a)=>a.indexOf(v)===i); const _c=nextTask(ch, "G2", type, ch, _ex.join(",")); if(_c && !_c.error) pPushSeen(_c.word||_c.correct||_c.audio_text||""); return _c; }

function resetRound(){
  clearInterval(timerId);
  answered=false; i=0; sc=0; cb=0; mx=0; xp=0; ls=[]; roundWords=[]; card=null; playing=false;
  const go=document.getElementById('goBtn'); if(go) go.style.display='inline-block';
  const rst=document.getElementById('rstBtn'); if(rst) rst.style.display='none';
  const area=document.getElementById('chArea');
  if(area) area.innerHTML='<div style="color:#5D4037;font-size:0.48em;text-align:center;padding:40px;">选择你的角色<br>开始特训吧！</div>';
  hud(); dn();
}

function start(){
  track('round_start',{count:N,level:'G2',character:ch});
  roundWords=[]; playing=true;
  clearInterval(timerId);
  // 每轮固定覆盖 4 种题型各 2 次（打乱顺序），避免随机抽样漏掉某一类
  plan=['syllable','phoneme','phonics','sight','syllable','phoneme','phonics','sight']
    .sort(()=>Math.random()-0.5);
  i=0;sc=0;cb=0;mx=0;xp=0;ls=[];round=[];answered=false;
  document.getElementById('goBtn').style.display='none';
  document.getElementById('rstBtn').style.display='inline-block';
  dn();mc_();hud();nextCard();
}

async function nextCard(){
  clearInterval(timerId);
  if(i>=N){finish();return;}
  answered=false;
  dn();mc_();hud();
  card=await fetchCard(plan[i]);
  if(!card){renderError();return;}
  { const w=String(card.word||card.correct||card.audio_text||'').trim().toLowerCase();
    if(w && roundWords.indexOf(w)<0) roundWords.push(w); }
  t0=Date.now();
  tl=TS; flashUsed=0;
  renderCard();
  startTimer();
}

/* ── 渲染各类题卡 ── */
function typeBadge(t){
  const m={SYLLABLE_COUNTING:['syllable','🔢 音节计数'],
           PHONEME_DISCRIMINATION:['phoneme','👂 音素辨析'],
           PHONICS_CONTEXT_MATCH:['phonics','🔤 拼读规则'],
           SIGHT_WORD_FLASH:['sight','⚡ 视觉词闪现']};
  const [cls,label]=m[t]||['syllable','练习'];
  return `<span class="type-badge ${cls}">${label}</span>`;
}

function renderCard(){
  const t=card.card_type;
  let body='';

  if(t==='SYLLABLE_COUNTING'){
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <div class="ch-word">${card.word}</div>
      <button class="mc-btn blue speak-btn" onclick="speak('${card.word}')">🔊 听发音</button>
      <div class="opts" id="opts">
        ${card.options.map(o=>`<button class="opt" onclick="pick(${o},this)">${o}</button>`).join('')}
      </div>`;
  }
  else if(t==='PHONEME_DISCRIMINATION'){
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <button class="mc-btn blue speak-btn" onclick="speak('${card.audio_text}',0.75)">🔊 再听一次</button>
      <div class="opts" id="opts">
        ${card.options.map(o=>`<button class="opt wide" onclick="pick('${o}',this)">${o}</button>`).join('')}
      </div>`;
  }
  else if(t==='PHONICS_CONTEXT_MATCH'){
    const s=String(card.sentence).replace(/_____/g,'<span class="blank">_____</span>');
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <div class="ch-sentence">${s}</div>
      <div class="opts" id="opts">
        ${card.options.map(o=>`<button class="opt wide" onclick="pick('${o}',this)">${o}</button>`).join('')}
      </div>`;
  }
  else { // SIGHT_WORD_FLASH
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <div class="flash-word" id="flashW">${card.word}</div>
      <button class="mc-btn blue" id="flashAgain" onclick="flashAgain()" style="display:none;">🔁 再看一次（不扣时间）</button>
      <div class="opts" id="opts" style="visibility:hidden;">
        ${card.options.map(o=>`<button class="opt wide" onclick="pick('${o}',this)">${o}</button>`).join('')}
      </div>`;
  }

  const speakerHtml = card.speaker
    ? `<div class="speaker"><span class="sp-face">${card.speaker.emoji}</span><span>${card.speaker.label}${card.speaker_is_own_line===false?' · 旁白':''}</span></div>`
    : '';
  document.getElementById('chArea').innerHTML=`
    <div class="ch-card">
      ${speakerHtml}
      ${body}
      <div class="timer-wrap" style="margin-top:14px;"><div class="timer-bar" id="tbar" style="width:100%"></div></div>
    </div>`;

  if(t==='PHONEME_DISCRIMINATION') setTimeout(()=>speak(card.audio_text,0.75),320);
  if(t==='SIGHT_WORD_FLASH'){
    setTimeout(hideFlash, card.flash_ms||800);
  }
}

let tl=TS;   // 剩余秒数：放在模块级，回放视觉词时才能暂停/续跑

function paintTimer(){
  const b=document.getElementById('tbar'); if(!b) return;
  b.style.width=(Math.max(tl,0)/TS*100)+'%';
  b.style.background=tl<10?'#EF5350':(tl<20?'#FFA726':'#66BB6A');
}

/* ── 视觉词闪现：一次没看清可以回放同样时长再作答 ── */
let flashUsed=0;

function hideFlash(){
  const w=document.getElementById('flashW');
  if(w){ w.className='flash-hidden'; w.textContent='? ? ?'; }
  const o=document.getElementById('opts'); if(o) o.style.visibility='visible';
  const b=document.getElementById('flashAgain'); if(b && !answered) b.style.display='inline-block';
  resumeTimer();
}

function flashAgain(){
  if(answered) return;
  track('flash_replay',{word:card.word});
  const w=document.getElementById('flashW'); if(!w) return;
  flashUsed++;
  const b=document.getElementById('flashAgain'); if(b) b.style.display='none';
  const o=document.getElementById('opts'); if(o) o.style.visibility='hidden';
  pauseTimer();                         // 回放期间停表，避免"还没看清就超时"
  w.className='flash-word'; w.textContent=card.word;
  setTimeout(hideFlash, card.flash_ms||800);
}

function startTimer(){
  clearInterval(timerId);
  paintTimer();
  timerId=setInterval(()=>{
    tl--;
    if(!document.getElementById('tbar')){clearInterval(timerId);return;}
    paintTimer();
    if(tl<=0){clearInterval(timerId); if(!answered) pick(null,null,true);}
  },1000);
}

let timerPaused=false;
function pauseTimer(){ clearInterval(timerId); timerPaused=true; }
// 只有真的暂停过才续跑：首次闪现结束时表本来在跑，不能重启（会攒出额外的一拍）
function resumeTimer(){ if(timerPaused && !answered){ timerPaused=false; startTimer(); } }

/* ── 答题 ── */
async function pick(val,btn,timeout=false){
  if(answered) return;
  answered=true;
  clearInterval(timerId);
  const ms=Date.now()-t0;

  const res = answerCard(ch, card, val, ms);

  if(res.error){toast('⚠️ 网络错误','bad');answered=false;return;}

  // 标记选项
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled=true;
    if(String(o.textContent)===String(res.correct_answer)) o.classList.add('correct');
  });
  if(btn && !res.is_correct) btn.classList.add('wrong');

  const okk=res.is_correct;
  track(okk?'answer_ok':'answer_wrong',{type:card.card_type,target:(card.word||card.correct||card.audio_text||''),response:(val==null?'(timeout)':String(val)),ms,timeout});
  if(okk){
    cb++; mx=Math.max(mx,cb);
    let p=10;
    if(cb>=5){p=30;cbB();toast('⭐ '+cb+' 连击！','great');}
    else if(cb>=3){p=20;cbB();}
    else okB();
    const bonus=ms<2000?1.4:1;
    sc+=Math.round(p*bonus); xp=Math.min(100,xp+p);
    const r=btn?btn.getBoundingClientRect():{left:400,top:300,width:0};
    pt(r.left+r.width/2,r.top);
  }else{
    cb=0; noB(); toast(timeout?'⏰ 时间到':'💡 再想想','bad');
  }
  round.push({ok:okk});
  ls.push({ok:okk,type:card.card_type});
  hud();

  renderFeedback(res,okk,timeout);
}

function renderFeedback(res,okk,timeout){
  const f=res.feedback||{};
  const rv=res.reveal||{};
  let extra='';
  if(card.card_type==='SYLLABLE_COUNTING' && rv.display){
    extra=`<div class="reveal">切分：<span class="syl">${rv.display}</span><br>${rv.tip||''}</div>`;
  } else if(card.card_type==='PHONEME_DISCRIMINATION' && rv.pair){
    extra=`<div class="reveal">
      <span class="ph">${rv.pair[0]}</span> ${rv.phonemes[0]} = ${rv.meanings[0]}　·　<span class="ph">${rv.pair[1]}</span> ${rv.phonemes[1]} = ${rv.meanings[1]}<br>${rv.tip||''}
      <br><button class="mc-btn blue" style="font-size:.9em;padding:8px 14px;margin-top:8px;" onclick="speakPair('${rv.pair[0]}','${rv.pair[1]}')">🔊 对比听</button>
    </div>`;
  } else if(card.card_type==='PHONICS_CONTEXT_MATCH' && rv.grapheme){
    extra=`<div class="reveal">字母组合 <span class="ph">${rv.grapheme}</span> → ${rv.phoneme}<br>${rv.articulation||''}<br>同家族：${(rv.family||[]).join('、')}</div>`;
  } else if(card.card_type==='SIGHT_WORD_FLASH' && rv.word){
    extra=`<div class="reveal"><span class="ph">${rv.word}</span> = ${rv.zh}<br>${rv.tip||''}</div>`;
  }

  const box=document.createElement('div');
  box.className='fb'+(okk?'':' bad');
  box.innerHTML=`
    <div class="fb-head">${okk?'✅ 答对了':'💡 再想想'}</div>
    <div class="fb-msg">${f.message||''}</div>
    ${f.hint?`<div class="fb-hint">${f.hint}</div>`:''}
    ${extra}
    <div class="fb-actions"><button class="mc-btn" onclick="adv()">继续 ▶</button></div>`;
  document.querySelector('.ch-card').appendChild(box);
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function speakPair(a,b){
  speak(a,0.7);
  setTimeout(()=>speak(b,0.7),1100);
}

function adv(){
  i++;
  if(i>=N){finish();return;}
  dn();mc_();hud();
  setTimeout(nextCard,180);
}

/* ── 结算 ── */
async function finish(){
  playing=false;
  track('round_finish',{score:sc,correct:ls.filter(x=>x.ok).length,total:N,character:ch});
  clearInterval(timerId);
  const ok=ls.filter(x=>x.ok).length;

    }).join('');

  }

  document.getElementById('chArea').innerHTML=`
    <div class="ch-card" style="text-align:center;">
      <div style="font-size:2.6em;margin:6px 0;">🎧</div>
      <div style="font-size:.62em;color:#3E2723;margin-bottom:8px;">特训完成！</div>
      <div style="font-size:.8em;margin:8px 0;">${stars}</div>
      <div style="font-size:.44em;color:#5D4037;line-height:2;">
        🏆 ${sc} 分　🔥 最高 ${mx} 连击　✅ ${ok}/${N}
      </div>
      <div class="profile-grid" style="margin-top:14px;text-align:left;">
        <div class="prof-box"><h3>🔥 薄弱音素</h3>${weakHtml}</div>
        <div class="prof-box"><h3>📚 下一步推荐</h3>${recHtml}</div>

      </div>

  // 记录本轮

/* ── 学情面板 ── */
async function showProfile(){
  const p=document.getElementById('profPanel');
  p.style.display='block';
  const prof = profileOf(ch);
  const rec = recommendFor(ch, "G2");

      rec.words.slice(0,6).map(w=>`<div class="rec-item"><b>${w.word}</b> ${w.hint||''}</div>`).join('')
    : '<div class="muted">继续练习就会有推荐</div>';
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderError(){
  document.getElementById('chArea').innerHTML=`
    <div class="ch-card"><div style="font-size:.5em;color:#C62828;text-align:center;line-height:2;padding:16px;">
      ⚠️ 字库为空或服务不可用<br><span style="font-size:.8em;color:#8D6E63;">请先在主页面导入 CSV 字库</span>
    </div></div>`;
}

dn();mc_();hud();
if('speechSynthesis' in window) speechSynthesis.getVoices();
window.addEventListener('resize',()=>{dn();mc_()});

</script>
