<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⛏️ Word-Knight | 牛津树单词冒险</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    :root {
      --dirt:#8B5E3C; --grass:#5D8C2E; --gold:#F9A825; --emerald:#43A047;
      --panel-bg:#C4A46C; --panel-border:#6D4C2E;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Press Start 2P',-apple-system,sans-serif;
      background:linear-gradient(180deg,#87CEEB 0%,#B3E5FC 60%,#8B5E3C 60%,#6D4C2E 100%);
      min-height:100vh; overflow-x:hidden;
      image-rendering:pixelated; user-select:none; -webkit-user-select:none;
    }
    .clouds { position:fixed; top:0; left:0; width:100%; height:160px; pointer-events:none; z-index:0; overflow:hidden; }
    .cloud { position:absolute; background:#fff; border:3px solid #e0e0e0; box-shadow:4px 4px 0 #ddd; }
    .cloud:nth-child(1) { width:120px; height:40px; top:30px; left:10%; animation:drift 25s linear infinite; }
    .cloud:nth-child(2) { width:90px; height:32px; top:55px; left:50%; animation:drift 30s linear infinite; animation-delay:-10s; }
    .cloud:nth-child(3) { width:70px; height:28px; top:20px; left:80%; animation:drift 22s linear infinite; animation-delay:-5s; }
    @keyframes drift { 0%{transform:translateX(-200px)} 100%{transform:translateX(calc(100vw+200px))} }

    .app { position:relative; z-index:1; max-width:860px; margin:0 auto; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:100vh; }

    .mc-panel {
      background:var(--panel-bg); border:4px solid var(--panel-border);
      box-shadow:inset -2px -2px 0 rgba(0,0,0,0.2),inset 2px 2px 0 rgba(255,255,255,0.15),0 4px 0 #4A3020,0 6px 14px rgba(0,0,0,0.3);
      padding:12px;
    }

    .header { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; }
    .header h1 { color:#FFE0B2; text-shadow:2px 2px 0 #5D4037; font-size:0.9em; letter-spacing:2px; }
    .header h1 .pick { font-size:1.2em; animation:pickBounce 1s ease infinite; }
    @keyframes pickBounce { 0%,100%{transform:translateY(0) rotate(-10deg)} 50%{transform:translateY(-4px) rotate(5deg)} }

    .char-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .char-row label { color:#3E2723; font-size:0.48em; }
    .char-card { width:52px; height:68px; background:#E0C9A6; border:2px solid #8D6E63; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 2px 0 #6D4C2E; transition:all 0.2s; }
    .char-card:hover { transform:translateY(-2px); }
    .char-card.selected { border-color:#FFD54F; box-shadow:0 0 0 3px rgba(255,213,79,0.4),0 2px 0 #6D4C2E; }
    .char-card .face { font-size:1.6em; } .char-card .name { font-size:0.35em; color:#3E2723; }

    .hud { display:flex; gap:6px; flex-wrap:wrap; }
    .hud-item { flex:1; min-width:55px; background:#5D4037; border:2px solid #3E2723; padding:6px 8px; color:#FFE0B2; text-align:center; box-shadow:0 2px 0 #3E2723; }
    .hud-item .val { font-size:0.8em; margin-top:2px; color:#FFD54F; } .hud-item .lbl { font-size:0.35em; opacity:0.75; }
    .xp-wrap { width:100%; height:14px; background:#3E2723; border:2px solid #4A3020; position:relative; }
    .xp-fill { height:100%; background:linear-gradient(90deg,#66BB6A,#AED581); transition:width 0.4s; }
    .xp-text { position:absolute; top:50%;left:50%;transform:translate(-50%,-50%); font-size:0.38em; color:#FFE0B2; text-shadow:1px 1px 0 #000; }

    .path-box { position:relative; height:140px; background:linear-gradient(180deg,#87CEEB 0%,#B3E5FC 55%,#7C9C3A 55%,#8B5E3C 100%); border:3px solid #4A3020; overflow:hidden; }
    .path-nodes { position:absolute; bottom:50px; left:30px; right:30px; display:flex; align-items:center; height:32px; }
    .path-line { height:5px; background:#8D6E63; flex:1; margin:0 -1px; border-top:1px solid #A1887F; border-radius:2px; }
    .pn { flex-shrink:0; width:30px; height:30px; border:2px solid #4A3020; display:flex; align-items:center; justify-content:center; font-size:0.85em; transition:all 0.3s; }
    .pn.pend { background:#BDBDBD; } .pn.actv { background:#FFD54F; border-color:#F9A825; transform:scale(1.2); animation:glow 0.7s ease infinite alternate; }
    .pn.ok { background:#66BB6A; border-color:#388E3C; } .pn.bad { background:#EF5350; border-color:#C62828; }
    @keyframes glow { 0%{box-shadow:0 0 4px rgba(255,213,79,0.6)} 100%{box-shadow:0 0 14px rgba(255,213,79,0.9)} }

    .char-sprite { position:absolute; bottom:30px; font-size:2.5em; transition:left 0.6s cubic-bezier(0.34,1.56,0.64,1); z-index:10; filter:drop-shadow(2px 3px 0 rgba(0,0,0,0.3)); pointer-events:none; }
    .char-sprite.jump { animation:charJump 0.5s ease; }
    @keyframes charJump { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-28px) rotate(-5deg)} }

    .ch-area { min-height:160px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .ch-card { background:#FFF8E1; border:4px solid #8D6E63; box-shadow:0 5px 0 #5D4037,0 6px 14px rgba(0,0,0,0.2); padding:20px; width:100%; max-width:660px; animation:cardIn 0.4s ease; }
    @keyframes cardIn { 0%{transform:translateY(14px) scale(0.96);opacity:0} 100%{transform:translateY(0) scale(1);opacity:1} }
    .ch-card .ch-hint { font-size:0.45em; color:#8D6E63; margin-bottom:8px; }
    .ch-card .ch-sentence { font-size:1.05em; color:#3E2723; margin-bottom:12px; line-height:1.6; text-align:center; font-family:-apple-system,'PingFang SC',sans-serif; font-weight:600; }
    .ch-card .ch-blanked { font-size:1.3em; color:#3E2723; text-align:center; margin-bottom:16px; letter-spacing:4px; }
    .ch-card .ch-input { font-family:'Press Start 2P',monospace; font-size:1.1em; padding:12px 16px; width:200px; text-align:center; border:4px solid #BDBDBD; background:#fff; letter-spacing:6px; text-transform:lowercase; outline:none; transition:border-color 0.2s; }
    .ch-card .ch-input:focus { border-color:#F9A825; }
    .ch-card .ch-input.ok { border-color:#66BB6A; background:#E8F5E9; }
    .ch-card .ch-input.ng { border-color:#EF5350; background:#FFEBEE; animation:shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

    .timer-wrap { width:100%; height:10px; background:#E0E0E0; border:2px solid #BDBDBD; margin-bottom:10px; position:relative; border-radius:2px; overflow:hidden; }
    .timer-bar { height:100%; background:#66BB6A; transition:width 1s linear,background 0.5s; border-radius:1px; }
    .timer-bar.warn { background:#FFA726; } .timer-bar.danger { background:#EF5350; animation:pulse 0.5s ease infinite alternate; }
    @keyframes pulse { 0%{opacity:1} 100%{opacity:0.5} }
    .timer-num { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:0.45em; color:#3E2723; font-weight:bold; }

    .mc-btn { padding:12px 24px; font-family:inherit; font-size:0.5em; background:#5D8C2E; color:#FFE0B2; border:3px solid #33691E; box-shadow:0 4px 0 #33691E; cursor:pointer; transition:all 0.15s; }
    .mc-btn:hover { transform:translateY(-2px); box-shadow:0 6px 0 #33691E; }
    .mc-btn:active,.mc-btn.down { transform:translateY(2px); box-shadow:0 2px 0 #33691E; }
    .mc-btn.down { opacity:0.6; pointer-events:none; }
    .mc-btn.blue { background:#1565C0; border-color:#0D47A1; box-shadow:0 4px 0 #0D47A1; }

    .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); padding:12px 24px; font-family:inherit; font-size:0.48em; z-index:100; pointer-events:none; border:3px solid; box-shadow:0 4px 0 rgba(0,0,0,0.2); opacity:0; }
    .toast.show { opacity:1; animation:toastIn 0.4s ease,toastOut 0.4s ease 2s forwards; }
    .toast.ok { background:#C8E6C9; border-color:#388E3C; color:#2E7D32; }
    .toast.bad { background:#FFCDD2; border-color:#C62828; color:#B71C1C; }
    .toast.great { background:#FFF9C4; border-color:#F9A825; color:#F57F17; }
    @keyframes toastIn { 0%{opacity:0;transform:translateX(-50%) translateY(-16px)} 100%{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes toastOut { 0%{opacity:1} 100%{opacity:0;transform:translateX(-50%) translateY(-16px)} }

    .ov-card { margin:10px auto; }
    .ov-card h2 { color:#FFD54F; font-size:0.72em; text-shadow:2px 2px 0 #5D4037; margin-bottom:10px; }
    .egg { font-size:6em; animation:eggBounce 0.6s ease infinite alternate; margin:10px 0; }
    @keyframes eggBounce { 0%{transform:translateY(0)} 100%{transform:translateY(-10px)} }
    .ov-card p { color:#3E2723; font-size:0.48em; line-height:1.8; }
    .ov-tbl { width:100%; border-collapse:collapse; margin:10px auto; }
    .ov-tbl th,.ov-tbl td { padding:5px 8px; font-size:0.42em; border:2px solid #8D6E63; }
    .ov-tbl th { background:#5D4037; color:#FFE0B2; }
    .ov-tbl td { color:#3E2723; } .ov-tbl .fail { color:#E53935; font-weight:bold; }

    .particles { position:fixed; inset:0; pointer-events:none; z-index:60; }
    .p { position:absolute; font-size:1.1em; animation:pUp 0.9s ease forwards; }
    @keyframes pUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-60px) scale(0.3)} }

    .grass-footer { position:fixed; bottom:0; left:0; right:0; height:14px; background:repeating-linear-gradient(90deg,var(--grass) 0px,var(--grass) 4px,#4A7A1E 4px,#4A7A1E 8px); z-index:0; border-top:2px solid #3E6A12; }

    @media (max-width:600px) {
      .header h1 { font-size:0.65em; } .ch-card .ch-sentence { font-size:0.8em; }
      .char-sprite { font-size:2em; } .path-box { height:110px; }
      .ch-card .ch-input { width:150px; font-size:0.85em; }
    }
  
  .nav-tabs{display:flex;gap:6px;padding:8px;}
  .nav-tabs .tab{flex:1;text-align:center;text-decoration:none;font-size:.46em;padding:11px 10px;background:#E0C9A6;color:#5D4037;border:2px solid #8D6E63;box-shadow:0 3px 0 #6D4C2E;}
  .nav-tabs .tab.active{background:#FFD54F;color:#3E2723;border-color:#F9A825;box-shadow:0 3px 0 #C17900;}

    /* ── iPad / 平板适配（Chrome on iPadOS 走 WebKit）── */
    html { -webkit-text-size-adjust:100%; }
    body { touch-action:manipulation; }
    @media (min-width:768px) {          /* iPad 竖屏 768 起 */
      html { font-size:17px; }
      .app { max-width:940px; padding:14px; gap:10px; }
      .ch-card { max-width:760px; padding:24px; }
    }
    @media (min-width:1024px) {         /* iPad 横屏 / 大屏 */
      html { font-size:18px; }
      .app { max-width:1060px; }
      .ch-card { max-width:840px; }
    }
    @media (min-width:768px) and (max-height:840px) {   /* 横屏纵向吃紧，压缩留白 */
      .app { gap:6px; padding:8px 14px; }
      .ch-card { padding:18px; }
    }

</style>
</head>

function beep(f,d,t='square'){try{if(!aud)aud=new(window.AudioContext||window.webkitAudioContext)();const o=aud.createOscillator(),g=aud.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.06;g.gain.exponentialRampToValueAtTime(0.001,aud.currentTime+d);o.connect(g);g.connect(aud.destination);o.start();o.stop(aud.currentTime+d)}catch(e){}}

// ── Cloze logic ──
function c_makeCloze(word) {
  const clean = word.replace(/…/g, ' ').replace(/\s+/g, ' ').trim();
  const parts = clean.split(' ');
  const lettersOnly = parts.join('');
  const total = lettersOnly.length;
  if (total <= 2) {
    return { blanked: lettersOnly[0] + '_', hidden: lettersOnly.slice(1), answerLen: total - 1 };
  }
  const hideLen = Math.max(Math.ceil(total * 0.4), 2);
  const start = Math.floor(Math.random() * (total - hideLen + 1));
  const end = start + hideLen;
  let blanked = '', hidden = '', idx = 0;
  for (let k = 0; k < parts.length; k++) {
    if (k > 0) blanked += ' ';
    for (const ch of parts[k]) {
      if (idx >= start && idx < end) { blanked += '_'; hidden += ch; }
      else { blanked += ch; }
      idx++;
    }
  }
  return { blanked: blanked.toLowerCase(), hidden: hidden.toLowerCase(), answerLen: hideLen, phraseLen: total };
}

function c_sentenceWithCloze(sentence, word, cloze) {
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(escaped, 'i');
  if (re.test(sentence)) return sentence.replace(re, cloze.blanked);
  if (sentence.includes('____')) return sentence.replace('____', cloze.blanked);
  return sentence + ' (' + cloze.blanked + ')';
}

function c_shuffle(a) { for (let j = a.length - 1; j > 0; j--) { const k = Math.floor(Math.random() * (j + 1)); [a[j], a[k]] = [a[k], a[j]]; } return a; }

async function c_load() {
  try {
    let pool = WORDS.filter(w => w.oxford_level === lv);
    // 人物一致性：只保留「本人出场」或「无人出场（旁白）」
    const _cs = s => ['biff','chip','kipper','wilma','floppy','gran','mum','dad','wilf']
      .filter(n => new RegExp('\\b' + n + '\\b', 'i').test(String(s || '')));

    // 人物一致性硬过滤：只留「本人出场」或「旁白」，别人的台词一律不进池
    pool = pool.filter(w => { const who = _cs(w.sentence); return who.length === 0 || who.indexOf(ch) >= 0; });
    // 同轮去重
    { const seenW = new Set();
      pool = pool.filter(w => { const k = String(w.word).trim().toLowerCase();
        if (seenW.has(k)) return false; seenW.add(k); return true; }); }
    if (!pool.length) { document.getElementById('chArea').innerHTML = '<div style="text-align:center;padding:30px;color:#C62828;">⚠️ 字库为空</div>'; return false; }
    if (pool.length < 4) { document.getElementById('chArea').innerHTML = '<div style="text-align:center;padding:30px;color:#E65100;">⚠️ 字库不足</div>'; return false; }

    /*
     * 选词打分（与 backend/pick.js 同一套规则）
     *   冷启动：rand() + 0.9×角色本人台词 → 近似均匀随机
     *   有历史：再叠加 错题 +3.5 / 近 3 轮出现 -3.0
     *   人工权重改为加分制（1.5 + 0.8×★），不再占固定名额
     */
    const _ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(d)); } catch (e) { return d; } };
    const _seen = new Set(_ls('owk_seen', []));
    const _miss = new Set(_ls('owk_miss', []));
    const _cold = _seen.size === 0 && _miss.size === 0;
    const _prio = new Map();
    try {
      (_ls('owk_user_words', []) || []).forEach(u => {
        const k = String(u.word || '').trim().toLowerCase();
        if (k) _prio.set(k, Number(u.weight) || 3);
      });
    } catch (e) { /* localStorage 不可用则忽略 */ }

    pool = pool.map(w => {
      const k = String(w.word).toLowerCase();
      let s = Math.random();
      if (_cs(w.sentence).indexOf(ch) >= 0) s += 0.15;
      if (!_cold) {
        if (_miss.has(k)) s += 3.5;
        if (_seen.has(k)) s -= 3.0;
      }
      const star = _prio.get(k) || 0;
      if (star > 0) s += 0.4 + star * 0.16;
      return { w, s };
    }).sort((a, b) => b.s - a.s).slice(0, N).map(x => x.w);

    // 记录本轮用过的词（保留最近 3 轮）
    try {
      const _keep = _ls('owk_seen', []).concat(pool.map(w => String(w.word).toLowerCase()));
      localStorage.setItem('owk_seen', JSON.stringify(_keep.slice(-N * 3)));
    } catch (e) {}

    qs = pool.map(w => { const cz = c_makeCloze(w.word); const clue = w.sentence ? c_sentenceWithCloze(w.sentence, w.word, cz) : '____ (' + w.hint + ')'; return { word: w.word, hint: w.hint, sentence: w.sentence || '', clue, blanked: cz.blanked, hidden: cz.hidden, answerLen: cz.answerLen }; });
    return true;
  } catch (e) { document.getElementById('chArea').innerHTML = '<div style="text-align:center;padding:30px;color:#C62828;">❌ 加载失败</div>'; return false; }
}
