<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 Word-Knight | Phonics</title>
<style>
  @font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/press-start-2p.woff2') format('woff2');}
  :root{
    --dirt:#8B5E3C; --grass:#5D8C2E; --gold:#F9A825; --emerald:#43A047;
    --panel-bg:#C4A46C; --panel-border:#6D4C2E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Press Start 2P',-apple-system,sans-serif;
    background:linear-gradient(180deg,#87CEEB 0%,#B3E5FC 60%,#8B5E3C 60%,#6D4C2E 100%);
    min-height:100vh;overflow-x:hidden;image-rendering:pixelated;
    user-select:none;-webkit-user-select:none;
  }
  .clouds{position:fixed;top:0;left:0;width:100%;height:160px;pointer-events:none;z-index:0;overflow:hidden;}
  .cloud{position:absolute;background:#fff;border:3px solid #e0e0e0;box-shadow:4px 4px 0 #ddd;}
  .cloud:nth-child(1){width:120px;height:40px;top:30px;left:10%;animation:drift 25s linear infinite;}
  .cloud:nth-child(2){width:90px;height:32px;top:55px;left:50%;animation:drift 30s linear infinite;animation-delay:-10s;}
  .cloud:nth-child(3){width:70px;height:28px;top:20px;left:80%;animation:drift 22s linear infinite;animation-delay:-5s;}
  @keyframes drift{0%{transform:translateX(-200px)}100%{transform:translateX(calc(100vw + 200px))}}
  .app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:100vh;}

  .mc-panel{background:var(--panel-bg);border:4px solid var(--panel-border);
    box-shadow:inset -2px -2px 0 rgba(0,0,0,.2),inset 2px 2px 0 rgba(255,255,255,.15),0 4px 0 #4A3020,0 6px 14px rgba(0,0,0,.3);padding:12px;}

  .header{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;}
  .header h1{color:#FFE0B2;text-shadow:2px 2px 0 #5D4037;font-size:.82em;letter-spacing:1.4px;}
  .header .pick{font-size:1.15em;animation:pickBounce 1s ease infinite;display:inline-block;}
  @keyframes pickBounce{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-4px) rotate(5deg)}}
  .nav-tabs{display:flex;gap:6px;padding:8px;}
  .tab{flex:1;text-align:center;text-decoration:none;font-family:inherit;font-size:.46em;
    padding:12px 10px;background:#E0C9A6;color:#5D4037;border:2px solid #8D6E63;
    box-shadow:0 3px 0 #6D4C2E;transition:all .15s;line-height:1.4;}
  .tab:hover{transform:translateY(-2px);box-shadow:0 5px 0 #6D4C2E;}
  .tab.active{background:#FFD54F;color:#3E2723;border-color:#F9A825;box-shadow:0 3px 0 #C17900;}
  .speaker{display:flex;align-items:center;gap:8px;font-size:.44em;color:#5D4037;margin-bottom:10px;}
  .speaker .sp-face{font-size:1.7em;line-height:1;}

  .char-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .char-row label{color:#3E2723;font-size:.46em;}
  .char-card{width:50px;height:64px;background:#E0C9A6;border:2px solid #8D6E63;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 #6D4C2E;transition:all .2s;}
  .char-card:hover{transform:translateY(-2px);}
  .char-card.selected{border-color:#FFD54F;box-shadow:0 0 0 3px rgba(255,213,79,.45),0 2px 0 #6D4C2E;}
  .char-card .face{font-size:1.45em;} .char-card .name{font-size:.32em;color:#3E2723;}

  .hud{display:flex;gap:6px;flex-wrap:wrap;}
  .hud-item{flex:1;min-width:55px;background:#5D4037;border:2px solid #3E2723;padding:6px 8px;color:#FFE0B2;text-align:center;box-shadow:0 2px 0 #3E2723;}
  .hud-item .val{font-size:.78em;margin-top:2px;color:#FFD54F;} .hud-item .lbl{font-size:.33em;opacity:.75;}
  .xp-wrap{width:100%;height:14px;background:#3E2723;border:2px solid #4A3020;position:relative;}
  .xp-fill{height:100%;background:linear-gradient(90deg,#66BB6A,#AED581);transition:width .4s;}
  .xp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.36em;color:#FFE0B2;text-shadow:1px 1px 0 #000;}

  .path-box{position:relative;height:104px;background:linear-gradient(180deg,#87CEEB 0%,#B3E5FC 55%,#7C9C3A 55%,#8B5E3C 100%);border:3px solid #4A3020;overflow:hidden;}
  .path-nodes{position:absolute;bottom:40px;left:24px;right:24px;display:flex;align-items:center;height:28px;}
  .path-line{height:5px;background:#8D6E63;flex:1;margin:0 -1px;border-top:1px solid #A1887F;border-radius:2px;}
  .pn{flex-shrink:0;width:26px;height:26px;border:2px solid #4A3020;display:flex;align-items:center;justify-content:center;font-size:.75em;transition:all .3s;background:#BDBDBD;}
  .pn.actv{background:#FFD54F;border-color:#F9A825;transform:scale(1.18);animation:glow .7s ease infinite alternate;}
  .pn.ok{background:#66BB6A;border-color:#388E3C;} .pn.bad{background:#EF5350;border-color:#C62828;}
  @keyframes glow{0%{box-shadow:0 0 4px rgba(255,213,79,.6)}100%{box-shadow:0 0 14px rgba(255,213,79,.9)}}
  .char-sprite{position:absolute;bottom:22px;font-size:2.1em;transition:left .6s cubic-bezier(.34,1.56,.64,1);z-index:10;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3));pointer-events:none;}
  .char-sprite.jump{animation:charJump .5s ease;}
  @keyframes charJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px) rotate(-5deg)}}

  .ch-area{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ch-card{background:#FFF8E1;border:4px solid #8D6E63;box-shadow:0 5px 0 #5D4037,0 6px 14px rgba(0,0,0,.2);padding:18px;width:100%;max-width:680px;animation:cardIn .4s ease;}
  @keyframes cardIn{0%{transform:translateY(14px) scale(.96);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

  .timer-wrap{width:100%;height:12px;background:#E0E0E0;border:2px solid #BDBDBD;position:relative;border-radius:2px;overflow:hidden;}
  .timer-bar{height:100%;width:100%;background:#66BB6A;transition:width 1s linear,background .5s;border-radius:1px;}

  .type-badge{display:inline-block;background:#5D4037;color:#FFE0B2;font-size:.36em;padding:4px 8px;letter-spacing:1px;margin-bottom:10px;border:2px solid #3E2723;}
  .type-badge.phoneme{background:#1565C0;border-color:#0D47A1;}
  .type-badge.phonics{background:#6A1B9A;border-color:#4A148C;}
  .type-badge.sight{background:#EF6C00;border-color:#E65100;}
  .type-badge.syllable{background:#2E7D32;border-color:#1B5E20;}

  .ch-prompt{font-size:max(.56em,11px);color:#8D6E63;margin-bottom:12px;line-height:1.8;}
  .ch-word{font-family:'Press Start 2P',monospace;font-size:2.1em;color:#3E2723;text-align:center;letter-spacing:3px;margin:10px 0 4px;word-break:break-word;}
  .ch-sentence{font-size:max(1.12em,17px);color:#3E2723;margin-bottom:6px;line-height:1.7;text-align:center;font-family:-apple-system,'PingFang SC',sans-serif;font-weight:600;}
.ch-hint{font-size:.46em;color:#5D4037;background:#FFF8E1;border-left:3px solid #FFD54F;padding:6px 10px;margin:6px 0 10px;line-height:1.7}
/* ── 面具收藏 ── */
.sync-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:2px dashed #C8A97E}
.sync-lbl{font-size:max(.44em,10.5px);color:#8D6E63}
.sync-code{font-family:'Press Start 2P',monospace;font-size:max(.62em,12px);color:#3E2723;letter-spacing:2px;background:#F0DDB8;border:2px solid #8D6E63;padding:5px 9px}
.sync-btn{padding:6px 12px !important;font-size:max(.42em,10px) !important}
.mask-strip{background:#FFF8E1;border:3px solid #D7CCC8;border-radius:8px;padding:12px;text-align:center}
.mask-title{font-size:.46em;color:#5D4037;margin-bottom:10px}
.mask-title b{color:#BF360C}
.mask-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.mask-slot{width:44px;height:44px;border-radius:8px;border:3px dashed #D7CCC8;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;color:#BCAAA4}
.mask-slot.got{border-style:solid;border-color:#FFB300;background:#FFF3E0;box-shadow:0 2px 0 #E0A800}
.mask-hint{font-size:.4em;color:#8D6E63}
.ball-btn{background:#6A1B9A;color:#fff;border-color:#4A148C}
.mask-award{display:inline-flex;gap:10px;align-items:center;background:#FFF3E0;border:3px solid #FFB300;border-radius:8px;padding:10px 14px;margin:10px 0}
.ma-emoji{font-size:30px}
.ma-title{font-size:.4em;color:#BF360C}
.ma-name{font-size:.56em;color:#5D4037;font-weight:700}
.ma-who{font-size:.38em;color:#8D6E63}
.mask-done{font-size:.44em;color:#6A1B9A;background:#F3E5F5;border-radius:6px;padding:8px;margin:8px 0}
/* ── 假面舞会 ── */
.ball-overlay{position:fixed;inset:0;background:rgba(20,10,0,.82);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.ball-card{background:#2D1F0E;border:4px solid #FFB300;border-radius:12px;padding:22px 20px;max-width:520px;width:100%;text-align:center;box-shadow:0 0 40px rgba(255,179,0,.45)}
.ball-lights{font-size:.7em;letter-spacing:6px;margin-bottom:8px}
.ball-card h2{font-size:1.05em;color:#FFD54F;margin:6px 0 10px;text-shadow:0 0 12px rgba(255,213,79,.7)}
.ball-sub{font-size:.42em;color:#FFE0B2;line-height:1.9;margin-bottom:16px}
.ball-stage{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.ball-guest{background:rgba(255,255,255,.06);border:2px solid #6D4C41;border-radius:10px;padding:10px 12px;min-width:76px}
.ball-face{position:relative;font-size:30px;line-height:1}
.ball-mask{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:18px}
.ball-name{font-size:.36em;color:#FFE0B2;margin-top:6px}
.ball-note{font-size:.4em;color:#FFD54F;min-height:1.4em;margin-bottom:12px}
.mark-opts{gap:14px}
.opt.mark{min-width:70px;font-size:max(1.5em,24px);font-family:Georgia,"Times New Roman",serif;padding:10px 14px;line-height:1.2}
.type-badge.punct{background:#7B1FA2;color:#fff}
.ch-hint b{color:#BF360C}
  .ch-sentence .blank{color:#F9A825;letter-spacing:2px;border-bottom:3px solid #F9A825;padding:0 10px;}
  .speak-btn{display:block;margin:8px auto 14px;font-size:.42em;padding:10px 18px;}

  .opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
  .opt{font-family:inherit;font-size:max(.78em,13px);padding:14px 20px;min-width:92px;background:#E0C9A6;color:#3E2723;
    border:3px solid #8D6E63;box-shadow:0 4px 0 #6D4C2E;cursor:pointer;transition:all .15s;line-height:1.5;}
  .opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 #6D4C2E;background:#F0DDB8;}
  .opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #6D4C2E;}
  .opt.wide{min-width:150px;font-size:max(.72em,12.5px);}
  .opt.correct{background:#A5D6A7;border-color:#2E7D32;box-shadow:0 4px 0 #2E7D32;}
  .opt.wrong{background:#EF9A9A;border-color:#B71C1C;box-shadow:0 4px 0 #B71C1C;animation:shake .4s ease;}
  .opt:disabled{cursor:default;opacity:.9;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  .flash-word{font-family:'Press Start 2P',monospace;font-size:2.4em;color:#EF6C00;text-align:center;letter-spacing:4px;margin:18px 0;}
  .flash-hidden{font-size:.7em;color:#BDBDBD;text-align:center;letter-spacing:6px;margin:18px 0;}

  .fb{margin-top:14px;border-left:8px solid #66BB6A;background:#F1F8E9;padding:12px 14px;animation:cardIn .35s ease;}
  .fb.bad{border-left-color:#EF5252;background:#FFEBEE;}
  .fb-head{font-size:.82em;margin-bottom:12px;}
  .fb.bad .fb-head{color:#C62828;} .fb:not(.bad) .fb-head{color:#2E7D32;}
  .fb-msg{font-size:.8em;line-height:1.8;color:#3E2723;}
  .fb-hint{font-size:.7em;line-height:1.75;color:#5D4037;margin-top:8px;background:rgba(255,255,255,.7);padding:8px;border:2px dashed #BCAAA4;}
  .reveal{margin-top:14px;font-size:.76em;line-height:1.8;color:#4E342E;}
  .reveal .syl{font-family:'Press Start 2P',monospace;color:#1565C0;font-size:1.5em;letter-spacing:2px;}
  .reveal .ph{color:#6A1B9A;font-weight:bold;}
  .fb-actions{margin-top:12px;text-align:right;}

  .mc-btn{padding:12px 22px;font-family:inherit;font-size:max(.64em,12px);background:#5D8C2E;color:#FFE0B2;border:3px solid #33691E;box-shadow:0 4px 0 #33691E;cursor:pointer;transition:all .15s;}
  .mc-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #33691E;}
  .mc-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #33691E;}
  .mc-btn.blue{background:#1565C0;border-color:#0D47A1;box-shadow:0 4px 0 #0D47A1;}
  .mc-btn.ghost{background:#8D6E63;border-color:#5D4037;box-shadow:0 4px 0 #5D4037;}
  .mc-btn.down{opacity:.55;pointer-events:none;}

  .toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:12px 24px;font-family:inherit;font-size:.46em;z-index:100;pointer-events:none;border:3px solid;box-shadow:0 4px 0 rgba(0,0,0,.2);opacity:0;}
  .toast.show{opacity:1;animation:toastIn .4s ease,toastOut .4s ease 2s forwards;}
  .toast.ok{background:#C8E6C9;border-color:#388E3C;color:#2E7D32;}
  .toast.bad{background:#FFCDD2;border-color:#C62828;color:#B71C1C;}
  .toast.great{background:#FFF9C4;border-color:#F9A825;color:#F57F17;}
  @keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-16px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes toastOut{0%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-16px)}}

  .particles{position:fixed;inset:0;pointer-events:none;z-index:60;}
  .p{position:absolute;font-size:1.1em;animation:pUp .9s ease forwards;}
  @keyframes pUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(.3)}}

  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .prof-box{background:#5D4037;border:3px solid #3E2723;padding:10px;color:#FFE0B2;}
  .prof-box h3{font-size:.4em;color:#FFD54F;margin-bottom:8px;letter-spacing:1px;}
  .chip{display:inline-block;background:#3E2723;border:2px solid #8D6E63;font-size:.36em;padding:5px 8px;margin:3px;}
  .chip.hot{border-color:#EF5350;color:#FF8A80;}
  .chip.warm{border-color:#FFA726;color:#FFD180;}
  .rec-item{font-size:.36em;line-height:1.9;padding:3px 0;border-bottom:1px dashed #6D4C2E;}
  .rec-item b{color:#FFD54F;}
  .muted{font-size:.34em;color:#BCAAA4;line-height:1.9;}

  @media (max-width:600px){
    .header h1{font-size:.6em;} .ch-word{font-size:1.5em;} .profile-grid{grid-template-columns:1fr;}
    .ch-sentence{font-size:.82em;} .char-sprite{font-size:1.7em;} .path-box{height:88px;}
  }

    /* ── iPad / 平板适配（Chrome on iPadOS 走 WebKit）── */
    html { -webkit-text-size-adjust:100%; }
    body { touch-action:manipulation; }
    @media (min-width:768px) {          /* iPad 竖屏 768 起 */
      html { font-size:17px; }
      .app { max-width:940px; padding:14px; gap:10px; }
      .ch-card { max-width:760px; padding:24px; }
    }
    @media (min-width:1024px) {         /* iPad 横屏 / 大屏 */
      html { font-size:18px; }
      .app { max-width:1060px; }
      .ch-card { max-width:840px; }
    }
    @media (min-width:768px) and (max-height:840px) {   /* 横屏纵向吃紧，压缩留白 */
      .app { gap:6px; padding:8px 14px; }
      .ch-card { padding:18px; }
    }

</style>
</head>
<body>
<div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
<div class="particles" id="pcs"></div>

<div class="app">
  <div class="mc-panel header">
    <h1><span class="pick">🎧</span>Phonics</h1>
  </div>

  <div class="mc-panel nav-tabs">
    <a class="tab active" href="/practice">🎧 Phonics</a>
    <a class="tab" href="/">⛏️ Word Adventure</a>
  </div>

  <div class="mc-panel char-row">
    <label>角色:</label>
    <div class="char-card selected" id="charBiff" onclick="sel('biff')"><div class="face">👧🏻</div><div class="name">Biff</div></div>
    <div class="char-card" id="charChip" onclick="sel('chip')"><div class="face">🧒🏻</div><div class="name">Chip</div></div>
    <div class="char-card" id="charKipper" onclick="sel('kipper')"><div class="face">👦🏻</div><div class="name">Kipper</div></div>
    <div class="char-card" id="charWilma" onclick="sel('wilma')"><div class="face">👧🏽</div><div class="name">Wilma</div></div>
    <div class="char-card" id="charFloppy" onclick="sel('floppy')"><div class="face">🐶</div><div class="name">Floppy</div></div>
  </div>

  <div class="hud">
    <div class="hud-item"><div class="lbl">🏆 得分</div><div class="val" id="s">0</div></div>
    <div class="hud-item"><div class="lbl">🔥 连击</div><div class="val" id="c">0</div></div>
    <div class="hud-item"><div class="lbl">📊 进度</div><div class="val" id="p">0/8</div></div>
    <div class="hud-item"><div class="lbl">🎯 正确率</div><div class="val" id="acc">—</div></div>
  </div>
  <div class="xp-wrap"><div class="xp-fill" id="xpFill" style="width:0%"></div><div class="xp-text" id="xpText">XP 0/100</div></div>

  <div class="mc-panel" style="padding:0;overflow:hidden;">
    <div class="path-box"><div class="path-nodes" id="pnodes"></div><div class="char-sprite" id="csprite" style="left:6px;">👧🏻</div></div>
  </div>

  <div class="mc-panel ch-area" id="chArea">
    <div style="color:#5D4037;font-size:.46em;text-align:center;padding:36px;line-height:2;">
      音节 · 音素 · 拼读 · 视觉词<br><br>准备好了吗？
    </div>
  </div>

  <div class="toolbar">
    <button class="mc-btn" id="goBtn" onclick="start()">🎧 开始特训</button>
    <button class="mc-btn blue" id="profBtn" onclick="showProfile()">📈 我的学情</button>
    <button class="mc-btn ghost" id="rstBtn" style="display:none;" onclick="start()">🔄 再来一轮</button>
  </div>

  <div class="mc-panel" id="profPanel" style="display:none;">
    <div style="color:#FFE0B2;font-size:.5em;margin-bottom:4px;">📈 学情画像 <span style="font-size:.7em;opacity:.7;">（答题即更新）</span></div>
    <div class="profile-grid">
      <div class="prof-box"><h3>🔥 薄弱音素（错误权重）</h3><div id="weakPh"></div></div>
      <div class="prof-box"><h3>📚 靶向回流推荐</h3><div id="recBox"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='/api';
const F={biff:'👧🏻',chip:'🧒🏻',kipper:'👦🏻',wilma:'👧🏽',floppy:'🐶'};
const NM={biff:'Biff',chip:'Chip',kipper:'Kipper',wilma:'Wilma',floppy:'Floppy'};
const N=8, TS=45;   // 8 题一轮，每题 45 秒（音节题要拍手数，给足时间）

document.addEventListener('DOMContentLoaded',()=>track('visit',{page:'phonics'}));
let playing=false;
let ch='biff', i=0, sc=0, cb=0, mx=0, xp=0, ls=[], card=null, t0=0, timerId=null, answered=false, round=[], plan=[], roundWords=[];

/* ── 音效 ── */
let aud=null;
function beep(f,d,t='square'){try{if(!aud)aud=new(window.AudioContext||window.webkitAudioContext)();const o=aud.createOscillator(),g=aud.createGain();o.type=t;o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,aud.currentTime+d);o.connect(g);g.connect(aud.destination);o.start();o.stop(aud.currentTime+d)}catch(e){}}
const okB=()=>{beep(523,.1);setTimeout(()=>beep(659,.1),100);setTimeout(()=>beep(784,.15),200)};
const noB=()=>beep(180,.3,'sawtooth');
const cbB=()=>{beep(784,.07);setTimeout(()=>beep(988,.07),70);setTimeout(()=>beep(1175,.1),140)};

/* ── 语音合成（真实发音，替代截图里的静态音波） ── */
/* ── 会话埋点：同一个 IP 的一次 session 内的全部行为 ── */
const SID=(()=>{try{let v=sessionStorage.getItem('owk_sid');if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,'').slice(0,16);sessionStorage.setItem('owk_sid',v);}return v;}catch(e){return 'nosid';}})();
function track(event,detail){

    fetch('/api/track',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sid:SID,event,detail:detail||'',player:(typeof ch!=='undefined'?ch:''),path:location.pathname})}).catch(()=>{});
  }catch(e){}
}

/* ── 角色音色：男生用男声，女生用女声，Floppy 用更高更轻的宠物音 ── */
const VOICE_PROFILE={
  biff:  {gender:'female', pitch:1.15},
  chip:  {gender:'male',   pitch:0.85},
  kipper:{gender:'male',   pitch:0.95},
  wilma: {gender:'female', pitch:1.08},
  floppy:{gender:'female', pitch:1.45},
};
// Samantha 里含 "man"，所以 male 判定要排除 female 命中项
const FEMALE_RE=/female|woman|samantha|victoria|karen|serena|kate|martha|moira|fiona|tessa|susan|zira|aria|jenny|michelle|ava|allison|nicky/i;
const MALE_RE=/\bmale\b|daniel|alex|fred|oliver|aaron|arthur|george|david|mark|guy|ryan|james|liam/i;

function pickVoice(gender){
  try{
    const all=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    if(!all.length) return null;
    // 关键：能用本地语音就别用网络语音。
    // Chrome 的 "Google UK English Female/Male" 是网络语音，离线或网络受限时会**静默失败**——
    // 表现就是"点了没声音、也没有报错"。macOS 自带语音（Daniel/Samantha…）是 localService，稳定。
    const local=all.filter(v=>v.localService);
    const want=(v)=> gender==='male'
      ? (MALE_RE.test(v.name) && !FEMALE_RE.test(v.name))
      : FEMALE_RE.test(v.name);
    for (const pool of [local, all]) {
      if (!pool.length) continue;
      const gb=pool.filter(v=>/en[-_]GB/i.test(v.lang));
      const hit=gb.find(want) || pool.find(want);
      if (hit) return hit;
    }
    return local[0] || all[0];
  }catch(e){ return null; }
}

/* ── Azure 预生成音频（构建期产出，见 backend/gen-audio.js）──
 * 静态站不能在前端调 TTS API（key 会暴露），所以音频是构建期落盘的 mp3。
 * 有音频文件就播文件：音质稳定、支持 iOS、不依赖系统装了哪些语音。
 * 没有就回落到 speechSynthesis（新词还没生成时的兜底）。
 */
/* 只拉精简索引（约 34 KB），不再拉 1 MB 的 manifest.json。
 * manifest 里的 bytes/voice/variants 前端一个都用不上：
 *   词的路径可推导 → words/<w>.mp3 / words/<w>__<char>.mp3
 *   句子的文件名是 sha1 前 12 位，推不出来，所以索引里保留映射。
 * 由 backend/build-audio-index.js 生成，build-pages.js 每次构建会顺带刷新。 */
let AUDIO_INDEX=null, _audioWords=null, _curAudio=null;
(async()=>{
  try{
    const r=await fetch('audio/index.json');
    if(r.ok){ AUDIO_INDEX=await r.json(); _audioWords=new Set(String(AUDIO_INDEX.w||'').split(' ')); }
  }catch(e){}
})();

function playFile(rel){
  return new Promise((resolve)=>{
    try{
      if(_curAudio){ try{_curAudio.pause();}catch(e){} _curAudio=null; }
      const a=new Audio('audio/'+rel);
      _curAudio=a;
      let settled=false;
      const done=(v)=>{ if(settled) return; settled=true; resolve(v); };
      a.onended=()=>done(true);
      a.onerror=()=>done(false);
      a.play().catch(()=>done(false));
      setTimeout(()=>done(true), 8000);          // 保险：不让 Promise 永远挂着
    }catch(e){ resolve(false); }
  });
}
function audioForWord(w){
  const k=String(w||'').trim().toLowerCase();
  if(!k) return null;
  // 索引里没有这个词就不试，省一次 404
  if(_audioWords && !_audioWords.has(k)) return null;
  // 先角色版，再中性版：闯关内容和自我介绍必须是同一个声音
  return { paths: ['words/'+k+'__'+ch+'.mp3', 'words/'+k+'.mp3'] };
}

/* 依次尝试多条路径，任意一条播成功就停 */
function playAny(paths){
  return paths.reduce((p, rel) => p.then(ok => ok ? true : playFile(rel)), Promise.resolve(false));
}
/* 整句/短语：先精确匹配 phrases（角色开场白），再匹配例句库。
   之前只查 words，所以 "Hello, I am Biff." 永远查不到 → 掉回系统语音，
   切换角色听起来毫无变化。 */
function audioForText(text){
  const t=String(text||'').trim();
  if(!t || !AUDIO_INDEX) return null;
  const f=(AUDIO_INDEX.p && AUDIO_INDEX.p[t]) || (AUDIO_INDEX.s && AUDIO_INDEX.s[t]);
  return f ? { paths:[f] } : null;
}

/* 系统语音兜底（原实现，保持不变） */
function speakSynth(text,rate=0.85){
  try{
    if(!('speechSynthesis' in window)){
      if(typeof toast==='function') toast('⚠️ 这个浏览器不支持发音','bad');
      return false;
    }
    const prof=VOICE_PROFILE[ch]||VOICE_PROFILE.biff;
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang='en-GB'; u.rate=rate; u.pitch=prof.pitch;

    // 只选「本地语音」：网络语音（Google UK English *）会静默失败
    const v=pickVoice(prof.gender);
    if(v){ u.voice=v; u.lang=v.lang||'en-GB'; }
    try{ console.log('[voice]', ch, prof.gender, '→', v ? (v.name+' / '+v.lang+' / local='+v.localService) : '系统默认', 'pitch='+prof.pitch); }catch(e){}

    // 不做任何"失败重试"：重试会在第一次已经出声的情况下再叠一条默认语音，
    // 表现就是「男声女声同时响」。宁可偶尔没声，也不要两个声音打架。
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

/* 统一入口：预生成 mp3 优先，失败或被浏览器拦（Autoplay 策略）则回落到系统语音。
 * <audio> 比 speechSynthesis 严格——没有用户手势时 play() 会被 NotAllowedError 拒绝，
 * 这里必须回退，否则会出现"点了没声音"。 */
function speak(text,rate=0.85){
  const raw=String(text||'').trim();
  const hit=audioForWord(raw) || audioForText(raw);
  if(hit){
    playAny(hit.paths).then((ok)=>{ if(!ok) speakSynth(text,rate); });
    return true;
  }
  return speakSynth(text,rate);
}

];

function myMasks(){ try{ return JSON.parse(localStorage.getItem(MASK_KEY)||'[]').filter(id=>MASKS.some(m=>m.id===id)); }catch(e){ return []; } }

/* ── 家庭码：学情跨设备同步 ────────────────────────────
 * localStorage 只活在当前浏览器，换台设备孩子就得从零开始。
 * 用一个 6 位家庭码当钥匙，把三份状态存到后端：
 *   owk_masks         面具收藏   → 并集（成就不能丢）
 *   owk_miss          错词       → 取较新的一份（这是会衰减的信号，合并会越积越多）
 *   owk_seen_practice 最近见过的词 → 同上
 *
 * 后端地址：
 *   本地/自建 Node → 同源（SYNC_BASE 为空）
 *   静态 Pages     → 构建时注入 window.OWK_SYNC_BASE 指向 Cloudflare Worker
 */
const SYNC_KEYS = { masks:'owk_masks', miss:'owk_miss', seen:'owk_seen_practice', seenMain:'owk_seen' };
function syncBase(){
  return (typeof window!=='undefined' && window.OWK_SYNC_BASE) ? String(window.OWK_SYNC_BASE).replace(/\/$/,'') : '';
}
function genFamCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 去掉 0/O/1/I，避免念错
  let s=''; for(let i=0;i<6;i++) s+=A[Math.floor(Math.random()*A.length)];
  return s;
}
function famCode(){
  let c=localStorage.getItem('owk_family_code');
  if(!c){ c=genFamCode(); localStorage.setItem('owk_family_code', c); }
  return c;
}
function setFamCode(c){
  const v=String(c||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
  if(v.length<4) return false;
  localStorage.setItem('owk_family_code', v);
  return true;
}
function localPayload(){
  const rd=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?d:v; }catch(e){ return d; } };
  return {
    masks: rd(SYNC_KEYS.masks, []),
    miss:  rd(SYNC_KEYS.miss, []),
    seen:  rd(SYNC_KEYS.seen, rd(SYNC_KEYS.seenMain, [])),
    ts: Date.now(),
  };
}
/* 合并：成就取并集，衰减型信号取较新的 */
function mergePayload(a, b){
  if(!a) return b; if(!b) return a;
  const newer = (b.ts||0) > (a.ts||0) ? b : a;
  const older = newer === b ? a : b;
  return {
    masks: Array.from(new Set([...(a.masks||[]), ...(b.masks||[])])),
    miss: newer.miss && newer.miss.length ? newer.miss : (older.miss||[]),
    seen: newer.seen && newer.seen.length ? newer.seen : (older.seen||[]),
    ts: Math.max(a.ts||0, b.ts||0),
  };
}
function applyPayload(p){
  if(!p) return false;
  if(Array.isArray(p.masks)) localStorage.setItem(SYNC_KEYS.masks, JSON.stringify(p.masks));
  if(Array.isArray(p.miss))  localStorage.setItem(SYNC_KEYS.miss,  JSON.stringify(p.miss));
  if(Array.isArray(p.seen))  localStorage.setItem(SYNC_KEYS.seen,  JSON.stringify(p.seen));
  return true;
}
async function syncPull(){
  const base=syncBase(); if(!base && base!=='') return null;
  try{
    const r=await fetch(base+'/api/state/'+famCode(), { cache:'no-store' });
    if(!r.ok) return null;
    const d=await r.json();
    return d.payload || null;
  }catch(e){ return null; }
}
async function syncPush(){
  const base=syncBase();
  try{
    await fetch(base+'/api/state/'+famCode(), {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ payload: localPayload() }),
    });
    return true;
  }catch(e){ return false; }
}
/* 启动时拉一次 → 合并 → 写回 → 有变化就推一次 */
async function syncInit(){
  if(typeof window!=='undefined' && window.OWK_SYNC_OFF) return;
  const base=syncBase();
  if(!base && base!=='') return;
  const remote=await syncPull();
  if(remote){
    const merged=mergePayload(localPayload(), remote);
    applyPayload(merged);
    await syncPush();
  } else {
    await syncPush();
  }
  if(typeof renderMasks==='function') renderMasks();
  if(typeof renderFamCode==='function') renderFamCode();
}
let _syncTimer=null;
function syncSoon(){ clearTimeout(_syncTimer); _syncTimer=setTimeout(syncPush, 1500); }

/* ── 只读统计上报（D1）───────────────────────────────
 * 只上报：闯关结果 + 每题对错/耗时/题型/目标词。
 * 不上报：IP、孩子输入的原始字符串、任何身份信息。
 * 没有配置 Worker 时静默跳过（本地 node 后端没有 /api/log）。
 */
let _answerBuf = [];
function statUrl(){
  const b = syncBase();
  return b ? b + '/api/log' : '';
}
async function logStat(body){
  const u = statUrl();
  if(!u) return null;
  try{
    const r = await fetch(u, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    return await r.json();
  }catch(e){ return null; }
}
function statWord(c){
  if(!c) return '';
  return String(c.word || c.correct || (c.reveal && c.reveal.word) || '').trim().toLowerCase();
}
function statAnswer(card, ok, ms){
  if(!statUrl()) return;
  _answerBuf.push({ type: card && card.card_type, word: statWord(card), correct: !!ok, ms: Number(ms)||0 });
}
function statFlush(score, correct, total){
  if(!statUrl()) return;
  const buf = _answerBuf; _answerBuf = [];
  (async () => {
    const r = await logStat({ code: famCode(), kind:'round',
      round:{ character: ch, level:'G2', score, correct, total, max_combo: mx } });
    const rid = (r && r.id) || 0;
    for(const a of buf){
      await logStat({ code: famCode(), kind:'answer',
        answer:{ round_id: rid, type:a.type, word:a.word, correct:a.correct, ms:a.ms } });
    }
  })();
}

/* 跨轮记忆：最近 3 轮的词，避免连续两轮刷到同样的题（与主游戏 owk_seen 同一思路） */
function pSeen(){try{return JSON.parse(localStorage.getItem('owk_seen_practice')||'[]')}catch(e){return []}}
function pPushSeen(word){
  const k=String(word||'').toLowerCase(); if(!k) return;
  const cur=pSeen(); if(cur[cur.length-1]===k) return;
  localStorage.setItem('owk_seen_practice',JSON.stringify(cur.concat([k]).slice(-24)));
  if(typeof syncSoon==='function') syncSoon();
}

async function fetchCard(type){
  // 把本轮已考过的词带给后端，避免同一个词换个题型又出现一次
  const _ex=roundWords.concat(pSeen()).filter((v,i,a)=>a.indexOf(v)===i);
  const q=(type?('&type='+type):'')+'&character='+ch
    +(_ex.length?('&exclude='+encodeURIComponent(_ex.join(','))):'');
  const r=await fetch(`${API}/practice/next?level=G2&player=${ch}${q}`);
  const d=await r.json();
  if(d.error){toast('⚠️ '+d.message,'bad');return null;}
  pPushSeen(d.word||d.correct||d.audio_text||'');
  return d;
}

syncInit();

function resetRound(){
  clearInterval(timerId);
  answered=false; i=0; sc=0; cb=0; mx=0; xp=0; ls=[]; roundWords=[]; card=null; playing=false;
  const go=document.getElementById('goBtn'); if(go) go.style.display='inline-block';
  const rst=document.getElementById('rstBtn'); if(rst) rst.style.display='none';
  const area=document.getElementById('chArea');
  if(area) area.innerHTML='<div style="color:#5D4037;font-size:0.48em;text-align:center;padding:26px 10px 10px;">选择你的角色<br>开始特训吧！</div><div id="maskHost" style="padding:0 14px 0;">'+masksStrip()+'</div><div id="syncHost" style="padding:0 14px 18px;">'+syncStrip()+'</div>';
  hud(); dn();
}

function start(){
  track('round_start',{count:N,level:'G2',character:ch});
  roundWords=[]; playing=true;
  clearInterval(timerId);
  // 每轮固定覆盖 4 种题型各 2 次（打乱顺序），避免随机抽样漏掉某一类
  plan=['syllable','punctuation','phonics','sight','syllable','phoneme','phonics','sight']
    .sort(()=>Math.random()-0.5);
  i=0;sc=0;cb=0;mx=0;xp=0;ls=[];round=[];answered=false;
  document.getElementById('goBtn').style.display='none';
  document.getElementById('rstBtn').style.display='inline-block';
  dn();mc_();hud();nextCard();
}

async function nextCard(){
  clearInterval(timerId);
  if(i>=N){finish();return;}
  answered=false;
  dn();mc_();hud();
  card=await fetchCard(plan[i]);
  if(!card){renderError();return;}
  { const w=String(card.word||card.correct||card.audio_text||'').trim().toLowerCase();
    if(w && roundWords.indexOf(w)<0) roundWords.push(w); }
  t0=Date.now();
  tl=TS; flashUsed=0;
  renderCard();
  startTimer();
}

/* ── 渲染各类题卡 ── */
function typeBadge(t){
  const m={SYLLABLE_COUNTING:['syllable','🔢 音节计数'],
           PHONEME_DISCRIMINATION:['phoneme','👂 音素辨析'],
           PHONICS_CONTEXT_MATCH:['phonics','🔤 拼读规则'],
           SIGHT_WORD_FLASH:['sight','⚡ 视觉词闪现'],
           PUNCTUATION_MARK:['punct','✏️ 标点填空']};
  const [cls,label]=m[t]||['syllable','练习'];
  return `<span class="type-badge ${cls}">${label}</span>`;
}

function renderCard(){
  const t=card.card_type;
  let body='';

  if(t==='SYLLABLE_COUNTING'){
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <div class="ch-word">${card.word}</div>
      <button class="mc-btn blue speak-btn" onclick="speak('${card.word}')">🔊 听发音</button>
      <div class="opts" id="opts">
        ${card.options.map(o=>`<button class="opt" onclick="pick(${o},this)">${o}</button>`).join('')}
      </div>`;
  }
  else if(t==='PHONEME_DISCRIMINATION'){
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <button class="mc-btn blue speak-btn" onclick="speak('${card.audio_text}',0.75)">🔊 再听一次</button>
      <div class="opts" id="opts">
        ${card.options.map(o=>`<button class="opt wide" onclick="pick('${o}',this)">${o}</button>`).join('')}
      </div>`;
  }
  else if(t==='PHONICS_CONTEXT_MATCH'){
    const s=String(card.sentence).replace(/_____/g,'<span class="blank">_____</span>');
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <div class="ch-sentence">${s}</div>
      ${card.hint?`<div class="ch-hint">💡 要填的词是：<b>${card.hint}</b></div>`:''}
      <div class="opts" id="opts">
        ${card.options.map(o=>`<button class="opt wide" onclick="pick('${o}',this)">${o}</button>`).join('')}
      </div>`;
  }
  else if(t==='PUNCTUATION_MARK'){
    const esc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const s2=String(card.sentence).replace(/_____/g,'<span class="blank">_____</span>');
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <div class="ch-sentence">${s2}</div>
      <div class="opts mark-opts" id="opts">
        ${card.options.map(o=>`<button class="opt mark" data-v="${esc(o)}" onclick="pickMark(this)">${esc(o)}</button>`).join('')}
      </div>`;
  }
  else { // SIGHT_WORD_FLASH
    body=`${typeBadge(t)}
      <div class="ch-prompt">${card.prompt}</div>
      <div class="flash-word" id="flashW">${card.word}</div>
      <button class="mc-btn blue" id="flashAgain" onclick="flashAgain()" style="display:none;">🔁 再看一次（不扣时间）</button>
      <div class="opts" id="opts" style="visibility:hidden;">
        ${card.options.map(o=>`<button class="opt wide" onclick="pick('${o}',this)">${o}</button>`).join('')}
      </div>`;
  }

  const speakerHtml = card.speaker
    ? `<div class="speaker"><span class="sp-face">${card.speaker.emoji}</span><span>${card.speaker.label}${card.speaker_is_own_line===false?' · 旁白':''}</span></div>`
    : '';
  document.getElementById('chArea').innerHTML=`
    <div class="ch-card">
      ${speakerHtml}
      ${body}
      <div class="timer-wrap" style="margin-top:14px;"><div class="timer-bar" id="tbar" style="width:100%"></div></div>
    </div>`;

  if(t==='PHONEME_DISCRIMINATION') setTimeout(()=>speak(card.audio_text,0.75),320);
  if(t==='SIGHT_WORD_FLASH'){
    setTimeout(hideFlash, card.flash_ms||800);
  }
}

let tl=TS;   // 剩余秒数：放在模块级，回放视觉词时才能暂停/续跑

function paintTimer(){
  const b=document.getElementById('tbar'); if(!b) return;
  b.style.width=(Math.max(tl,0)/TS*100)+'%';
  b.style.background=tl<10?'#EF5350':(tl<20?'#FFA726':'#66BB6A');
}

/* ── 视觉词闪现：一次没看清可以回放同样时长再作答 ── */
let flashUsed=0;

function hideFlash(){
  const w=document.getElementById('flashW');
  if(w){ w.className='flash-hidden'; w.textContent='? ? ?'; }
  const o=document.getElementById('opts'); if(o) o.style.visibility='visible';
  const b=document.getElementById('flashAgain'); if(b && !answered) b.style.display='inline-block';
  resumeTimer();
}

function flashAgain(){
  if(answered) return;
  track('flash_replay',{word:card.word});
  const w=document.getElementById('flashW'); if(!w) return;
  flashUsed++;
  const b=document.getElementById('flashAgain'); if(b) b.style.display='none';
  const o=document.getElementById('opts'); if(o) o.style.visibility='hidden';
  pauseTimer();                         // 回放期间停表，避免"还没看清就超时"
  w.className='flash-word'; w.textContent=card.word;
  setTimeout(hideFlash, card.flash_ms||800);
}

function startTimer(){
  clearInterval(timerId);
  paintTimer();
  timerId=setInterval(()=>{
    tl--;
    if(!document.getElementById('tbar')){clearInterval(timerId);return;}
    paintTimer();
    if(tl<=0){clearInterval(timerId); if(!answered) pick(null,null,true);}
  },1000);
}

let timerPaused=false;
function pauseTimer(){ clearInterval(timerId); timerPaused=true; }
// 只有真的暂停过才续跑：首次闪现结束时表本来在跑，不能重启（会攒出额外的一拍）
function resumeTimer(){ if(timerPaused && !answered){ timerPaused=false; startTimer(); } }

/* ── 答题 ── */
function pickMark(btn){ pick(btn.dataset.v, btn); }

async function pick(val,btn,timeout=false){
  if(answered) return;
  answered=true;
  clearInterval(timerId);
  const ms=Date.now()-t0;

  const res=await fetch(`${API}/practice/answer`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({player:ch,card,response:val,response_ms:ms})
  }).then(r=>r.json()).catch(()=>({error:'network'}));

  if(res.error){toast('⚠️ 网络错误','bad');answered=false;return;}

  // 标记选项
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled=true;
    if(String(o.textContent)===String(res.correct_answer)) o.classList.add('correct');
  });
  if(btn && !res.is_correct) btn.classList.add('wrong');

  const okk=res.is_correct;
  if(typeof statAnswer==='function') statAnswer(card, okk, ms);
  track(okk?'answer_ok':'answer_wrong',{type:card.card_type,target:(card.word||card.correct||card.audio_text||''),response:(val==null?'(timeout)':String(val)),ms,timeout});
  if(okk){
    cb++; mx=Math.max(mx,cb);
    let p=10;
    if(cb>=5){p=30;cbB();toast('⭐ '+cb+' 连击！','great');}
    else if(cb>=3){p=20;cbB();}
    else okB();
    const bonus=ms<2000?1.4:1;
    sc+=Math.round(p*bonus); xp=Math.min(100,xp+p);
    const r=btn?btn.getBoundingClientRect():{left:400,top:300,width:0};
    pt(r.left+r.width/2,r.top);
  }else{
    cb=0; noB(); toast(timeout?'⏰ 时间到':'💡 再想想','bad');
  }
  round.push({ok:okk});
  ls.push({ok:okk,type:card.card_type});
  hud();

  renderFeedback(res,okk,timeout);
}

function renderFeedback(res,okk,timeout){
  const f=res.feedback||{};
  const rv=res.reveal||{};
  let extra='';
  if(card.card_type==='SYLLABLE_COUNTING' && rv.display){
    extra=`<div class="reveal">切分：<span class="syl">${rv.display}</span><br>${rv.tip||''}</div>`;
  } else if(card.card_type==='PHONEME_DISCRIMINATION' && rv.pair){
    extra=`<div class="reveal">
      <span class="ph">${rv.pair[0]}</span> ${rv.phonemes[0]} = ${rv.meanings[0]}　·　<span class="ph">${rv.pair[1]}</span> ${rv.phonemes[1]} = ${rv.meanings[1]}<br>${rv.tip||''}
      <br><button class="mc-btn blue" style="font-size:.9em;padding:8px 14px;margin-top:8px;" onclick="speakPair('${rv.pair[0]}','${rv.pair[1]}')">🔊 对比听</button>
    </div>`;
  } else if(card.card_type==='PHONICS_CONTEXT_MATCH' && rv.grapheme){
    extra=`<div class="reveal">字母组合 <span class="ph">${rv.grapheme}</span> → ${rv.phoneme}<br>${rv.articulation||''}<br>同家族：${(rv.family||[]).join('、')}</div>`;
  } else if(card.card_type==='PUNCTUATION_MARK' && rv.mark){
    extra=`<div class="reveal">完整句子：<span class="ph">${rv.full}</span><br>${rv.tip||''}</div>`;
  } else if(card.card_type==='SIGHT_WORD_FLASH' && rv.word){
    extra=`<div class="reveal"><span class="ph">${rv.word}</span> = ${rv.zh}<br>${rv.tip||''}</div>`;
  }

  const box=document.createElement('div');
  box.className='fb'+(okk?'':' bad');
  box.innerHTML=`
    <div class="fb-head">${okk?'✅ 答对了':'💡 再想想'}</div>
    <div class="fb-msg">${f.message||''}</div>
    ${f.hint?`<div class="fb-hint">${f.hint}</div>`:''}
    ${extra}
    <div class="fb-actions"><button class="mc-btn" onclick="adv()">继续 ▶</button></div>`;
  document.querySelector('.ch-card').appendChild(box);
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function speakPair(a,b){
  speak(a,0.7);
  setTimeout(()=>speak(b,0.7),1100);
}

function adv(){
  i++;
  if(i>=N){finish();return;}
  dn();mc_();hud();
  setTimeout(nextCard,180);
}

/* ── 结算 ── */
async function finish(){
  playing=false;
  track('round_finish',{score:sc,correct:ls.filter(x=>x.ok).length,total:N,character:ch});
  clearInterval(timerId);
  const ok=ls.filter(x=>x.ok).length;
  if(typeof statFlush==='function') statFlush(sc, ok, N);
  const stars=ok===N?'⭐⭐⭐':(ok>=Math.ceil(N*.7)?'⭐⭐':'⭐');
  const prof=await fetch(`${API}/practice/profile?player=${ch}`).then(r=>r.json()).catch(()=>null);
  const rec=await fetch(`${API}/practice/recommend?level=G2&player=${ch}`).then(r=>r.json()).catch(()=>null);

  let weakHtml='<div class="muted">本轮没有明显薄弱点 👏</div>';
  if(prof && prof.weak_phonemes.length){
    weakHtml=prof.weak_phonemes.slice(0,6).map(w=>{
      const hot=w.ew>=2?'hot':'warm';
      return `<span class="chip ${hot}">${w.grapheme||w.phoneme} ${w.phoneme} ×${w.ew}</span>`;
    }).join('');
  }
  let recHtml='<div class="muted">继续练习就会有推荐</div>';
  if(rec && rec.words.length){
    recHtml=`<div class="muted" style="margin-bottom:6px;">${rec.reason}</div>`+
      rec.words.slice(0,6).map(w=>`<div class="rec-item"><b>${w.word}</b> ${w.hint||''}　<span style="opacity:.7">${w.grapheme}</span></div>`).join('');
  }

  // 达标（≥70% 正确）才发面具
  const passed = ok >= Math.ceil(N * 0.7);
  const got = passed ? awardMask() : null;
  const maskHtml = got
    ? `<div class="mask-award"><span class="ma-emoji">${got.emoji}</span><div style="text-align:left;"><div class="ma-title">解锁新面具</div><div class="ma-name">${got.name}</div><div class="ma-who">来自 ${got.who}</div></div></div>`
    : (passed && ballUnlocked() ? `<div class="mask-done">🎭 面具已集齐，回起始页进入假面舞会</div>` : '');

  document.getElementById('chArea').innerHTML=`
    <div class="ch-card" style="text-align:center;">
      <div style="font-size:2.6em;margin:6px 0;">🎧</div>
      <div style="font-size:.62em;color:#3E2723;margin-bottom:8px;">特训完成！</div>
      <div style="font-size:.8em;margin:8px 0;">${stars}</div>
      ${maskHtml}
      <div style="font-size:.44em;color:#5D4037;line-height:2;">
        🏆 ${sc} 分　🔥 最高 ${mx} 连击　✅ ${ok}/${N}
      </div>
      <div class="profile-grid" style="margin-top:14px;text-align:left;">
        <div class="prof-box"><h3>🔥 薄弱音素</h3>${weakHtml}</div>
        <div class="prof-box"><h3>📚 下一步推荐</h3>${recHtml}</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="mc-btn" onclick="start()">🔄 再来一轮</button>
        <button class="mc-btn blue" onclick="showProfile()">📈 学情画像</button>
      </div>
    </div>`;

  // 记录本轮
  fetch(`${API}/log`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({character:NM[ch],level:'G2',score:sc,maxCombo:mx,
      wordsTotal:N,wordsCorrect:ok,wordsTimeout:0,wordsWrong:N-ok,
      details:ls})}).catch(()=>{});

  document.getElementById('goBtn').style.display='inline-block';
  document.getElementById('rstBtn').style.display='none';
}

/* ── 学情面板 ── */
async function showProfile(){
  const p=document.getElementById('profPanel');
  p.style.display='block';
  const prof=await fetch(`${API}/practice/profile?player=${ch}`).then(r=>r.json()).catch(()=>null);
  const rec=await fetch(`${API}/practice/recommend?level=G2&player=${ch}`).then(r=>r.json()).catch(()=>null);
  if(!prof){document.getElementById('weakPh').innerHTML='<div class="muted">加载失败</div>';return;}

  document.getElementById('weakPh').innerHTML = prof.weak_phonemes.length
    ? prof.weak_phonemes.map(w=>`<span class="chip ${w.ew>=2?'hot':'warm'}">${w.grapheme||w.phoneme} ${w.phoneme} ×${w.ew}</span>`).join('')
      + `<div class="muted" style="margin-top:8px;">共 ${prof.total} 题 · 正确率 ${prof.accuracy}%</div>`
    : `<div class="muted">还没有答题记录<br>先做一轮特训吧</div>`;

  document.getElementById('recBox').innerHTML = rec && rec.words.length
    ? `<div class="muted" style="margin-bottom:6px;">${rec.reason}</div>`+
      rec.words.slice(0,6).map(w=>`<div class="rec-item"><b>${w.word}</b> ${w.hint||''}</div>`).join('')
    : '<div class="muted">继续练习就会有推荐</div>';
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderError(){
  document.getElementById('chArea').innerHTML=`
    <div class="ch-card"><div style="font-size:.5em;color:#C62828;text-align:center;line-height:2;padding:16px;">
      ⚠️ 字库为空或服务不可用<br><span style="font-size:.8em;color:#8D6E63;">请先在主页面导入 CSV 字库</span>
    </div></div>`;
}

dn();mc_();hud();
/* 起始屏由 resetRound() 生成（含面具收藏条 + 家庭码），
   否则页面里写成死 HTML 的那段会盖住它们。 */
resetRound();
if('speechSynthesis' in window) speechSynthesis.getVoices();
window.addEventListener('resize',()=>{dn();mc_()});
</script>
