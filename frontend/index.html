<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⛏️ 牛津树单词冒险 | Minecraft</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    :root {
      --dirt: #8B5E3C;
      --grass-top: #5D8C2E;
      --grass-side: #7C9C3A;
      --stone: #7F7F7F;
      --sky: #87CEEB;
      --sky-bottom: #C8E6F5;
      --wood: #8B6914;
      --gold: #F9A825;
      --diamond: #64B5F6;
      --redstone: #E53935;
      --emerald: #43A047;
      --text-dark: #3E2723;
      --text-light: #FFF8E1;
      --panel-bg: #C4A46C;
      --panel-border: #6D4C2E;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', -apple-system, sans-serif;
      background: linear-gradient(180deg, #87CEEB 0%, #B3E5FC 60%, #8B5E3C 60%, #6D4C2E 100%);
      min-height: 100vh;
      overflow-x: hidden;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Clouds ── */
    .clouds {
      position: fixed; top: 0; left: 0; width: 100%; height: 200px;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .cloud {
      position: absolute;
      background: #fff;
      border: 3px solid #e0e0e0;
      box-shadow: 4px 4px 0 #ddd;
      image-rendering: pixelated;
    }
    .cloud:nth-child(1) { width: 120px; height: 40px; top: 40px; left: 10%; animation: cloudDrift 25s linear infinite; }
    .cloud:nth-child(2) { width: 100px; height: 35px; top: 70px; left: 45%; animation: cloudDrift 30s linear infinite; animation-delay: -10s; }
    .cloud:nth-child(3) { width: 80px; height: 30px; top: 30px; left: 75%; animation: cloudDrift 22s linear infinite; animation-delay: -5s; }
    .cloud:nth-child(4) { width: 140px; height: 45px; top: 90px; left: 20%; animation: cloudDrift 28s linear infinite; animation-delay: -15s; }

    @keyframes cloudDrift {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(calc(100vw + 200px)); }
    }

    /* ── App Container ── */
    .app {
      position: relative; z-index: 1;
      max-width: 960px; margin: 0 auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      min-height: 100vh;
    }

    /* ── Minecraft Panel ── */
    .mc-panel {
      background: var(--panel-bg);
      border: 5px solid var(--panel-border);
      box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2), inset 3px 3px 0 rgba(255,255,255,0.15),
                  0 6px 0 #4A3020, 0 8px 20px rgba(0,0,0,0.4);
      padding: 16px;
      position: relative;
    }
    .mc-panel::before {
      content: '';
      position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px;
      border: 3px solid var(--panel-border);
      pointer-events: none;
      z-index: -1;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }
    .header h1 {
      color: #FFE0B2;
      text-shadow: 3px 3px 0 #5D4037, -1px -1px 0 #5D4037;
      font-size: 1.2em;
      display: flex; align-items: center; gap: 8px;
      letter-spacing: 2px;
    }
    .header h1 .pick { font-size: 1.3em; animation: pickBounce 1s ease infinite; }
    @keyframes pickBounce {
      0%,100% { transform: translateY(0) rotate(-10deg); }
      50% { transform: translateY(-4px) rotate(5deg); }
    }

    .level-btns { display: flex; gap: 0; border: 3px solid #4A3020; border-radius: 4px; overflow: hidden; }
    .lv-btn {
      padding: 10px 20px; border: none; font-family: inherit; font-size: 0.65em;
      cursor: pointer; transition: all 0.2s; font-weight: bold;
      background: #8D6E63; color: #FFE0B2;
    }
    .lv-btn.g1 { background: #5D8C2E; }
    .lv-btn.g2 { background: #1565C0; }
    .lv-btn.active { filter: brightness(1.3); box-shadow: inset 0 0 0 3px #FFD54F; }
    .lv-btn:hover { filter: brightness(1.15); }

    /* ── Character Select ── */
    .char-select {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .char-select label {
      color: #3E2723; font-size: 0.55em; white-space: nowrap;
    }
    .char-card {
      width: 60px; height: 80px;
      background: #E0C9A6; border: 3px solid #8D6E63;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      position: relative; transition: all 0.2s;
      box-shadow: 0 3px 0 #6D4C2E;
    }
    .char-card:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #6D4C2E; }
    .char-card.selected { border-color: #FFD54F; box-shadow: 0 0 0 3px rgba(255,213,79,0.4), 0 3px 0 #6D4C2E; }
    .char-card .face { font-size: 1.8em; }
    .char-card .name { font-size: 0.4em; color: #3E2723; }

    /* ── Stats Bar ── */
    .stats-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .stat-item {
      flex: 1; min-width: 80px; background: #5D4037;
      border: 3px solid #3E2723; padding: 8px 10px;
      color: #FFE0B2; text-align: center;
      box-shadow: 0 3px 0 #3E2723;
    }
    .stat-item .val { font-size: 1em; margin-top: 4px; color: #FFD54F; }
    .stat-item .lbl { font-size: 0.4em; opacity: 0.7; }

    /* ── XP Bar ── */
    .xp-wrap {
      width: 100%; height: 20px;
      background: #3E2723; border: 3px solid #4A3020;
      position: relative;
    }
    .xp-fill {
      height: 100%; background: linear-gradient(90deg, #66BB6A, #AED581);
      transition: width 0.5s ease;
      position: relative;
    }
    .xp-fill::after {
      content: ''; position: absolute; right: -4px; top: 0; bottom: 0;
      width: 8px; background: #FFD54F;
    }
    .xp-text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 0.45em; color: #FFE0B2; text-shadow: 1px 1px 0 #000;
      white-space: nowrap;
    }

    /* ── Path View ── */
    .path-wrapper {
      position: relative; height: 180px; overflow: hidden;
      background: linear-gradient(180deg, #87CEEB 0%, #B3E5FC 50%, #7C9C3A 50%, #8B5E3C 100%);
      border: 4px solid #4A3020;
      box-shadow: inset 0 4px 0 rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    /* ground blocks */
    .ground-blocks {
      position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
      display: flex; flex-wrap: nowrap;
    }
    .ground-blocks::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 12px;
      background: var(--grass-top);
    }
    .ground-block {
      width: 48px; height: 80px; background: var(--dirt);
      border: 1px solid #7A4E2D;
      position: relative; flex-shrink: 0;
    }
    .ground-block::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 12px;
      background: var(--grass-top);
    }

    /* path nodes */
    .path-nodes {
      position: absolute; bottom: 90px; left: 60px; right: 60px;
      display: flex; align-items: center; gap: 0;
      height: 50px;
    }
    .path-node {
      display: flex; flex-direction: column; align-items: center;
      position: relative; z-index: 2;
    }
    .path-line {
      height: 6px; background: #8D6E63;
      flex: 1; margin: 0 -2px;
      border-top: 2px solid #A1887F;
    }
    .node-block {
      width: 40px; height: 40px;
      border: 3px solid #4A3020;
      position: relative; cursor: default;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2em;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .node-block.pending { background: #BDBDBD; }
    .node-block.active { 
      background: #FFD54F; animation: nodeGlow 0.8s ease infinite alternate;
      border-color: #F9A825; transform: scale(1.15);
    }
    .node-block.done { background: #66BB6A; border-color: #388E3C; }
    .node-block.wrong { background: #EF5350; border-color: #C62828; }
    @keyframes nodeGlow {
      0% { box-shadow: 0 0 8px rgba(255,213,79,0.6); }
      100% { box-shadow: 0 0 20px rgba(255,213,79,0.9); }
    }

    /* ── Character Sprite ── */
    .char-sprite {
      position: absolute; bottom: 40px;
      font-size: 2.8em;
      transition: left 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10; filter: drop-shadow(2px 4px 0 rgba(0,0,0,0.3));
      pointer-events: none;
    }
    .char-sprite.jumping {
      animation: charJump 0.5s ease;
    }
    @keyframes charJump {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-30px) rotate(-5deg); }
    }

    /* ── Challenge Card ── */
    .challenge-area {
      min-height: 200px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .challenge-card {
      background: #FFF8E1; border: 5px solid #8D6E63;
      box-shadow: 0 6px 0 #5D4037, 0 8px 20px rgba(0,0,0,0.3);
      padding: 24px; width: 100%; max-width: 700px;
      position: relative;
      animation: cardIn 0.5s ease;
    }
    @keyframes cardIn {
      0% { transform: translateY(20px) scale(0.95); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .challenge-card .ch-hint {
      font-size: 0.55em; color: #8D6E63; margin-bottom: 12px;
      font-family: 'Press Start 2P', sans-serif;
    }
    .challenge-card .ch-sentence {
      font-size: 1.3em; color: #3E2723; margin-bottom: 24px;
      line-height: 1.6; text-align: center;
      font-family: -apple-system, 'PingFang SC', sans-serif;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .challenge-card .ch-blank {
      display: inline-block; min-width: 80px;
      border-bottom: 4px solid #F9A825;
      padding: 4px 12px; margin: 0 6px;
      color: #E65100; font-weight: 800;
      font-family: 'Press Start 2P', sans-serif;
      font-size: 0.8em;
      text-align: center;
      transition: all 0.3s;
    }
    .challenge-card .ch-blank.filled {
      background: #FFF8E1; border-color: #66BB6A;
    }

    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .opt-btn {
      padding: 14px 20px; font-size: 0.8em;
      font-family: 'Press Start 2P', sans-serif;
      background: #EEEEEE; border: 4px solid #BDBDBD;
      cursor: pointer; color: #3E2723;
      box-shadow: 0 4px 0 #9E9E9E;
      transition: all 0.15s; text-align: center;
      position: relative;
    }
    .opt-btn:hover { background: #E0E0E0; transform: translateY(-2px); box-shadow: 0 6px 0 #9E9E9E; }
    .opt-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9E9E9E; }
    .opt-btn.correct {
      background: #66BB6A; border-color: #388E3C; color: #fff;
      box-shadow: 0 4px 0 #2E7D32; animation: correctPop 0.5s ease;
    }
    .opt-btn.wrong {
      background: #EF5350; border-color: #C62828; color: #fff;
      box-shadow: 0 4px 0 #B71C1C; animation: wrongShake 0.4s ease;
    }
    .opt-btn.wrong::after {
      content: '✕'; position: absolute; right: 8px; top: 50%;
      transform: translateY(-50%); font-size: 1.2em;
    }
    @keyframes correctPop {
      0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); }
    }
    @keyframes wrongShake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(4px); }
    }

    /* ── Feedback Toast ── */
    .feedback {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border-radius: 4px;
      font-family: 'Press Start 2P', sans-serif; font-size: 0.6em;
      z-index: 100; pointer-events: none;
      border: 4px solid; box-shadow: 0 6px 0 rgba(0,0,0,0.3);
      animation: toastIn 0.4s ease, toastOut 0.4s ease 1.6s forwards;
      opacity: 0;
    }
    .feedback.show { opacity: 1; }
    .feedback.good { background: #C8E6C9; border-color: #388E3C; color: #2E7D32; }
    .feedback.bad { background: #FFCDD2; border-color: #C62828; color: #B71C1C; }
    .feedback.great { background: #FFF9C4; border-color: #F9A825; color: #F57F17; }
    @keyframes toastIn { 0% { opacity: 0; transform: translateX(-50%) translateY(-20px); } 100% { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

    /* ── Victory Screen ── */
    .victory-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    .victory-card {
      background: var(--panel-bg); border: 6px solid var(--panel-border);
      box-shadow: 0 8px 0 #4A3020, 0 10px 40px rgba(0,0,0,0.5);
      padding: 32px; text-align: center; max-width: 400px; width: 90%;
    }
    .victory-card h2 { color: #FFD54F; font-size: 1em; text-shadow: 3px 3px 0 #5D4037; margin-bottom: 16px; }
    .victory-card .stars { font-size: 2.5em; margin: 16px 0; }
    .victory-card p { color: #3E2723; font-size: 0.55em; line-height: 1.8; }
    .mc-btn {
      padding: 14px 32px; font-family: inherit; font-size: 0.6em;
      background: #5D8C2E; color: #FFE0B2; border: 4px solid #33691E;
      box-shadow: 0 5px 0 #33691E; cursor: pointer;
      transition: all 0.15s; margin-top: 16px;
    }
    .mc-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #33691E; }
    .mc-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #33691E; }
    .mc-btn.blue { background: #1565C0; border-color: #0D47A1; box-shadow: 0 5px 0 #0D47A1; }

    /* ── Particles ── */
    .particle-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 60;
    }
    .particle {
      position: absolute; font-size: 1.2em;
      animation: particleUp 1s ease forwards;
    }
    @keyframes particleUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(0.3); }
    }

    /* ── Import Section ── */
    .import-section {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .import-section h3 { font-size: 0.5em; margin: 0; white-space: nowrap; }
    .import-section input[type="file"] { padding: 6px; border: 3px dashed #8D6E63; cursor: pointer; font-family: inherit; font-size: 0.45em; }
    .import-msg { font-size: 0.45em; font-weight: 600; }
    .import-msg.ok { color: #2E7D32; }
    .import-msg.err { color: #C62828; }
    .word-stats { font-size: 0.4em; color: #5D4037; margin-left: auto; }

    /* ── Grass Bottom ── */
    .grass-rows {
      position: fixed; bottom: 0; left: 0; right: 0; height: 20px;
      background: repeating-linear-gradient(
        90deg,
        var(--grass-top) 0px, var(--grass-top) 4px,
        #4A7A1E 4px, #4A7A1E 8px
      );
      z-index: 0; border-top: 3px solid #3E6A12;
    }

    @media (max-width: 640px) {
      .header h1 { font-size: 0.8em; }
      .challenge-card .ch-sentence { font-size: 1em; }
      .options-grid { grid-template-columns: 1fr; }
      .opt-btn { font-size: 0.65em; padding: 12px 14px; }
      .char-sprite { font-size: 2em; }
      .path-wrapper { height: 140px; }
    }
  </style>
</head>
<body>

<div class="clouds">
  <div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div>
</div>
<div class="grass-rows"></div>
<div class="particle-container" id="particles"></div>

<div class="app">
  <!-- Header -->
  <div class="mc-panel header">
    <h1><span class="pick">⛏️</span>牛津树单词冒险</h1>
    <div class="level-btns">
      <button class="lv-btn g1 active" id="tabG1" onclick="setLevel('G1')">🌱 G1 初级</button>
      <button class="lv-btn g2" id="tabG2" onclick="setLevel('G2')">🌳 G2 进阶</button>
    </div>
  </div>

  <!-- Character Select -->
  <div class="mc-panel char-select">
    <label>选择角色:</label>
    <div class="char-card selected" onclick="selectChar('biff')" id="charBiff">
      <div class="face">👧🏻‍</div><div class="name">Biff</div>
    </div>
    <div class="char-card" onclick="selectChar('chip')" id="charChip">
      <div class="face">🧒🏻</div><div class="name">Chip</div>
    </div>
    <div class="char-card" onclick="selectChar('kipper')" id="charKipper">
      <div class="face">👦🏻</div><div class="name">Kipper</div>
    </div>
    <div class="char-card" onclick="selectChar('wilma')" id="charWilma">
      <div class="face">👧🏽</div><div class="name">Wilma</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item"><div class="lbl">🏆 得分</div><div class="val" id="totalScore">0</div></div>
    <div class="stat-item"><div class="lbl">🔥 连击</div><div class="val" id="comboVal">0</div></div>
    <div class="stat-item"><div class="lbl">📊 进度</div><div class="val" id="progressVal">0/8</div></div>
    <div class="stat-item"><div class="lbl">⭐ 最高分</div><div class="val" id="bestVal">—</div></div>
  </div>

  <!-- XP Bar -->
  <div class="xp-wrap">
    <div class="xp-fill" id="xpFill" style="width: 0%"></div>
    <div class="xp-text" id="xpText">XP 0/100</div>
  </div>

  <!-- Path View -->
  <div class="mc-panel" style="padding: 0; overflow: hidden;">
    <div class="path-wrapper" id="pathView">
      <div class="ground-blocks" id="groundBlocks"></div>
      <div class="path-nodes" id="pathNodes"></div>
      <div class="char-sprite" id="charSprite" style="left: 10px;">👧🏻‍</div>
    </div>
  </div>

  <!-- Challenge Area -->
  <div class="mc-panel challenge-area" id="challengeArea">
    <div style="color: #5D4037; font-size: 0.55em; text-align: center; padding: 40px;">
      👆 选择一个角色和级别，然后开始冒险！
    </div>
  </div>

  <!-- Controls -->
  <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
    <button class="mc-btn" id="startBtn" onclick="startAdventure()">⚔️ 开始冒险</button>
    <button class="mc-btn blue" id="restartBtn" onclick="restartGame()" style="display:none;">🔄 重新开始</button>
  </div>

  <!-- Import -->
  <div class="mc-panel import-section">
    <h3>📥 上传字库 (CSV)</h3>
    <input type="file" id="csvFile" accept=".csv">
    <span class="import-msg" id="importMsg"></span>
    <span class="word-stats" id="wordStats"></span>
  </div>
</div>

<!-- Toast -->
<div class="feedback" id="toast"></div>

<script>
// ═══════════════════════════════════════
//  Minecraft × Oxford Tree Word Adventure
// ═══════════════════════════════════════

const API = window.location.hostname === 'localhost'
  ? 'http://localhost:3000'
  : window.location.origin;

// ── State ──
let oxfordLevel = 'G1';
let selectedChar = 'biff';
let challenges = [];
let currentIndex = 0;
let score = 0;
let comboCount = 0;
let maxCombo = 0;
let xp = 0;
let streakCorrect = 0;
let answeredThisRound = false;
let bestScores = {};
let soundEnabled = true;

const CHAR_FACES = {
  biff: '👧🏻‍', chip: '🧒🏻', kipper: '👦🏻', wilma: '👧🏽'
};
const CHAR_NAMES = {
  biff: 'Biff', chip: 'Chip', kipper: 'Kipper', wilma: 'Wilma'
};

// ── Audio context for simple beeps ──
let audioCtx = null;
function beep(freq, duration, type = 'square') {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.value = 0.08; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function beepCorrect() { beep(523, 0.1); setTimeout(() => beep(659, 0.1), 100); setTimeout(() => beep(784, 0.15), 200); }
function beepWrong() { beep(200, 0.3, 'sawtooth'); }
function beepCombo() { beep(784, 0.08); setTimeout(() => beep(988, 0.08), 80); setTimeout(() => beep(1175, 0.12), 160); }
function beepVictory() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2), i * 150));
}

// ── Toast ──
function showToast(msg, cls = 'good') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'feedback ' + cls;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ── Particles ──
function spawnParticles(x, y, emoji, count = 8) {
  const container = document.getElementById('particles');
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emoji;
    p.style.left = (x + (Math.random() - 0.5) * 120) + 'px';
    p.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
    p.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }
}

// ── Select Character ──
function selectChar(name) {
  selectedChar = name;
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('char' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('selected');
  document.getElementById('charSprite').textContent = CHAR_FACES[name];
}

// ── Select Level ──
function setLevel(level) {
  oxfordLevel = level;
  document.getElementById('tabG1').classList.toggle('active', level === 'G1');
  document.getElementById('tabG2').classList.toggle('active', level === 'G2');
  restartGame();
}

// ── Draw Ground Blocks ──
function drawGround() {
  const container = document.getElementById('groundBlocks');
  const count = Math.ceil(window.innerWidth / 48) + 4;
  let html = '';
  for (let i = 0; i < count; i++) { html += '<div class="ground-block"></div>'; }
  container.innerHTML = html;
}

// ── Draw Path Nodes ──
const NODE_COUNT = 8;

function drawNodes() {
  const container = document.getElementById('pathNodes');
  let html = '';
  for (let i = 0; i < NODE_COUNT; i++) {
    const cls = i < currentIndex ? 'done' : (i === currentIndex ? 'active' : 'pending');
    const icon = i < currentIndex ? '✅' : (i === currentIndex ? '❓' : '⬜');
    html += `<div class="path-node"><div class="node-block ${cls}">${icon}</div></div>`;
    if (i < NODE_COUNT - 1) html += '<div class="path-line"></div>';
  }
  container.innerHTML = html;
}

// ── Move Character ──
function moveCharacter() {
  const sprite = document.getElementById('charSprite');
  const pathWidth = document.getElementById('pathNodes').offsetWidth;
  const step = pathWidth / (NODE_COUNT);
  const left = step * currentIndex + step / 2 - 16;
  sprite.style.left = left + 'px';
  sprite.textContent = CHAR_FACES[selectedChar];
}

function jumpCharacter() {
  const sprite = document.getElementById('charSprite');
  sprite.classList.add('jumping');
  setTimeout(() => sprite.classList.remove('jumping'), 500);
}

// ── Render Challenge ──
function renderChallenge() {
  const area = document.getElementById('challengeArea');
  if (currentIndex >= challenges.length) {
    showVictory();
    return;
  }

  const ch = challenges[currentIndex];
  const sentenceDisplay = ch.sentenceBlank.split('____');
  
  area.innerHTML = `
    <div class="challenge-card">
      <div class="ch-hint">💡 ${ch.hint}</div>
      <div class="ch-sentence">
        ${sentenceDisplay[0]}<span class="ch-blank" id="blankSlot">?</span>${sentenceDisplay[1] || ''}
      </div>
      <div class="options-grid" id="optionsGrid">
        ${ch.options.map((opt, i) => `
          <button class="opt-btn" onclick="answer('${opt.replace(/'/g, "\\'")}', ${i}, this)" data-word="${opt.replace(/"/g, '&quot;')}">
            ${opt}
          </button>
        `).join('')}
      </div>
    </div>
  `;
  
  answeredThisRound = false;
}

// ── Answer ──
function answer(word, idx, btn) {
  if (answeredThisRound) return;
  answeredThisRound = true;
  
  const ch = challenges[currentIndex];
  const correct = word.toLowerCase() === ch.word.toLowerCase();
  const blank = document.getElementById('blankSlot');
  const btnEl = btn;
  
  if (correct) {
    btnEl.classList.add('correct');
    blank.textContent = ch.word;
    blank.classList.add('filled');
    comboCount++;
    if (comboCount > maxCombo) maxCombo = comboCount;
    streakCorrect++;
    
    let points = 10;
    if (comboCount >= 10) { points = 50; beepCombo(); showToast('💎 ' + comboCount + '连击！传奇！', 'great'); }
    else if (comboCount >= 5) { points = 30; beepCombo(); showToast('⭐ ' + comboCount + '连击！', 'good'); }
    else if (comboCount >= 3) { points = 20; beepCombo(); } 
    else { beepCorrect(); }
    
    score += points;
    xp = Math.min(100, xp + points);
    
    // Particles
    const rect = blank.getBoundingClientRect();
    spawnParticles(rect.left + rect.width / 2, rect.top, '✨', 10);
    jumpCharacter();
    
    // Advance after delay
    setTimeout(() => {
      currentIndex++;
      drawNodes();
      moveCharacter();
      updateHUD();
      if (currentIndex < challenges.length) {
        setTimeout(renderChallenge, 400);
      } else {
        xp = 100;
        updateHUD();
        beepVictory();
        setTimeout(showVictory, 600);
      }
    }, 800);
    
  } else {
    btnEl.classList.add('wrong');
    comboCount = 0;
    streakCorrect = 0;
    beepWrong();
    showToast('❌ 再试试！', 'bad');
    
    // Allow retry after shake
    setTimeout(() => {
      btnEl.classList.remove('wrong');
      answeredThisRound = false;
    }, 600);
  }
  
  updateHUD();
}

// ── Update HUD ──
function updateHUD() {
  document.getElementById('totalScore').textContent = score;
  document.getElementById('comboVal').textContent = comboCount;
  document.getElementById('progressVal').textContent = currentIndex + '/' + challenges.length;
  document.getElementById('xpFill').style.width = xp + '%';
  document.getElementById('xpText').textContent = 'XP ' + xp + '/100';
  
  // Best score
  const best = bestScores[oxfordLevel] || 0;
  if (score > best) {
    bestScores[oxfordLevel] = score;
    localStorage.setItem('oxford_mc_best', JSON.stringify(bestScores));
  }
  document.getElementById('bestVal').textContent = (bestScores[oxfordLevel] || score);
}

// ── Victory ──
function showVictory() {
  const area = document.getElementById('challengeArea');
  const stars = maxCombo >= 8 ? '⭐⭐⭐' : (maxCombo >= 4 ? '⭐⭐' : '⭐');
  area.innerHTML = `
    <div style="text-align:center; padding: 30px;">
      <div style="font-size: 2em; margin-bottom: 8px;">${stars}</div>
      <h2 style="color:#FFD54F; font-size:0.8em;">冒险完成！</h2>
      <p style="color:#3E2723; font-size:0.55em;">
        🏆 总分: ${score}<br>
        🔥 最高连击: ${maxCombo}<br>
        👤 角色: ${CHAR_NAMES[selectedChar]}
      </p>
      <button class="mc-btn" onclick="restartGame()" style="margin-top:12px;">🔄 再来一次</button>
    </div>
  `;
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'inline-block';
}

// ── Fetch Challenges ──
async function loadChallenges() {
  try {
    const count = NODE_COUNT;
    const res = await fetch(`${API}/api/challenges?level=${oxfordLevel}&count=${count}`);
    const data = await res.json();
    if (data.error) {
      document.getElementById('challengeArea').innerHTML = `
        <div style="text-align:center; padding:30px; color:#C62828;">
          ⚠️ 字库为空，请先上传CSV文件
        </div>`;
      return false;
    }
    if (data.length < 4) {
      document.getElementById('challengeArea').innerHTML = `
        <div style="text-align:center; padding:30px; color:#E65100;">
          ⚠️ 字库不足（需要至少4个单词），请上传更多单词
        </div>`;
      return false;
    }
    challenges = data;
    return true;
  } catch (e) {
    document.getElementById('challengeArea').innerHTML = `
      <div style="text-align:center; padding:30px; color:#C62828;">
        ❌ 无法连接服务器
      </div>`;
    return false;
  }
}

// ── Start Adventure ──
async function startAdventure() {
  const loaded = await loadChallenges();
  if (!loaded) return;
  
  currentIndex = 0;
  score = 0;
  comboCount = 0;
  maxCombo = 0;
  xp = 0;
  streakCorrect = 0;
  
  drawNodes();
  moveCharacter();
  updateHUD();
  renderChallenge();
  
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'inline-block';
}

async function restartGame() {
  currentIndex = 0;
  score = 0;
  comboCount = 0;
  maxCombo = 0;
  xp = 0;
  streakCorrect = 0;
  challenges = [];
  
  document.getElementById('startBtn').style.display = 'inline-block';
  document.getElementById('restartBtn').style.display = 'none';
  document.getElementById('challengeArea').innerHTML = `
    <div style="color:#5D4037; font-size:0.55em; text-align:center; padding:40px;">
      👆 准备好了就点击"开始冒险"！
    </div>`;
  
  drawNodes();
  moveCharacter();
  updateHUD();
}

// ── Init ──
function init() {
  const saved = localStorage.getItem('oxford_mc_best');
  if (saved) bestScores = JSON.parse(saved);
  drawGround();
  drawNodes();
  moveCharacter();
  updateHUD();
  loadStats();
  
  window.addEventListener('resize', () => {
    drawGround();
    drawNodes();
    moveCharacter();
  });
}

// ── Stats ──
async function loadStats() {
  try {
    const res = await fetch(`${API}/api/stats`);
    const data = await res.json();
    if (data.length) {
      document.getElementById('wordStats').textContent =
        data.map(s => `${s.oxford_level}:${s.count}词`).join(' | ');
    }
  } catch(e) {}
}

// ── CSV Import ──
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('csvFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const msg = document.getElementById('importMsg');
    msg.textContent = '⏳ 导入中...';
    msg.className = 'import-msg';
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const res = await fetch(`${API}/api/import`, { method: 'POST', body: reader.result });
        const d = await res.json();
        if (d.success) {
          msg.textContent = '✅ ' + d.message;
          msg.className = 'import-msg ok';
          loadStats();
        } else {
          msg.textContent = '❌ ' + d.error;
          msg.className = 'import-msg err';
        }
      } catch {
        msg.textContent = '❌ 请确认后端已启动';
        msg.className = 'import-msg err';
      }
    };
    reader.readAsText(file);
  });
});

init();
</script>
