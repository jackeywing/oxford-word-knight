<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⛏️ Word-Knight | 牛津树单词冒险</title>
  <style>
    @font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/press-start-2p.woff2') format('woff2');}
    :root {
      --dirt:#8B5E3C; --grass:#5D8C2E; --gold:#F9A825; --emerald:#43A047;
      --panel-bg:#C4A46C; --panel-border:#6D4C2E;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Press Start 2P',-apple-system,sans-serif;
      background:linear-gradient(180deg,#87CEEB 0%,#B3E5FC 60%,#8B5E3C 60%,#6D4C2E 100%);
      min-height:100vh; overflow-x:hidden;
      image-rendering:pixelated; user-select:none; -webkit-user-select:none;
    }
    .clouds { position:fixed; top:0; left:0; width:100%; height:160px; pointer-events:none; z-index:0; overflow:hidden; }
    .cloud { position:absolute; background:#fff; border:3px solid #e0e0e0; box-shadow:4px 4px 0 #ddd; }
    .cloud:nth-child(1) { width:120px; height:40px; top:30px; left:10%; animation:drift 25s linear infinite; }
    .cloud:nth-child(2) { width:90px; height:32px; top:55px; left:50%; animation:drift 30s linear infinite; animation-delay:-10s; }
    .cloud:nth-child(3) { width:70px; height:28px; top:20px; left:80%; animation:drift 22s linear infinite; animation-delay:-5s; }
    @keyframes drift { 0%{transform:translateX(-200px)} 100%{transform:translateX(calc(100vw+200px))} }

    .app { position:relative; z-index:1; max-width:860px; margin:0 auto; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:100vh; }

    .mc-panel {
      background:var(--panel-bg); border:4px solid var(--panel-border);
      box-shadow:inset -2px -2px 0 rgba(0,0,0,0.2),inset 2px 2px 0 rgba(255,255,255,0.15),0 4px 0 #4A3020,0 6px 14px rgba(0,0,0,0.3);
      padding:12px;
    }

    .header { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; }
    .header h1 { color:#FFE0B2; text-shadow:2px 2px 0 #5D4037; font-size:0.9em; letter-spacing:2px; }
    .header h1 .pick { font-size:1.2em; animation:pickBounce 1s ease infinite; }
    @keyframes pickBounce { 0%,100%{transform:translateY(0) rotate(-10deg)} 50%{transform:translateY(-4px) rotate(5deg)} }

    .nav-tabs { display:flex; gap:6px; padding:8px; }
    .tab { flex:1; text-align:center; text-decoration:none; font-family:inherit; font-size:0.46em;
      padding:12px 10px; background:#E0C9A6; color:#5D4037; border:2px solid #8D6E63;
      box-shadow:0 3px 0 #6D4C2E; transition:all 0.15s; line-height:1.4; }
    .tab:hover { transform:translateY(-2px); box-shadow:0 5px 0 #6D4C2E; }
    .tab.active { background:#FFD54F; color:#3E2723; border-color:#F9A825; box-shadow:0 3px 0 #C17900; }

    .char-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .char-row label { color:#3E2723; font-size:0.48em; }
    .char-card { width:52px; height:68px; background:#E0C9A6; border:2px solid #8D6E63; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 2px 0 #6D4C2E; transition:all 0.2s; }
    .char-card:hover { transform:translateY(-2px); }
    .char-card.selected { border-color:#FFD54F; box-shadow:0 0 0 3px rgba(255,213,79,0.4),0 2px 0 #6D4C2E; }
    .char-card .face { font-size:1.6em; } .char-card .name { font-size:0.35em; color:#3E2723; }

    .hud { display:flex; gap:6px; flex-wrap:wrap; }
    .hud-item { flex:1; min-width:55px; background:#5D4037; border:2px solid #3E2723; padding:6px 8px; color:#FFE0B2; text-align:center; box-shadow:0 2px 0 #3E2723; }
    .hud-item .val { font-size:0.8em; margin-top:2px; color:#FFD54F; } .hud-item .lbl { font-size:0.35em; opacity:0.75; }
    .xp-wrap { width:100%; height:14px; background:#3E2723; border:2px solid #4A3020; position:relative; }
    .xp-fill { height:100%; background:linear-gradient(90deg,#66BB6A,#AED581); transition:width 0.4s; }
    .xp-text { position:absolute; top:50%;left:50%;transform:translate(-50%,-50%); font-size:0.38em; color:#FFE0B2; text-shadow:1px 1px 0 #000; }

    .path-box { position:relative; height:140px; background:linear-gradient(180deg,#87CEEB 0%,#B3E5FC 55%,#7C9C3A 55%,#8B5E3C 100%); border:3px solid #4A3020; overflow:hidden; }
    .path-nodes { position:absolute; bottom:50px; left:30px; right:30px; display:flex; align-items:center; height:32px; }
    .path-line { height:5px; background:#8D6E63; flex:1; margin:0 -1px; border-top:1px solid #A1887F; border-radius:2px; }
    .pn { flex-shrink:0; width:30px; height:30px; border:2px solid #4A3020; display:flex; align-items:center; justify-content:center; font-size:0.85em; transition:all 0.3s; }
    .pn.pend { background:#BDBDBD; } .pn.actv { background:#FFD54F; border-color:#F9A825; transform:scale(1.2); animation:glow 0.7s ease infinite alternate; }
    .pn.ok { background:#66BB6A; border-color:#388E3C; } .pn.bad { background:#EF5350; border-color:#C62828; }
    @keyframes glow { 0%{box-shadow:0 0 4px rgba(255,213,79,0.6)} 100%{box-shadow:0 0 14px rgba(255,213,79,0.9)} }

    .char-sprite { position:absolute; bottom:30px; font-size:2.5em; transition:left 0.6s cubic-bezier(0.34,1.56,0.64,1); z-index:10; filter:drop-shadow(2px 3px 0 rgba(0,0,0,0.3)); pointer-events:none; }
    .char-sprite.jump { animation:charJump 0.5s ease; }
    @keyframes charJump { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-28px) rotate(-5deg)} }

    .ch-area { min-height:160px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .ch-card { background:#FFF8E1; border:4px solid #8D6E63; box-shadow:0 5px 0 #5D4037,0 6px 14px rgba(0,0,0,0.2); padding:20px; width:100%; max-width:660px; animation:cardIn 0.4s ease; }
    @keyframes cardIn { 0%{transform:translateY(14px) scale(0.96);opacity:0} 100%{transform:translateY(0) scale(1);opacity:1} }
    .ch-card .ch-hint { font-size:0.45em; color:#8D6E63; margin-bottom:8px; }
    .ch-card .ch-sentence { font-size:1.05em; color:#3E2723; margin-bottom:12px; line-height:1.6; text-align:center; font-family:-apple-system,'PingFang SC',sans-serif; font-weight:600; }
    .ch-card .ch-blanked { font-size:1.3em; color:#3E2723; text-align:center; margin-bottom:16px; letter-spacing:4px; }
    .ch-card .ch-input { font-family:'Press Start 2P',monospace; font-size:1.1em; padding:12px 16px; width:200px; text-align:center; border:4px solid #BDBDBD; background:#fff; letter-spacing:6px; text-transform:lowercase; outline:none; transition:border-color 0.2s; }
    .ch-card .ch-input:focus { border-color:#F9A825; }
    .ch-card .ch-input.ok { border-color:#66BB6A; background:#E8F5E9; }
    .ch-card .ch-input.ng { border-color:#EF5350; background:#FFEBEE; animation:shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

    .timer-wrap { width:100%; height:10px; background:#E0E0E0; border:2px solid #BDBDBD; margin-bottom:10px; position:relative; border-radius:2px; overflow:hidden; }
    .timer-bar { height:100%; background:#66BB6A; transition:width 1s linear,background 0.5s; border-radius:1px; }
    .timer-bar.warn { background:#FFA726; } .timer-bar.danger { background:#EF5350; animation:pulse 0.5s ease infinite alternate; }
    @keyframes pulse { 0%{opacity:1} 100%{opacity:0.5} }
    .timer-num { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:0.45em; color:#3E2723; font-weight:bold; }

    .mc-btn { padding:12px 24px; font-family:inherit; font-size:max(0.66em,12.5px); background:#5D8C2E; color:#FFE0B2; border:3px solid #33691E; box-shadow:0 4px 0 #33691E; cursor:pointer; transition:all 0.15s; }
    .mc-btn:hover { transform:translateY(-2px); box-shadow:0 6px 0 #33691E; }
    .mc-btn:active,.mc-btn.down { transform:translateY(2px); box-shadow:0 2px 0 #33691E; }
    .mc-btn.down { opacity:0.6; pointer-events:none; }
    .mc-btn.blue { background:#1565C0; border-color:#0D47A1; box-shadow:0 4px 0 #0D47A1; }

    .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); padding:12px 24px; font-family:inherit; font-size:0.48em; z-index:100; pointer-events:none; border:3px solid; box-shadow:0 4px 0 rgba(0,0,0,0.2); opacity:0; }
    .toast.show { opacity:1; animation:toastIn 0.4s ease,toastOut 0.4s ease 2s forwards; }
    .toast.ok { background:#C8E6C9; border-color:#388E3C; color:#2E7D32; }
    .toast.bad { background:#FFCDD2; border-color:#C62828; color:#B71C1C; }
    .toast.great { background:#FFF9C4; border-color:#F9A825; color:#F57F17; }
    @keyframes toastIn { 0%{opacity:0;transform:translateX(-50%) translateY(-16px)} 100%{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes toastOut { 0%{opacity:1} 100%{opacity:0;transform:translateX(-50%) translateY(-16px)} }

    .ov-card { margin:10px auto; }
    .ov-card h2 { color:#FFD54F; font-size:0.72em; text-shadow:2px 2px 0 #5D4037; margin-bottom:10px; }
    .egg { font-size:6em; animation:eggBounce 0.6s ease infinite alternate; margin:10px 0; }
    @keyframes eggBounce { 0%{transform:translateY(0)} 100%{transform:translateY(-10px)} }
    .ov-card p { color:#3E2723; font-size:0.48em; line-height:1.8; }
    .ov-tbl { width:100%; border-collapse:collapse; margin:10px auto; }
    .ov-tbl th,.ov-tbl td { padding:5px 8px; font-size:0.42em; border:2px solid #8D6E63; }
    .ov-tbl th { background:#5D4037; color:#FFE0B2; }
    .ov-tbl td { color:#3E2723; } .ov-tbl .fail { color:#E53935; font-weight:bold; }

    .particles { position:fixed; inset:0; pointer-events:none; z-index:60; }
    .p { position:absolute; font-size:1.1em; animation:pUp 0.9s ease forwards; }
    @keyframes pUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-60px) scale(0.3)} }

    .grass-footer { position:fixed; bottom:0; left:0; right:0; height:14px; background:repeating-linear-gradient(90deg,var(--grass) 0px,var(--grass) 4px,#4A7A1E 4px,#4A7A1E 8px); z-index:0; border-top:2px solid #3E6A12; }

    @media (max-width:600px) {
      .header h1 { font-size:0.65em; } .ch-card .ch-sentence { font-size:0.8em; }
      .char-sprite { font-size:2em; } .path-box { height:110px; }
      .ch-card .ch-input { width:150px; font-size:0.85em; }
    }

    /* ── iPad / 平板适配（Chrome on iPadOS 走 WebKit）── */
    html { -webkit-text-size-adjust:100%; }
    body { touch-action:manipulation; }
    @media (min-width:768px) {          /* iPad 竖屏 768 起 */
      html { font-size:17px; }
      .app { max-width:940px; padding:14px; gap:10px; }
      .ch-card { max-width:760px; padding:24px; }
    }
    @media (min-width:1024px) {         /* iPad 横屏 / 大屏 */
      html { font-size:18px; }
      .app { max-width:1060px; }
      .ch-card { max-width:840px; }
    }
    @media (min-width:768px) and (max-height:840px) {   /* 横屏纵向吃紧，压缩留白 */
      .app { gap:6px; padding:8px 14px; }
      .ch-card { padding:18px; }
    }
  </style>
</head>
<body>
<div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
<div class="grass-footer"></div>
<div class="particles" id="pcs"></div>

<div class="app">
  <div class="mc-panel header">
    <h1><span class="pick">⛏️</span>Word-Knight</h1>
  </div>

  <div class="mc-panel nav-tabs">
    <a class="tab" href="/practice">🎧 Phonics</a>
    <a class="tab active" href="/">⛏️ Word Adventure</a>
  </div>

  <div class="mc-panel char-row">
    <label>角色:</label>
    <div class="char-card selected" id="charBiff" onclick="sel('biff')"><div class="face">👧🏻‍</div><div class="name">Biff</div></div>
    <div class="char-card" id="charChip" onclick="sel('chip')"><div class="face">🧒🏻</div><div class="name">Chip</div></div>
    <div class="char-card" id="charKipper" onclick="sel('kipper')"><div class="face">👦🏻</div><div class="name">Kipper</div></div>
    <div class="char-card" id="charWilma" onclick="sel('wilma')"><div class="face">👧🏽</div><div class="name">Wilma</div></div>
    <div class="char-card" id="charFloppy" onclick="sel('floppy')"><div class="face">🐶</div><div class="name">Floppy</div></div>
  </div>

  <div class="hud">
    <div class="hud-item"><div class="lbl">🏆 得分</div><div class="val" id="s">0</div></div>
    <div class="hud-item"><div class="lbl">🔥 连击</div><div class="val" id="c">0</div></div>
    <div class="hud-item"><div class="lbl">📊 进度</div><div class="val" id="p">0/8</div></div>
    <div class="hud-item"><div class="lbl">⏳ 剩余</div><div class="val" id="t">40s</div></div>
  </div>
  <div class="xp-wrap"><div class="xp-fill" id="xpFill" style="width:0%"></div><div class="xp-text" id="xpText">XP 0/100</div></div>

  <div class="mc-panel" style="padding:0;overflow:hidden;">
    <div class="path-box"><div class="path-nodes" id="pnodes"></div><div class="char-sprite" id="csprite" style="left:6px;">👧🏻‍</div></div>
  </div>

  <div class="mc-panel ch-area" id="chArea">
    <div style="color:#5D4037;font-size:0.48em;text-align:center;padding:40px;">
      选择你的角色<br>开始冒险吧！
    </div>
  </div>

  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
    <button class="mc-btn" id="goBtn" onclick="go()">⚔️ 开始冒险</button>
    <button class="mc-btn blue" id="rstBtn" style="display:none;" onclick="rst()">🔄 重新开始</button>
    <a class="mc-btn" href="/practice" style="text-decoration:none;background:#6A1B9A;border-color:#4A148C;box-shadow:0 4px 0 #4A148C;">🎧 音素特训</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='/api';
const F={biff:'👧🏻‍',chip:'🧒🏻',kipper:'👦🏻',wilma:'👧🏽',floppy:'🐶'};
const NM={biff:'Biff',chip:'Chip',kipper:'Kipper',wilma:'Wilma',floppy:'Floppy'};
/* ── 会话埋点：同一个 IP 的一次 session 内的全部行为 ── */
const SID=(()=>{try{let v=sessionStorage.getItem('owk_sid');if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,'').slice(0,16);sessionStorage.setItem('owk_sid',v);}return v;}catch(e){return 'nosid';}})();
function track(event,detail){
  try{
    fetch('/api/track',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sid:SID,event,detail:detail||'',player:(typeof ch!=='undefined'?ch:''),path:location.pathname})}).catch(()=>{});
  }catch(e){}
}
const attempts={};   // 每个词的答错次数（用于记录"失败重试"）
const N=8,TS=40;

if(document.readyState!=='loading'){setTimeout(()=>track('visit',{level:'G2'}),60)}else{document.addEventListener('DOMContentLoaded',()=>track('visit',{level:lv}));}
let playing=false;
let lv='G2',ch='biff',qs=[],i=0,sc=0,cb=0,mc=0,xp=0,ti=null,tl=0,ls=[],aud=null;

function beep(f,d,t='square'){try{if(!aud)aud=new(window.AudioContext||window.webkitAudioContext)();const o=aud.createOscillator(),g=aud.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.06;g.gain.exponentialRampToValueAtTime(0.001,aud.currentTime+d);o.connect(g);g.connect(aud.destination);o.start();o.stop(aud.currentTime+d)}catch(e){}}
function okB(){beep(523,0.1);setTimeout(()=>beep(659,0.1),100);setTimeout(()=>beep(784,0.15),200)}
function noB(){beep(180,0.35,'sawtooth')}
function cbB(){beep(784,0.07);setTimeout(()=>beep(988,0.07),70);setTimeout(()=>beep(1175,0.1),140)}
function wB(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18),i*140))}

function toast(m,c='ok'){const e=document.getElementById('toast');e.textContent=m;e.className='toast '+c+' show';setTimeout(()=>e.className='toast '+c,2400)}
function pt(x,y,e='✨',n=8){const c=document.getElementById('pcs');for(let j=0;j<n;j++){const p=document.createElement('div');p.className='p';p.textContent=e;p.style.left=(x+(Math.random()-0.5)*90)+'px';p.style.top=(y+(Math.random()-0.5)*40)+'px';p.style.animationDuration=(0.5+Math.random()*0.6)+'s';c.appendChild(p);setTimeout(()=>p.remove(),1300)}}

function sel(n){
  const _prev=ch;
  if(n===_prev) return;
  // 角色锁定：一轮闯关进行中不允许中途换人，必须重新开始
  if(playing){
    if(!confirm('角色已锁定 —— 切换角色会重新开始本轮闯关，确定吗？')) return;
    rst();
  }
  ch=n;document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));document.getElementById('char'+n.charAt(0).toUpperCase()+n.slice(1)).classList.add('selected');document.getElementById('csprite').textContent=F[n];if(_prev!==n)track('character_switch',{from:_prev,to:n});}

function dn(){
  const c=document.getElementById('pnodes');let h='';
  for(let j=0;j<N;j++){
    let cls='pend',ic='⬜';
    if(j<i){const lg=ls[j];cls=lg&&lg.ok?'ok':'bad';ic=lg&&lg.ok?'✅':'❌'}
    else if(j===i){cls='actv';ic='❓'}
    h+=`<div class="pn ${cls}">${ic}</div>`;if(j<N-1)h+='<div class="path-line"></div>';
  }c.innerHTML=h;
}
function mc_(){const s=document.getElementById('csprite'),w=document.getElementById('pnodes').offsetWidth,st=w/N;s.style.left=(st*i+st/2-12)+'px';s.textContent=F[ch];s.classList.add('jump');setTimeout(()=>s.classList.remove('jump'),500)}
function hud(){document.getElementById('s').textContent=sc;document.getElementById('c').textContent=cb;document.getElementById('p').textContent=i+'/'+qs.length;document.getElementById('t').textContent=tl+'s';document.getElementById('xpFill').style.width=xp+'%';document.getElementById('xpText').textContent='XP '+xp+'/100'}

function draw(){
  if(i>=qs.length){victory();return}
  ansLock=false;
  const q=qs[i];tl=TS;hud();timer();
  document.getElementById('chArea').innerHTML=`
    <div class="ch-card">
      <div class="ch-hint">💡 ${q.hint}</div>
      <div class="timer-wrap"><div class="timer-bar" id="tbar" style="width:100%"></div><div class="timer-num" id="tnum">${TS}s</div></div>
      <div class="ch-sentence">${q.clue||q.sentence}</div>
      <div class="ch-blanked">${q.blanked} <span style="color:#8D6E63;font-size:0.5em;">→ 填入 ${q.answerLen} 个字母</span></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
        <input class="ch-input" id="inp" type="text" maxlength="16" placeholder="补全字母" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="mc-btn" id="sbm" onclick="ans()">✓</button>
      </div>
    </div>`;
  const inp=document.getElementById('inp');inp.addEventListener('keydown',e=>{if(e.key==='Enter')ans()});setTimeout(()=>inp.focus(),100);
}

function timer(){clearInterval(ti);ti=setInterval(()=>{tl--;const b=document.getElementById('tbar'),n=document.getElementById('tnum');if(!b||!n){clearInterval(ti);return}const pct=(tl/TS)*100;b.style.width=pct+'%';b.className='timer-bar'+(pct<30?' danger':(pct<60?' warn':''));n.textContent=tl+'s';document.getElementById('t').textContent=tl+'s';if(tl<=0){clearInterval(ti);to()}},1000)}

function to(){if(ansLock)return;ansLock=true;const q=qs[i];ls.push({word:q.word,ok:false,to:true});cb=0;noB();toast('⏰ 时间到！','bad');const inp=document.getElementById('inp');if(inp){inp.disabled=true;inp.classList.add('ng');inp.value=q.word}const sb=document.getElementById('sbm');if(sb){sb.disabled=true;sb.classList.add('down')}setTimeout(()=>{ansLock=false;adv()},1500)}

let ansLock=false;
function ans(){
  if(ansLock)return;
  const inp=document.getElementById('inp'),a=(inp.value||'').trim().toLowerCase().replace(/\s+/g,''),q=qs[i],ok_=a===q.hidden||a===q.word.replace(/\s+/g,'');
  if(ok_){
    ansLock=true;clearInterval(ti);
    cb++;if(cb>mc)mc=cb;let pt_=10;if(cb>=10){pt_=50;cbB();toast('💎 '+cb+'连击！','great')}else if(cb>=5){pt_=30;cbB();toast('⭐ '+cb+'连击！','ok')}else if(cb>=3){pt_=20;cbB()}else okB();sc+=Math.round(pt_*(1+tl/TS));xp=Math.min(100,xp+pt_);inp.classList.add('ok');inp.disabled=true;document.getElementById('sbm').disabled=true;document.getElementById('sbm').classList.add('down');const r=inp.getBoundingClientRect();pt(r.left+r.width/2,r.top);ls.push({word:q.word,ok:true,to:false});try{const _k=String(q.word).toLowerCase(),_m=(JSON.parse(localStorage.getItem('owk_miss')||'[]')).filter(x=>x!==_k);localStorage.setItem('owk_miss',JSON.stringify(_m));}catch(e){};track('answer_ok',{word:q.word,retries:attempts[q.word]||0,left:tl});setTimeout(()=>{ansLock=false;adv()},700)
  }else{
    const _typed=String(inp.value||'').trim().toLowerCase();   // 清空前先留证据
    ansLock=true;noB();inp.classList.add('ng');inp.value='';
    setTimeout(()=>{inp.classList.remove('ng');inp.focus();ansLock=false},500);
    attempts[q.word]=(attempts[q.word]||0)+1;
    owkPushMiss(q.word);
    track('answer_wrong',{word:q.word,attempt:attempts[q.word],typed:_typed});
  }
  hud();
}

function adv(){clearInterval(ti);i++;dn();mc_();hud();if(i<qs.length){setTimeout(draw,500)}else{xp=100;hud();wB();fetch(API+'/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character:NM[ch],level:lv,score:sc,maxCombo:mc,wordsTotal:qs.length,wordsCorrect:ls.filter(l=>l.ok).length,wordsTimeout:ls.filter(l=>l.to).length,wordsWrong:ls.filter(l=>!l.ok&&!l.to).length,details:ls,sid:SID})}).catch(()=>{});track('round_finish',{score:sc,correct:ls.filter(l=>l.ok).length,total:qs.length,character:ch});setTimeout(victory,800)}}


function eggSnd(icon){
  if(!aud)aud=new(window.AudioContext||window.webkitAudioContext)();
  const t=aud.currentTime;
  const gan=(v,s,e,d)=>{const g=aud.createGain();g.gain.setValueAtTime(v,t+s);g.gain.exponentialRampToValueAtTime(0.001,t+s+d);return g};
  const osc=(f,ty,s,d)=>{const o=aud.createOscillator();o.type=ty;o.frequency.setValueAtTime(f,t+s);const g=gan(0.06,s,s+d);o.connect(g);g.connect(aud.destination);o.start(t+s);o.stop(t+s+d)};
  const nz=(s,d,lp)=>{const b=aud.createBufferSource(),bu=aud.createBuffer(1,aud.sampleRate*d,aud.sampleRate),dt=bu.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;b.buffer=bu;const f=aud.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||800;const g=gan(0.04,s,s+d);b.connect(f);f.connect(g);g.connect(aud.destination);b.start(t+s);b.stop(t+s+d)};
  switch(icon){
    case '🔑': osc(880,'sine',0,0.08);osc(1100,'sine',0.08,0.12);osc(1320,'sine',0.16,0.16);osc(1760,'sine',0.24,0.18);osc(2200,'sine',0.32,0.25);break;
    case '🏰': [523,659,784,1047].forEach((f,i)=>osc(f,'triangle',i*0.2,0.35));break;
    case '🐉': osc(80,'sawtooth',0,0.4);osc(60,'sawtooth',0.1,0.3);nz(0,0.3,200);break;
    case '🏴‍☠️': osc(440,'square',0,0.15);osc(330,'square',0.15,0.15);osc(440,'square',0.3,0.3);break;
    case '🌳': [1200,1400,1600,1400,1200].forEach((f,i)=>osc(f,'sine',i*0.08,0.08));break;
    case '👑': [523,659,784,1047,1318].forEach((f,i)=>osc(f,'triangle',i*0.25,0.45));break;
    case '🌊': nz(0,0.6,300);nz(0.3,0.5,200);break;
    case '🚀': osc(200,'sawtooth',0,0.3);osc(300,'sawtooth',0.1,0.3);osc(600,'sawtooth',0.2,0.4);break;
    case '🎪': [523,659,587,698,523].forEach((f,i)=>osc(f,'square',i*0.1,0.1));break;
    case '🏔️': nz(0,0.5,400);osc(400,'sine',0.1,0.3);break;
    case '🎨': [880,1100,1320,1760].forEach((f,i)=>osc(f,'sine',i*0.1,0.2));osc(2200,'sine',0.3,0.3);break;
    case '🦁': osc(60,'sawtooth',0,0.5);osc(80,'sawtooth',0.1,0.4);nz(0,0.4,150);break;
    case '🌌': [1760,2200,1760,2640,2200,3520].forEach((f,i)=>osc(f,'sine',i*0.12,0.18));break;
    case '🕯️': osc(600,'sine',0,0.15);osc(700,'sine',0.15,0.15);osc(800,'sine',0.3,0.3);osc(900,'sine',0.45,0.4);break;
    case '💎': [1760,2200,2640,3520].forEach((f,i)=>osc(f,'sine',i*0.08,0.16));break;
    case '🎭': osc(220,'triangle',0,0.2);osc(300,'triangle',0.15,0.3);osc(180,'sine',0.3,0.4);break;
    case '🌈': [523,659,784,1047,1318,1568].forEach((f,i)=>osc(f,'sine',i*0.15,0.25));break;
    case '🏕️': for(let j=0;j<8;j++)nz(j*0.08,0.15,200+Math.random()*300);break;
    default: osc(523,'sine',0,0.1);osc(659,'sine',0.1,0.1);osc(784,'sine',0.2,0.2);break;
  }
}

let eggIdx=0,eggPool=[];
function initEggs(){
  eggPool=[
    {icon:'🔑',title:'Magic Key!',desc:'Biff 在旧盒子里发现了一把闪闪发光的魔法钥匙！<br>它开始发光了——下一次冒险即将开始…'},
    {icon:'🏰',title:'秘密城堡',desc:'魔法钥匙带 Chip 来到了一座云端的城堡！<br>里面的图书馆有读不完的冒险故事。'},
    {icon:'🐉',title:'友善的龙',desc:'Kipper 遇到了 Dragon，但它并不想打架——<br>它想和你玩单词游戏！'},
    {icon:'🏴‍☠️',title:'海盗勋章',desc:'Pirate船长递给 Wilma 一枚勋章。<br>"你的词汇量比我的藏宝图还要棒！"'},
    {icon:'🌳',title:'魔法森林',desc:'你走进了一片发光的森林。<br>树上挂满了你会拼读的单词，每一片叶子都会唱歌。'},
    {icon:'👑',title:'皇冠加冕',desc:'国王亲自为勇敢的 Word-Knight 加冕！<br>"王国因你的智慧而骄傲！"'},
    {icon:'🌊',title:'海底王国',desc:'魔法钥匙化作潜水艇<br>带你见到了海底的美人鱼和会说英语的章鱼！'},

    {icon:'🎪',title:'马戏团之夜',desc:'Floppy 带孩子们溜进了马戏团！<br>小丑送了你一本会发光的魔法书。'},
    {icon:'🏔️',title:'雪山之巅',desc:'你爬到了雪山的最高处。<br>一只雪鹰送来了写着你名字的羽毛笔！'},
    {icon:'🎨',title:'画中世界',desc:'Biff 画了一扇门——门竟然推开了！<br>里面是一个由单词组成的彩色世界。'},
    {icon:'🦁',title:'狮子的考验',desc:'狮子王说："回答出我的单词谜题，<br>才能通过这座桥！"你轻松过关了！'},
    {icon:'🌌',title:'星光之夜',desc:'Kipper 用望远镜看到了流星。<br>每颗流星都是一个你学会的单词，正从天上落下。'},
    {icon:'🕯️',title:'远古图书馆',desc:'Wilma 找到了一本千年前的魔法词典。<br>每一页都在发光…它认出了你！'},
    {icon:'💎',title:'宝石矿洞',desc:'你挖到了一颗会说话的宝石！<br>它说："你答对的单词越多，我就越亮！"'},
    {icon:'🎭',title:'面具舞会',desc:'所有人戴着面具，但魔法钥匙认出了你。<br>"只有真正会拼单词的人才能摘下它！"'},
    {icon:'🌈',title:'彩虹尽头',desc:'在彩虹的尽头，你找到了一个罐子。<br>里面不是金子——而是无限的新单词！'},
    {icon:'🏕️',title:'篝火故事会',desc:'Chip 围着篝火讲了一个故事。<br>每讲一个单词火花就变成一簇烟花！'}
  ];
  for(let j=eggPool.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[eggPool[j],eggPool[k]]=[eggPool[k],eggPool[j]];}
  eggIdx=0;
}
function re(){
  if(eggIdx>=eggPool.length)initEggs();
  return eggPool[eggIdx++];
}
initEggs();

function victory(){
  playing=false;   // 本轮已结束，解除角色锁定
  const egg=re();try{eggSnd(egg.icon)}catch(e){}const cn=ls.filter(l=>l.ok).length,fn=ls.filter(l=>!l.ok).length,stars=cn===N?'⭐⭐⭐':(cn>=N*0.7?'⭐⭐':'⭐');
  let fr='';ls.forEach((l,j)=>{if(!l.ok)fr+=`<tr><td>${j+1}</td><td class="fail">${l.word}</td><td class="fail">${l.to?'⏰ 超时':'❌ 错误'}</td></tr>`});
  document.getElementById('chArea').innerHTML=`
    <div style="text-align:center;padding:18px;">
      <div class="egg">${egg.icon}</div><h2>${egg.title}</h2><p>${egg.desc}</p>
      <div style="margin:8px 0;">${stars}</div>
      <p>🏆 ${sc} 分 · 🔥 ${mc} 连击 · ✅ ${cn}/${N} 正确</p>
      ${fn?`<table class="ov-tbl"><thead><tr><th>#</th><th>单词</th><th>状态</th></tr></thead><tbody>${fr}</tbody></table>`:''}
      <p style="margin-top:10px;">👤 ${NM[ch]} · 📚 ${lv}</p>
      <button class="mc-btn" onclick="rst()" style="margin-top:10px;">🔄 再来一次</button>
    </div>`;
  document.getElementById('goBtn').style.display='none';
  document.getElementById('rstBtn').style.display='inline-block';
}

/* ── 跨轮记忆：最近 3 轮出现过的词 / 最近答错的词（localStorage，跨刷新保留）── */
function owkLS(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
function owkSeen(){return owkLS('owk_seen',[])}
function owkMiss(){return owkLS('owk_miss',[])}
function owkPushSeen(words){
  const keep=owkSeen().concat(words.map(w=>String(w).toLowerCase()));
  localStorage.setItem('owk_seen',JSON.stringify(keep.slice(-N*3)));
}
function owkPushMiss(word){
  const k=String(word||'').toLowerCase(); if(!k) return;
  const cur=owkMiss(); if(cur[cur.length-1]===k) return;
  localStorage.setItem('owk_miss',JSON.stringify(cur.concat([k]).slice(-30)));
}
function owkClearHistory(){localStorage.removeItem('owk_seen');localStorage.removeItem('owk_miss')}

async function load(){try{const _seen=owkSeen().join(','),_miss=owkMiss().join(',');
  const r=await fetch(`${API}/challenges?level=${lv}&count=${N}&character=${ch}&seen=${encodeURIComponent(_seen)}&miss=${encodeURIComponent(_miss)}`),d=await r.json();if(d.error||!d.length){document.getElementById('chArea').innerHTML=`<div style="text-align:center;padding:30px;color:#C62828;">⚠️ 字库为空</div>`;return false}if(d.length<4){document.getElementById('chArea').innerHTML=`<div style="text-align:center;padding:30px;color:#E65100;">⚠️ 字库不足</div>`;return false}qs=d;owkPushSeen(d.map(x=>x.word));return true}catch(e){document.getElementById('chArea').innerHTML=`<div style="text-align:center;padding:30px;color:#C62828;">❌ 无法连接</div>`;return false}}

async function go(){const ok=await load();if(!ok)return;track('round_start',{level:lv,character:ch,count:N});i=0;sc=0;cb=0;mc=0;xp=0;ls=[];tl=TS;clearInterval(ti);dn();mc_();hud();draw();document.getElementById('goBtn').style.display='none';document.getElementById('rstBtn').style.display='inline-block';playing=true}

function rst(){track('round_restart',{});clearInterval(ti);i=0;sc=0;cb=0;mc=0;xp=0;ls=[];qs=[];tl=TS;dn();mc_();hud();document.getElementById('chArea').innerHTML=`<div style="color:#5D4037;font-size:0.48em;text-align:center;padding:40px;">准备好了吗？<br>点击"开始冒险"！</div>`;document.getElementById('goBtn').style.display='inline-block';document.getElementById('rstBtn').style.display='none';playing=false}

dn();mc_();hud();window.addEventListener('resize',()=>{dn();mc_()});
</script>
