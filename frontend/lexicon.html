<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗂️ Word-Knight 词库浏览</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{ --bg:#2D1F0E; --panel:#3E2723; --gold:#FFD54F; --green:#66BB6A; --red:#EF5350; --text:#FFE0B2; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Press Start 2P',monospace; background:var(--bg); color:var(--text); min-height:100vh; padding:14px; }
.wrap{ max-width:1180px; margin:0 auto; }
h1{ color:var(--gold); font-size:0.8em; text-align:center; margin:12px 0; text-shadow:2px 2px 0 #1A0E00; }
h2{ color:var(--gold); font-size:0.55em; margin:14px 0 8px; }
.panel{ background:var(--panel); border:3px solid #5D4037; padding:12px; margin-bottom:10px; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
.tile{ background:#4A3020; border:2px solid #5D4037; padding:10px; text-align:center; }
.tile .k{ font-size:0.30em; color:#BCAAA4; margin-bottom:6px; }
.tile .v{ font-size:0.68em; color:var(--gold); }
.tile .v.green{ color:var(--green); } .tile .v.red{ color:var(--red); }
table{ width:100%; border-collapse:collapse; font-size:0.36em; }
th,td{ padding:5px 7px; border:2px solid #5D4037; text-align:left; }
th{ background:#4A3020; color:var(--gold); position:sticky; top:0; z-index:2; }
td.c,th.c{ text-align:center; }
tr:hover td{ background:#4A3020; }
.green{ color:var(--green); } .red{ color:var(--red); } .gold{ color:var(--gold); } .dim{ color:#8D6E63; }
.badge{ display:inline-block; padding:2px 6px; border-radius:2px; font-size:0.9em; }
.badge.g1{ background:#5D8C2E; color:#fff; } .badge.g2{ background:#1565C0; color:#fff; }
.badge.ph{ background:#4527A0; color:#fff; margin-right:2px; }
.badge.phr{ background:#8D6E63; color:#fff; }
.bar{ display:inline-block; height:8px; background:var(--green); vertical-align:middle; }
.warn{ border:3px solid #C62828; background:#3E1A1A; padding:10px; margin-bottom:10px; font-size:0.38em; line-height:1.9; }
.warn b{ color:var(--red); }
.note{ font-size:0.34em; line-height:1.9; color:#BCAAA4; }
.ctl{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
input,select{ font-family:inherit; font-size:0.4em; padding:7px 9px; background:#4A3020; color:var(--text); border:2px solid #8D6E63; }
input:focus,select:focus{ outline:none; border-color:var(--gold); }
.btn{ padding:7px 12px; font-family:inherit; font-size:0.4em; cursor:pointer; background:#1565C0; color:#FFE0B2; border:2px solid #0D47A1; box-shadow:0 3px 0 rgba(0,0,0,.3); }
.btn:active{ transform:translateY(2px); box-shadow:none; }
.lnk{ font-size:0.38em; color:#888; text-align:center; margin:14px 0; }
.lnk a{ color:#42A5F5; margin:0 8px; }
.dup{ color:var(--red); font-weight:bold; }
code{ background:#4A3020; padding:1px 4px; color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
<h1>🗂️ Word-Knight 词库浏览</h1>

<div id="dupWarn"></div>

<h2>📊 总览</h2>
<div class="panel"><div class="tiles" id="tiles"></div></div>

<h2>📈 分布</h2>
<div class="panel">
  <div class="note" id="distLevel"></div>
  <div class="note" id="distSyl" style="margin-top:10px;"></div>
  <div class="note" id="distLetter" style="margin-top:10px;"></div>
</div>

<h2>🔍 词条列表 <span class="dim" id="cnt"></span></h2>
<div class="panel">
  <div class="ctl">
    <input id="q" placeholder="搜索单词 / 提示 / 句子…" style="flex:1;min-width:220px;">
    <select id="lv"><option value="">全部级别</option><option value="G1">G1</option><option value="G2">G2</option></select>
    <select id="kind">
      <option value="">全部类型</option>
      <option value="word">仅单词</option>
      <option value="phrase">仅短语</option>
      <option value="dup">仅有重复</option>
    </select>
    <select id="sort">
      <option value="az">按字母</option>
      <option value="len-asc">词长 ↑</option>
      <option value="len-desc">词长 ↓</option>
      <option value="syl-desc">音节 ↓</option>
    </select>
    <button class="btn" onclick="load()">🔄 刷新</button>
  </div>
  <table>
    <thead><tr>
      <th class="c" style="width:38px;">#</th>
      <th>单词</th><th class="c" style="width:60px;">级别</th>
      <th class="c" style="width:60px;">音节</th><th class="c" style="width:60px;">字母</th>
      <th>音素组合</th><th>提示</th><th>所在句</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="c">加载中…</td></tr></tbody>
  </table>
</div>

<div class="lnk">
  <a href="/">🎮 游戏</a>
  <a href="/practice">🎧 Phonics</a>
  <a href="/dashboard">🛠️ 数据看板</a>
</div>
</div>

<script>
let DATA = null, VIEW = [];

async function load(){
  try{
    const r = await fetch('/api/lexicon');
    DATA = await r.json();
    if(DATA.error){ document.getElementById('rows').innerHTML = '<tr><td colspan="8" class="c red">'+DATA.error+'</td></tr>'; return; }
    renderStats(); applyFilter();
  }catch(e){
    document.getElementById('rows').innerHTML = '<tr><td colspan="8" class="c red">加载失败：'+e.message+'</td></tr>';
  }
}

function renderStats(){
  const s = DATA.stats;
  const dupCount = s.duplicates.reduce((a,d)=>a+d.count-1,0);
  document.getElementById('tiles').innerHTML = [
    ['总行数', s.rows, ''],
    ['唯一单词', s.unique, ''],
    ['重复冗余', dupCount, dupCount ? 'red' : 'green'],
    ['短语（含空格）', s.phrases, s.phrases ? 'red' : 'green'],
    ['平均词长', s.avgLen, ''],
    ['有例句', s.withSentence, ''],
    ['含人物名', s.withCharacter, ''],
  ].map(([k,v,c])=>`<div class="tile"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('');

  document.getElementById('distLevel').innerHTML =
    '<b class="gold">级别</b>：' + Object.entries(s.byLevel).map(([k,v])=>`<span class="badge ${k.toLowerCase()}">${k}</span> ${v} 条`).join(' &nbsp; ');

  const maxS = Math.max(...Object.values(s.syllables), 1);
  document.getElementById('distSyl').innerHTML = '<b class="gold">音节数</b>：' +
    Object.entries(s.syllables).map(([k,v])=>{
      const w = Math.round(v/maxS*120);
      return `${k} 音节 <span class="bar" style="width:${w}px"></span> ${v}`;
    }).join(' &nbsp; ');

  const maxL = Math.max(...Object.values(s.letters), 1);
  document.getElementById('distLetter').innerHTML = '<b class="gold">首字母</b>：' +
    Object.entries(s.letters).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,v])=>{
      const w = Math.round(v/maxL*80);
      return `<span class="gold">${k.toUpperCase()}</span> <span class="bar" style="width:${w}px"></span> ${v}`;
    }).join(' &nbsp; ');

  const dw = document.getElementById('dupWarn');
  if(s.duplicates.length){
    dw.innerHTML = `<div class="warn"><b>⚠️ 发现 ${s.duplicates.length} 个重复词条</b>（共多余 ${dupCount} 行）：`
      + s.duplicates.map(d=>`<span class="dup">${d.word}</span>×${d.count}`).join('、')
      + '<br>同一轮答题里这些词可能被抽到两次 —— 这就是「重复出题」的直接原因。</div>';
  } else dw.innerHTML = '';
}

function applyFilter(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const lv = document.getElementById('lv').value;
  const kind = document.getElementById('kind').value;
  const sort = document.getElementById('sort').value;
  const dupSet = new Set(DATA.stats.duplicates.map(d=>d.word));

  VIEW = DATA.words.filter(w=>{
    if(lv && w.oxford_level !== lv) return false;
    if(kind === 'word' && w.isPhrase) return false;
    if(kind === 'phrase' && !w.isPhrase) return false;
    if(kind === 'dup' && !dupSet.has(String(w.word).toLowerCase())) return false;
    if(q){
      const hay = (w.word+' '+(w.hint||'')+' '+(w.sentence||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(sort === 'len-asc')  VIEW.sort((a,b)=>a.letters-b.letters||a.word.localeCompare(b.word));
  else if(sort === 'len-desc') VIEW.sort((a,b)=>b.letters-a.letters||a.word.localeCompare(b.word));
  else if(sort === 'syl-desc') VIEW.sort((a,b)=>b.syllables-a.syllables||a.word.localeCompare(b.word));
  else VIEW.sort((a,b)=>String(a.word).localeCompare(String(b.word)));

  document.getElementById('cnt').textContent = `（${VIEW.length} / ${DATA.words.length}）`;
  const tb = document.getElementById('rows');
  if(!VIEW.length){ tb.innerHTML = '<tr><td colspan="8" class="c dim">没有匹配的词</td></tr>'; return; }
  tb.innerHTML = VIEW.map((w,i)=>{
    const isDup = dupSet.has(String(w.word).toLowerCase());
    const ph = (w.phonemes||[]).map(g=>`<span class="badge ph">${g}</span>`).join('') || '<span class="dim">—</span>';
    return `<tr>
      <td class="c dim">${i+1}</td>
      <td class="${isDup?'dup':''}">${w.word}${isDup?' ⚠️':''}${w.isPhrase?' <span class="badge phr">短语</span>':''}</td>
      <td class="c"><span class="badge ${w.oxford_level.toLowerCase()}">${w.oxford_level}</span></td>
      <td class="c">${w.syllables}</td>
      <td class="c">${w.letters}</td>
      <td>${ph}</td>
      <td class="dim">${w.hint||''}</td>
      <td class="dim">${(w.sentence||'').slice(0,90)}</td>
    </tr>`;
  }).join('');
}

['q','lv','kind','sort'].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener(id==='q' ? 'input' : 'change', applyFilter);
});
load();
</script>
</body>
</html>
